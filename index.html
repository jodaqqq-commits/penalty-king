<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GOAL🥅</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1621;--card:#17212b;--card2:#1e2a38;--accent:#2aabee;--text:#fff;--muted:#8fa3b8;--good:#2ecc71;--bad:#e74c3c;--gold:#f1c40f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
#app{max-width:420px;margin:0 auto;padding:14px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;text-align:center;margin:6px 0}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn2{background:var(--card2);color:var(--text)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.avwrap{width:76px;height:76px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.25);flex:none;background:#0d3a1e}
.name{font-size:18px;font-weight:700}
.coins{color:var(--gold);font-weight:700}
.statline{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.statline b{color:var(--text)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #2b3a4d;background:var(--card2);color:#fff;font-size:16px;user-select:text}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:42px;height:42px;border-radius:12px;cursor:pointer;border:3px solid transparent}
.swatch.sel{border-color:#fff}
.stagewrap{position:relative}
canvas.game{width:100%;display:block;border-radius:16px}
#ovl{position:absolute;inset:0;pointer-events:none}
.goaltarget{position:absolute;pointer-events:auto;cursor:pointer;touch-action:none}
.powerwrap{position:absolute;left:8px;right:8px;bottom:10px;background:rgba(0,0,0,.55);border-radius:14px;padding:10px;pointer-events:auto}
.powerbar{position:relative;height:26px;border-radius:13px;background:#202d3d;overflow:hidden}
.zone{position:absolute;top:0;bottom:0}
.z-y{background:rgba(241,196,15,.35)}
.z-g{background:rgba(46,204,113,.5)}
.needle{position:absolute;top:-2px;bottom:-2px;width:4px;background:#fff;border-radius:2px;box-shadow:0 0 6px #000}
.kickbtn{margin-top:8px}
.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.35);border-radius:16px;pointer-events:auto}
.rtext{font-size:32px;font-weight:800;text-shadow:0 2px 8px #000;text-align:center}
.shopitem{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:10px}
.shopitem .btn{width:auto;padding:10px 14px;font-size:13px;white-space:nowrap}
.kitdot{width:34px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,.3);flex:none}
.small{font-size:12px;color:var(--muted)}
.hud{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.hud b{color:var(--gold)}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:10px;border-radius:12px;background:var(--card2);color:var(--muted);font-weight:700;border:none;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.prevwrap{background:linear-gradient(180deg,#12202e,#0d3a1e);border-radius:14px;display:flex;justify-content:center;padding:6px 0}
.sndbtn{width:auto!important;padding:8px 12px!important;font-size:13px!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Telegram Web App ===== */
const tg = window.Telegram && window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0e1621');tg.setBackgroundColor('#0e1621');}catch(e){}}
function haptic(t){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(t)}catch(e){}}

/* ===== Звук (WebAudio, без файлов) ===== */
const AS={ctx:null,muted:false,
 init(){if(this.ctx)return;try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  this.ctx=new C();
  this.master=this.ctx.createGain();
  this.master.gain.value=this.muted?0:1;
  this.master.connect(this.ctx.destination);
  const b=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate);
  const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  this.nb=b;this.crowd();
 }catch(e){}},
 crowd(){const c=this.ctx;if(!c)return;try{
  const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  const g=c.createGain();g.gain.value=0.03;
  s.connect(f);f.connect(g);g.connect(this.master);s.start();
 }catch(e){}},
 noise(dur,freq,vol,when=0){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime+when;
  const s=c.createBufferSource();s.buffer=this.nb;s.playbackRate.value=0.7+Math.random()*0.6;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(this.master);s.start(t0);s.stop(t0+dur+0.05);
 }catch(e){}},
 tone(fr,dur,vol,type='sine',when=0){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime+when;
  const o=c.createOscillator();o.type=type;o.frequency.value=fr;
  const g=c.createGain();g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+0.02);
 }catch(e){}},
 kickSnd(){if(this.muted)return;this.noise(0.09,900,0.5);this.tone(75,0.12,0.5,'sine')},
 goalSnd(){if(this.muted)return;
  this.noise(2.6,600,0.95);this.noise(2.2,1100,0.6,0.12);this.noise(1.6,2600,0.35,0.25);this.noise(1.1,3500,0.18,0.4);
  this.tone(48,1.8,0.5,'sine',0.05);
  this.tone(2300,0.35,0.22,'square',0.1);this.tone(2300,0.55,0.22,'square',0.6)},
 oohSnd(){if(this.muted)return;
  this.noise(1.0,420,0.34);this.noise(0.75,900,0.2,0.08);this.tone(215,0.75,0.14,'sine',0.05)},
 saveSnd(){if(this.muted)return;this.tone(95,0.15,0.5);this.noise(0.12,300,0.3)},
 postSnd(){if(this.muted)return;this.tone(1400,0.5,0.4,'triangle');this.tone(2100,0.4,0.25,'triangle',0.02)},
 missSnd(){if(this.muted)return;this.noise(0.25,500,0.2)}
};
try{AS.muted=localStorage.getItem('goal_mute')==='1'}catch(e){}
document.addEventListener('pointerdown',()=>AS.init(),{once:true});
function toggleMute(){AS.muted=!AS.muted;try{localStorage.setItem('goal_mute',AS.muted?'1':'0')}catch(e){}if(!AS.muted)AS.init();if(AS.master)AS.master.gain.value=AS.muted?0:1;nav()}

/* ===== Данные ===== */
const SAVE_KEY='goal_game_v1';
const SKINS=['#f7d7b5','#f0c08a','#d9a06b','#b97a4e','#8a5a33','#5f3d22'];
const KITS=[
 {n:'Классика',price:0,shirt:'#d63031',shirt2:'#ffffff',shorts:'#ffffff',pattern:'plain'},
 {n:'Реал Мадрид',price:150,shirt:'#f5f6fa',shirt2:'#f5f6fa',shorts:'#f5f6fa',pattern:'plain'},
 {n:'Барселона',price:200,shirt:'#a50044',shirt2:'#004d98',shorts:'#004d98',pattern:'halves'},
 {n:'Манчестер Сити',price:200,shirt:'#6cabdd',shirt2:'#6cabdd',shorts:'#ffffff',pattern:'plain'},
 {n:'Ливерпуль',price:250,shirt:'#c8102e',shirt2:'#c8102e',shorts:'#c8102e',pattern:'plain'},
 {n:'Бавария',price:200,shirt:'#dc052d',shirt2:'#dc052d',shorts:'#dc052d',pattern:'plain'},
 {n:'Ювентус',price:180,shirt:'#f5f6fa',shirt2:'#111111',shorts:'#f5f6fa',pattern:'stripes'},
 {n:'Арсенал',price:220,shirt:'#ef0107',shirt2:'#ffffff',shorts:'#ffffff',pattern:'sleeves'},
 {n:'ПСЖ',price:250,shirt:'#004170',shirt2:'#d00027',shorts:'#004170',pattern:'stripe'},
 {n:'Боруссия Д',price:200,shirt:'#fde100',shirt2:'#fde100',shorts:'#fde100',pattern:'plain'}];
const HAIRS=[
 {n:'Короткая',price:0,icon:'✂️'},
 {n:'Ёжик',price:80,icon:'🦔'},
 {n:'Длинная',price:100,icon:'💇'},
 {n:'Афро',price:150,icon:'🌳'},
 {n:'Ирокез',price:150,icon:'🎸'},
 {n:'Лысая',price:0,icon:'🧑‍🦲'}];
const BOOTS=[
 {n:'Классика чёрные',price:0,acc:0,c:'#222222'},
 {n:'Белые фирменные',price:100,acc:1,c:'#f2f2f2'},
 {n:'Неоновые',price:200,acc:2,c:'#39ff88'},
 {n:'Золотые',price:500,acc:3,c:'#f5b301'}];

function defPlayer(){return{name:'',number:9,coins:50,goals:0,pens:0,best:0,created:false,
 look:{skin:1,hair:0,kit:0,boots:0},own:{kits:[0],hairs:[0,5],boots:[0]}}}
let P;
try{P=JSON.parse(localStorage.getItem(SAVE_KEY))||null}catch(e){P=null}
if(!P||!P.look||!P.own){const d=defPlayer();P=Object.assign(d,P||{});P.look=d.look;P.own=d.own}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(P))}

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function app(html){$('app').innerHTML=html;window.scrollTo(0,0)}
function kitDot(k){return `background:linear-gradient(180deg,${k.shirt} 0 62%,${k.shorts} 62% 100%)`}
function sndBtn(){return `<button class="btn btn2 sndbtn" onclick="toggleMute()">${AS.muted?'🔇':'🔊'}</button>`}

/* ===== Главное меню ===== */
function nav(){P.created?home():create()}
function home(){
 app(`<div class="row"><h1 class="grow" style="text-align:left">GOAL🥅</h1>${sndBtn()}</div>
 <div class="card">
   <div class="row">
     <div class="avwrap"><canvas id="av" width="76" height="76"></canvas></div>
     <div class="grow"><div class="name">${esc(P.name)} · №${P.number}</div>
     <div class="coins">🪙 ${P.coins} монет</div></div>
   </div>
   <div class="statline"><span>Голов: <b>${P.goals}</b></span><span>Пенальти: <b>${P.pens}</b></span><span>Рекорд серии: <b>${P.best}</b></span></div>
 </div>
 <button class="btn" onclick="startGame()">▶️ Играть</button>
 <button class="btn btn2" onclick="shop()">🛒 Магазин</button>
 <button class="btn btn2" onclick="stats()">📊 Статистика</button>
 <button class="btn btn2" onclick="topScr()">🏆 Топ игроков</button>
 <div class="small" style="text-align:center;opacity:.55">версия игры: <b>v7.3</b> 🏆</div>`);
 const c=$('av');if(c)drawStriker(c.getContext('2d'),38,74,{scale:0.8});
}

/* ===== Создание персонажа ===== */
let tmp={name:'Игрок',skin:1,number:9,_init:0};
function create(){
 const tgName=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name;
 if(tgName&&!tmp._init){tmp.name=tgName;tmp._init=1}
 app(`<h1>Создай игрока</h1>
 <div class="card">
  <div class="prevwrap"><canvas id="pv" width="260" height="300"></canvas></div>
  <div><div class="small">ИМЯ</div><input id="nm" maxlength="12" value="${esc(tmp.name)}" oninput="tmp.name=this.value;updPv()"></div>
  <div><div class="small">ЦВЕТ КОЖИ</div><div class="swatches">${SKINS.map((s,i)=>`<div class="swatch ${i===tmp.skin?'sel':''}" style="background:${s}" onclick="tmp.skin=${i};create()"></div>`).join('')}</div></div>
  <div><div class="small">НОМЕР</div><div class="row"><button class="btn btn2" onclick="tmp.number=Math.max(1,tmp.number-1);create()">−</button><div class="grow" style="text-align:center;font-size:24px;font-weight:800">${tmp.number}</div><button class="btn btn2" onclick="tmp.number=Math.min(99,tmp.number+1);create()">+</button></div></div>
 </div>
 <button class="btn" onclick="finishCreate()">Сохранить</button>
 <div class="small" style="text-align:center">Форму, причёску и бутсы купишь в магазине за монеты 🪙</div>`);
 const c=$('pv');if(c){c.getContext('2d').setTransform(2,0,0,2,0,0);updPv()}
}
function updPv(){const c=$('pv');if(c)drawStriker(c.getContext('2d'),65,144,{scale:1.35})}
function finishCreate(){
 const nm=(tmp.name||'').trim();
 if(!nm){alert('Введи имя!');return}
 P.name=nm.slice(0,12);P.look.skin=tmp.skin;P.number=tmp.number;P.created=true;save();haptic('success');home();
}

/* ===== Магазин ===== */
let shopTab='kits';
function shop(){
 const tabs=`<div class="tabs">
  <button class="tab ${shopTab==='kits'?'on':''}" onclick="shopTab='kits';shop()">👕 Формы</button>
  <button class="tab ${shopTab==='hairs'?'on':''}" onclick="shopTab='hairs';shop()">💇 Причёски</button>
  <button class="tab ${shopTab==='boots'?'on':''}" onclick="shopTab='boots';shop()">👟 Бутсы</button>
 </div>`;
 let items='';
 if(shopTab==='kits'){
  items=KITS.map((k,i)=>{
   const owned=P.own.kits.includes(i),eq=P.look.kit===i;
   const btn=eq?`<button class="btn btn2" disabled>Надета</button>`
     :owned?`<button class="btn" onclick="wear('kit',${i})">Надеть</button>`
     :`<button class="btn" onclick="buy('kit',${i})">${k.price} 🪙</button>`;
   return `<div class="shopitem"><div class="kitdot" style="${kitDot(k)}"></div><div class="grow">${k.n}<div class="small">Официальная форма клуба</div></div>${btn}</div>`;
  }).join('');
 }else if(shopTab==='hairs'){
  items=HAIRS.map((h,i)=>{
   const owned=P.own.hairs.includes(i),eq=P.look.hair===i;
   const btn=eq?`<button class="btn btn2" disabled>Надета</button>`
     :owned?`<button class="btn" onclick="wear('hair',${i})">Надеть</button>`
     :`<button class="btn" onclick="buy('hair',${i})">${h.price} 🪙</button>`;
   return `<div class="shopitem"><div class="kitdot" style="background:#2c1e12;display:flex;align-items:center;justify-content:center;font-size:18px">${h.icon}</div><div class="grow">${h.n}</div>${btn}</div>`;
  }).join('');
 }else{
  items=BOOTS.map((b,i)=>{
   const owned=P.own.boots.includes(i),eq=P.look.boots===i;
   const btn=eq?`<button class="btn btn2" disabled>Надеты</button>`
     :owned?`<button class="btn" onclick="wear('boots',${i})">Надеть</button>`
     :`<button class="btn" onclick="buy('boots',${i})">${b.price} 🪙</button>`;
   return `<div class="shopitem"><div class="kitdot" style="background:${b.c};border-color:rgba(255,255,255,.5)"></div><div class="grow">${b.n}<div class="small">Зелёная зона точности +${b.acc>0?b.acc:'0'}</div></div>${btn}</div>`;
  }).join('');
 }
 app(`<div class="row"><h1 class="grow" style="text-align:left">🛒 Магазин</h1><div class="coins">🪙 ${P.coins}</div>${sndBtn()}</div>
 ${tabs}
 <div class="prevwrap"><canvas id="pv" width="260" height="300"></canvas></div>
 <div class="card">${items}</div>
 <button class="btn btn2" onclick="home()">← Назад</button>`);
 const c=$('pv');if(c){c.getContext('2d').setTransform(2,0,0,2,0,0);updPv()}
}
function buy(cat,i){
 const list=cat==='kit'?KITS:cat==='hair'?HAIRS:BOOTS;
 const it=list[i];
 if(P.coins<it.price){alert('Не хватает монет! Забей больше пенальти ⚽');return}
 P.coins-=it.price;
 const key=cat==='kit'?'kits':cat==='hair'?'hairs':'boots';
 P.own[key].push(i);
 wear(cat,i,true);
}
function wear(cat,i,silent){
 if(cat==='kit')P.look.kit=i;
 else if(cat==='hair')P.look.hair=i;
 else P.look.boots=i;
 save();if(!silent)haptic('success');
 shop();
}

/* ===== Статистика ===== */
function stats(){
 const acc=P.pens?Math.round(P.goals/P.pens*100):0;
 app(`<h1>📊 Статистика</h1>
 <div class="card">
   <div class="statline"><span>Игрок</span><b>${esc(P.name)} · №${P.number}</b></div>
   <div class="statline"><span>Форма</span><b>${KITS[P.look.kit].n}</b></div>
   <div class="statline"><span>Пенальти пробито</span><b>${P.pens}</b></div>
   <div class="statline"><span>Голов забито</span><b>${P.goals}</b></div>
   <div class="statline"><span>Реализация</span><b>${acc}%</b></div>
   <div class="statline"><span>Лучшая серия голов</span><b>${P.best}</b></div>
   <div class="statline"><span>Монет</span><b>🪙 ${P.coins}</b></div>
 </div>
 <button class="btn btn2" onclick="home()">← Назад</button>`);
}

/* ===== Топ игроков (общая таблица по голам) ===== */
/* ===== ТОП ИГРОКОВ (хранилище Supabase) =====
   Подключение подставляет ассистент: SB_URL (адрес проекта) + SB_KEY (anon key) */
const SB_URL='https://nbsgxrhdiftzhysjhfci.supabase.co';
const SB_KEY='sb_publishable_7f70P80cTeeDqwZxJHgKLw_y9z97y1Q';
let topCache=null;

async function sb(path,opts){
 opts=opts||{};
 opts.headers=Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},opts.headers||{});
 const r=await fetch(SB_URL+'/rest/v1/'+path,opts);
 if(!r.ok)throw new Error('supabase '+r.status);
 return r.json();
}
/* --- чтение таблицы --- */
async function loadTop(force){
 if(topCache&&!force)return topCache;
 try{
  let arr=null;
  if(SB_URL&&SB_KEY)arr=await sb('top?select=name,goals&order=goals.desc&limit=10');
  topCache=Array.isArray(arr)?arr.filter(p=>p&&p.name):[];
 }catch(e){topCache=null}
 return topCache;
}
/* --- запись результата (вставка или обновление по имени) --- */
async function submitTop(){
 try{
  if(!SB_URL||!SB_KEY)return;
  await sb('top?on_conflict=name',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({name:P.name,goals:P.goals})});
  topCache=null;
 }catch(e){}
}
function topScr(){
 app(`<h1>🏆 Топ игроков</h1><div class="coins" style="text-align:center">по забитым голам ⚽</div>
 <div class="card" id="topbox"><div class="small" style="text-align:center">Загружаем таблицу…</div></div>
 <div class="row"><button class="btn btn2 grow" onclick="home()">← Назад</button><button class="btn" style="width:auto;padding:12px 20px" onclick="topScr()">🔄 Обновить</button></div>`);
 loadTop(true).then(arr=>{
  const box=$('topbox');
  if(!box)return;
  if(!arr){box.innerHTML=`<div class="small" style="text-align:center">😕 Онлайн-таблица сейчас недоступна.<br><br>Твои голы: <b>${P.goals}</b> — попробуй позже!</div>`;return}
  const rows=arr.slice(0,10).map((p,i)=>{
   const medal=['🥇','🥈','🥉'][i]||(i+1)+'.';
   const me=p.name===P.name?' style="background:rgba(42,171,238,.28);border:1px solid var(--accent)"':'';
   return `<div class="shopitem"${me}><div class="kitdot" style="background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800">${medal}</div><div class="grow">${esc(p.name)}</div><b>⚽ ${p.goals}</b></div>`;
  }).join('');
  box.innerHTML=rows||'<div class="small" style="text-align:center">Пока пусто — стань первым! ⚽</div>';
 });
}

/* ===== Игра: Пенальти ===== */
let G=null,raf=null,idleRaf=null;
const BALL_START={x:180,y:335};
const GREEN_W=()=>0.06+BOOTS[P.look.boots].acc*0.012;

function startGame(){G={round:1,goals:0,earned:0,streak:0,phase:'aim',celT:0};play()}

function play(){
 app(`<div class="hud"><span>Раунд <b id="r">1</b>/5</span><span>Голы: <b id="g">0</b></span><span>🪙 <b id="c">0</b></span></div>
 <div class="stagewrap">
   <canvas id="cv" class="game" width="720" height="1040"></canvas>
   <div id="ovl"></div>
 </div>
 <div class="row">
  <button class="btn btn2 grow" onclick="quit()">🏳️ Завершить серию</button>
  ${sndBtn()}
 </div>
 <div class="small" style="text-align:center">1) Ткни точно <b>в ворота</b> → 2) Останови иглу в зелёной зоне. Углы — прибыльнее, но рискованнее!</div>`);
 const c=$('cv');c.getContext('2d').setTransform(2,0,0,2,0,0);
 draw();
 aimUI();
 startIdle();
}
function quit(){if(confirm('Завершить серию? Монеты сохранятся.')){stopIdle();save();submitTop();home()}}
function updHud(){const r=$('r'),g=$('g'),c=$('c');if(r)r.textContent=G.round;if(g)g.textContent=G.goals;if(c)c.textContent=G.earned}

function startIdle(){
 stopIdle();
 const loop=(tm)=>{draw(null,{t:tm/1000});idleRaf=requestAnimationFrame(loop)};
 idleRaf=requestAnimationFrame(loop);
}
function stopIdle(){if(idleRaf)cancelAnimationFrame(idleRaf);idleRaf=null}

/* --- Фаза 1: точный прицел (без сетки — тап прямо в ворота) --- */
function aimUI(){
 G.phase='aim';
 $('ovl').innerHTML=`<div class="goaltarget" style="left:${70/360*100}%;top:${110/520*100}%;width:${220/360*100}%;height:${110/520*100}%"
   onclick="aim(event)"></div>`;
}

/* --- Фаза 2: точность удара --- */
function aim(e){
 const rect=e.currentTarget.getBoundingClientRect();
 const p=(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0]:e;
 const cx=(p.clientX!==undefined)?p.clientX:rect.left+rect.width/2;
 const cy=(p.clientY!==undefined)?p.clientY:rect.top+rect.height/2;
 const fx=Math.min(0.99,Math.max(0.01,(cx-rect.left)/rect.width));
 const fy=Math.min(0.98,Math.max(0.02,(cy-rect.top)/rect.height));
 G.aim={px:fx*220,py:fy*110};
 G.phase='power';
 const gw=GREEN_W(),yw=0.155;
 $('ovl').innerHTML=`<div class="powerwrap"><div class="powerbar">
   <div class="zone z-y" style="left:${(50-yw*100)}%;width:${yw*2*100}%"></div>
   <div class="zone z-g" style="left:${(50-gw*100)}%;width:${gw*2*100}%"></div>
   <div class="needle" id="nd" style="left:-2px"></div></div>
   <button class="btn kickbtn" onclick="kick()">⚽ Бить!</button></div>`;
 const t0=performance.now(),speed=1.5;
 cancelAnimationFrame(raf);
 const loop=(t)=>{
   if(G.phase!=='power')return;
   const dt=(t-t0)/1000;
   G.pv=0.5+0.5*Math.sin(dt*speed*Math.PI*2-Math.PI/2);
   const nd=$('nd');
   if(nd)nd.style.left=`calc(${(G.pv*100).toFixed(2)}% - 2px)`;
   raf=requestAnimationFrame(loop);
 };
 raf=requestAnimationFrame(loop);
}

/* --- Удар --- */
function kick(){
 cancelAnimationFrame(raf);
 const d=Math.abs(G.pv-0.5);
 G.quality=d<GREEN_W()?'perfect':(d<0.155?'good':'bad');
 AS.kickSnd();
 resolve();
 G.phase='anim';
 $('ovl').innerHTML='';
 animate();
}

function segDist(px,py,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1;
 const u=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
 return Math.hypot(px-(x1+u*dx),py-(y1+u*dy));
}
function hitPost(cx,cy){
 const frame=[
  segDist(cx,cy,70,110,70,220),
  segDist(cx,cy,290,110,290,220),
  segDist(cx,cy,70,110,290,110)
 ];
 return Math.min(...frame)<7.5;
}

function resolve(){
 const q=G.quality;
 const ax=G.aim.px, ay=G.aim.py;
 let ex=0,ey=0;
 if(q==='good'){const an=Math.random()*6.283,r=8+Math.random()*10;ex=Math.cos(an)*r;ey=Math.sin(an)*r*0.6}
 else if(q==='bad'){const an=Math.random()*6.283,r=26+Math.random()*30;ex=Math.cos(an)*r;ey=Math.sin(an)*r*0.7}
 const fx=70+ax+ex, fy=110+ay+ey;
 G.fx=fx;G.fy=fy;
 G.miss=(fx<64||fx>296||fy<102||fy>226);
 if(!G.miss&&hitPost(fx,fy)){G.result='post';G.contact={cx:fx,cy:fy};G.coins=0;G.react=0.3;return}
 const fcc=Math.min(2,Math.max(0,Math.floor((fx-70)/(220/3))));
 const corner=Math.abs(fx-180)>74||fy<142;
 G.corner=corner;
 // --- физика сейва: вратарь следит за траекторией мяча ---
 const speedF=q==='perfect'?1:(q==='good'?0.72:0.5);
 const flightT=0.55/speedF;
 const reactT=q==='perfect'?0.3:(q==='good'?0.22:0.16);
 // вратарь иногда ошибается с прочтением
 const misread=Math.random()<(q==='perfect'?0.12:(q==='good'?0.2:0.25));
 const kc=misread?Math.max(0,Math.min(2,fcc+(Math.random()<0.5?-1:1))):fcc;
 G.kc=kc;
 G.react=reactT/flightT;   // доля полёта до начала прыжка
 G.speedF=speedF;
 // дистанция, которую вратарь может покрыть до мяча (бутсы помогают пробить его)
 const kdist=Math.hypot(G.fx-180,(G.fy-168)*0.95);
 const vK=280*(1-BOOTS[P.look.boots].acc*0.06);
 const reach=vK*Math.max(0,flightT-reactT)*(q==='perfect'?0.75:1)*(kc===fcc?1:0.25);
 // даже достающий вратарь иногда ошибается: чем лучше удар — тем чаще
 const saved=!G.miss&&kdist<=reach*(0.75+Math.random()*0.4)&&(Math.random()<(q==='perfect'?0.55:(q==='good'?0.6:0.9)));
 G.result=G.miss?'miss':(saved?'save':'goal');
 // точка касания перчаткой и направление отбивания (для анимации сейва)
 if(saved){
   G.contact={cx:Math.max(80,Math.min(280,G.fx)),cy:Math.max(118,Math.min(212,G.fy))};
   const dir=Math.abs(G.contact.cx-180)>30?Math.sign(G.contact.cx-180):(Math.random()<0.5?-1:1);
   G.defl={cx:G.contact.cx+dir*(70+Math.random()*40),cy:G.contact.cy+95+Math.random()*50};
   G.saveAt=0.55;
 }
 G.coins=G.result==='goal'?10+(corner?5:0)+(q==='perfect'?5:0):0;
}

/* --- Анимация --- */
function animate(){
 stopIdle();
 const ctx=$('cv').getContext('2d');
 const t0=performance.now();
 const DUR=950*(1.3-0.3*(G.speedF||1)); // плохой тайминг = медленный мяч
 const step=(tm)=>{
   const t=tm/1000;
   const k=Math.min(1,(tm-t0)/DUR);
   const runK=Math.min(1,k/0.3);
   const ky=396-44*runK+Math.sin(runK*Math.PI*3)*2.5;
   const kickK=Math.max(0,Math.min(1,(k-0.26)/0.22));
   let bx=BALL_START.x,by=BALL_START.y,ballK=0,tgt=null,e=0;
   if(k>0.3){
     ballK=Math.min(1,(k-0.3)/0.7);
     if(G.result==='post'){
       if(ballK<=0.65){e=1-Math.pow(1-ballK/0.65,3);tgt=G.contact}
       else{
         const u=(ballK-0.65)/0.35;
         const rx=G.contact.cx+(G.contact.cx-180)*0.6,ry=G.contact.cy+160;
         bx=G.contact.cx+(rx-G.contact.cx)*u;
         by=G.contact.cy+(ry-G.contact.cy)*u-Math.sin(u*Math.PI)*26;
       }
     }else if(G.result==='save'){
       // мяч долетает до перчатки и резко отбивается в сторону
       if(ballK<=G.saveAt){e=1-Math.pow(1-ballK/G.saveAt,3);tgt=G.contact}
       else{
         const u=(ballK-G.saveAt)/(1-G.saveAt);
         bx=G.contact.cx+(G.defl.cx-G.contact.cx)*u;
         by=G.contact.cy+(G.defl.cy-G.contact.cy)*u-Math.sin(u*Math.PI)*14;
       }
     }else if(G.result==='goal'){
       e=1-Math.pow(1-ballK,2.4);tgt={cx:G.fx,cy:G.fy+10};
     }else{
       e=1-Math.pow(1-ballK,3);tgt={cx:G.fx,cy:G.fy};
     }
     if(tgt){
       bx=BALL_START.x+(tgt.cx-BALL_START.x)*e;
       by=BALL_START.y+(tgt.cy-BALL_START.y)*e-Math.sin(ballK*Math.PI)*(G.result==='goal'?18:30);
     }
   }
   let keepK=0;
   if(G.react!==undefined){
     const end=(G.result==='save')?G.saveAt:1; // на сейве вратарь полностью растянут к моменту касания
     keepK=Math.max(0,Math.min(1,(ballK-G.react)/(end-G.react)));
   }
   draw(ctx,{t,keepK,ballK,bx,by,kickK,ky,runK});
   if(k<1)requestAnimationFrame(step);
   else{G.phase='result';finish()}
 };
 requestAnimationFrame(step);
}

/* --- Итог удара --- */
function finish(){
 P.pens++;
 if(G.result==='goal'){
   P.goals++;G.goals++;G.streak++;G.earned+=G.coins;P.coins+=G.coins;
   P.best=Math.max(P.best,G.streak);haptic('success');AS.goalSnd();
   G.celT=performance.now();
 }else{
   G.streak=0;haptic('error');
   if(G.result==='save'){AS.saveSnd();AS.oohSnd()}
   else if(G.result==='post'){AS.postSnd();AS.oohSnd()}
   else AS.missSnd();
 }
 save();updHud();
 const msgs={goal:`ГОЛ! ⚽ +${G.coins} 🪙`,save:'СЕЙВ! 🧤',miss:'МИМО! ❌',post:'ШТАНГА! 😱'};
 const col={goal:'var(--good)',save:'var(--accent)',miss:'var(--bad)',post:'var(--gold)'};
 $('ovl').innerHTML=`<div class="result"><div class="rtext" style="color:${col[G.result]}">${msgs[G.result]}</div>
  <button class="btn" style="width:auto;padding:12px 28px" onclick="next()">Дальше →</button></div>`;
}
function next(){
 if(G.round>=5){endGame();return}
 G.round++;G.phase='aim';
 updHud();aimUI();draw();startIdle();
}
function endGame(){
 stopIdle();
 let bonus=0;
 if(G.goals===5){bonus=25;P.coins+=bonus}
 save();
 app(`<h1>🏁 Серия окончена</h1>
 <div class="card" style="text-align:center">
  <div class="prevwrap"><canvas id="pv" width="260" height="300"></canvas></div>
  <div class="name">Голов: ${G.goals} / 5</div>
  <div class="coins" style="font-size:20px">+${G.earned+bonus} 🪙</div>
  ${bonus?'<div class="small">Бонус за идеальную серию: +25 🪙</div>':''}
 </div>
 <button class="btn" onclick="startGame()">🔁 Играть снова</button>
 <button class="btn btn2" onclick="home()">🏠 В меню</button>`);
 const c=$('pv');if(c){c.getContext('2d').setTransform(2,0,0,2,0,0);updPv()}
 submitTop(); // отправить результат в общий топ
}

/* ============================================================
   ГРАФИКА (холст 720x1040, логические координаты 360x520)
============================================================ */
function Pt(x,y,a,l){return{x:x+Math.sin(a)*l,y:y-Math.cos(a)*l}}

/* затемнение / осветление hex-цвета: amt от -1 до 1 */
function shade(hex,amt){
  const n=parseInt(String(hex).replace('#',''),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>=0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  else{r*=1+amt;g*=1+amt;b*=1+amt}
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
function lum(hex){
  const n=parseInt(String(hex).replace('#',''),16);
  return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;
}
function rrect(ctx,x,y,w,h,r){
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);return}
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* ============================ СЦЕНА ============================ */
function draw(ctx,a){
 ctx=ctx||$('cv').getContext('2d');
 a=a||{};
 const t=a.t||0;
 const W=360,H=520;
 const cel=(G&&G.celT)?Math.max(0,1-(performance.now()-G.celT)/1800):0;
 if(cel>0){const sh=cel*2.6;ctx.save();ctx.translate(Math.sin(t*55)*sh,Math.cos(t*42)*sh*0.6)} // тряска камеры при голе
 stadium(ctx,t,W,H);
 stands(ctx,t,cel);
 scoreboard(ctx,t);
 boards(ctx,t);
 pitch(ctx,W,H);
 goal(ctx);
 const ky=a.ky!==undefined?a.ky:396;
 drawStriker(ctx,180,ky,{run:a.runK||0,kick:a.kickK||0,scale:1.15,t});
 const dive=G&&(G.phase==='anim'||G.phase==='result');
 const kc=dive?G.kc:1;
 const side=kc===0?-1:kc===2?1:0;
 const kk=a.keepK||0;
 // предвкушение: до прыжка вратарь смещается в сторону мяча
 const ant=dive?Math.max(0,1-(a.ballK||0)/(G.react||0.4)):0;
 let kx=180+side*7*ant,ky2=206;
 if(kc===0)kx=106;else if(kc===2)kx=254;
 if(dive&&kc===1)ky2=199;
 kx=180+(kx-180)*kk;ky2=206+(ky2-206)*kk;
 // взгляд следит за мячом
 const look=dive?Math.max(-1,Math.min(1,((a.bx!==undefined?a.bx:180)-180)/70)):0;
 keeper(ctx,kx,ky2,{dive:kk,side,t,look});
 /* передние стойки ворот */
 ctx.strokeStyle='#f8f8f8';ctx.lineWidth=6;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(70,220);ctx.lineTo(70,110);ctx.lineTo(290,110);ctx.lineTo(290,220);ctx.stroke();
 ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(73,220);ctx.lineTo(73,112);ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(68,220);ctx.lineTo(68,108);ctx.stroke();
 ball(ctx,a);
 if(cel>0){confetti(ctx,t,cel);ctx.restore()}
}

/* --- Ночное небо + крыша стадиона --- */
function stadium(ctx,t,W,H){
 const sg=ctx.createLinearGradient(0,0,0,72);
 sg.addColorStop(0,'#04080f');sg.addColorStop(0.6,'#0c1a29');sg.addColorStop(1,'#17293c');
 ctx.fillStyle=sg;ctx.fillRect(0,0,W,72);
 for(let i=0;i<30;i++){
   const sx=(i*113)%360, sy=(i*29)%22;
   const tw=0.3+0.7*Math.abs(Math.sin(t*0.9+i*1.7));
   ctx.fillStyle=`rgba(255,255,255,${0.10+tw*0.22})`;
   ctx.fillRect(sx,sy,1,1);
 }
 ctx.fillStyle='#08101b';ctx.fillRect(0,0,W,6);
 ctx.strokeStyle='#1e3145';ctx.lineWidth=1;
 for(let x=-4;x<W;x+=16){
   ctx.beginPath();ctx.moveTo(x,6);ctx.lineTo(x+8,1);ctx.lineTo(x+16,6);ctx.stroke();
 }
}

/* --- Прожектор --- */
function floodlight(ctx,x,y,t){
 const dir=x<180?1:-1;
 const g=ctx.createLinearGradient(x,y,x+dir*92,y+118);
 g.addColorStop(0,'rgba(255,252,220,.16)');
 g.addColorStop(0.55,'rgba(255,252,220,.055)');
 g.addColorStop(1,'rgba(255,252,220,0)');
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.moveTo(x-dir*7,y+11);
 ctx.lineTo(x+dir*88,y+120);
 ctx.lineTo(x+dir*44,y+120);
 ctx.closePath();ctx.fill();
 ctx.strokeStyle='#2a3b4e';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(x,y+38);ctx.lineTo(x,y+12);ctx.stroke();
 ctx.fillStyle='#131e2b';
 rrect(ctx,x-12,y+2,24,13,2);ctx.fill();
 ctx.strokeStyle='#3c4d61';ctx.lineWidth=1;ctx.stroke();
 for(let i=0;i<2;i++)for(let j=0;j<3;j++){
   ctx.fillStyle='#fffbe0';
   ctx.beginPath();ctx.arc(x-6+j*6,y+6+i*4.5,1.8,0,7);ctx.fill();
 }
 const gl=ctx.createRadialGradient(x,y+8,2,x,y+8,24);
 gl.addColorStop(0,'rgba(255,250,210,.26)');gl.addColorStop(1,'rgba(255,250,210,0)');
 ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y+8,24,0,7);ctx.fill();
}

/* --- Трибуны с болельщиками --- */
function stands(ctx,t,cel){
 const rows=[
   {y:15,s:0.58,gap:5.6},
   {y:26,s:0.70,gap:6.0},
   {y:38,s:0.82,gap:6.5},
   {y:51,s:0.96,gap:7.0}
 ];
 const pals=[
   ['#a93226','#c0392b','#ecf0f1','#7f8c8d'],
   ['#c0392b','#ecf0f1','#2c3e50','#d35400'],
   ['#2980b9','#3498db','#f1c40f','#ecf0f1'],
   ['#c0392b','#ecf0f1','#27ae60','#8e44ad']
 ];
 rows.forEach((row,ri)=>{
   ctx.fillStyle='rgba(5,10,18,.55)';ctx.fillRect(0,row.y-2.6,360,3);
   ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,row.y+0.6,360,1.2);
   const off=(ri%2)*row.gap*0.5;
   let idx=0;
   for(let x=-4+off;x<366;x+=row.gap,idx++){
     fanFigure(ctx,x,row.y,row.s,pals[ri],ri*137+idx*29,t,cel);
   }
   ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(0,row.y-2.6,360,1.6);
 });
 const vg=ctx.createLinearGradient(0,6,0,64);
 vg.addColorStop(0,'rgba(4,10,20,.42)');
 vg.addColorStop(0.55,'rgba(4,10,20,.12)');
 vg.addColorStop(1,'rgba(4,10,20,0)');
 ctx.fillStyle=vg;ctx.fillRect(0,6,360,58);
 floodlight(ctx,20,4,t);
 floodlight(ctx,340,4,t);
}
function fanFigure(ctx,x,base,s,pal,seed,t,cel){
 const ph=seed*0.77;
 const exc=cel||0;
 const yo=Math.sin(t*2.3+ph)*0.6*s - exc*Math.abs(Math.sin(t*8+ph))*3.0*s;
 const b=base+yo;
 const w=5.2*s, h=7.6*s;
 const bodyC=pal[seed%pal.length];
 const skins=['#f2d3b3','#e8b98f','#d9a06b','#b97a4e','#8a5a33'];
 const skin=skins[seed%5];
 const raised=(seed%7===0)||exc>0.35;
 ctx.lineCap='round';
 if(raised){
   ctx.strokeStyle=skin;ctx.lineWidth=1.5*s;
   const sw=Math.sin(t*3.1+ph)*1.4*s;
   ctx.beginPath();
   ctx.moveTo(x-w*0.42,b-h*0.78);ctx.lineTo(x-w*0.95+sw,b-h*1.45);
   ctx.moveTo(x+w*0.42,b-h*0.78);ctx.lineTo(x+w*0.95+sw,b-h*1.45);
   ctx.stroke();
 }else{
   ctx.strokeStyle=shade(bodyC,-0.14);ctx.lineWidth=1.4*s;
   ctx.beginPath();
   ctx.moveTo(x-w*0.40,b-h*0.82);ctx.lineTo(x-w*0.60,b-h*0.28);
   ctx.moveTo(x+w*0.40,b-h*0.82);ctx.lineTo(x+w*0.60,b-h*0.28);
   ctx.stroke();
 }
 const bg=ctx.createLinearGradient(x,b-h,x,b);
 bg.addColorStop(0,shade(bodyC,0.14));bg.addColorStop(1,shade(bodyC,-0.24));
 ctx.fillStyle=bg;
 rrect(ctx,x-w/2,b-h,w,h,1.9*s);ctx.fill();
 ctx.fillStyle=skin;
 ctx.beginPath();ctx.arc(x,b-h-2.1*s,2.25*s,0,7);ctx.fill();
 ctx.fillStyle=seed%5===0?'#6b4a2a':(seed%3===0?'#3a2a18':'#1e1710');
 ctx.beginPath();ctx.arc(x,b-h-2.35*s,2.3*s,Math.PI*1.02,Math.PI*1.98);ctx.fill();
 if(seed%11===3){
   const fw=Math.sin(t*2.6+ph)*1.6*s;
   ctx.strokeStyle='#9aa7b5';ctx.lineWidth=1.1*s;
   ctx.beginPath();ctx.moveTo(x+w*0.55,b-h*0.9);ctx.lineTo(x+w*0.55,b-h*2.1);ctx.stroke();
   ctx.fillStyle=pal[(seed+1)%pal.length];
   ctx.beginPath();
   ctx.moveTo(x+w*0.55,b-h*2.1);
   ctx.lineTo(x+w*0.55+6*s,b-h*2.0+fw);
   ctx.lineTo(x+w*0.55,b-h*1.55);
   ctx.closePath();ctx.fill();
 }
 if(seed%13===5){
   const gl=Math.pow(Math.max(0,Math.sin(t*4.2+seed)),30);
   if(gl>0.4){
     ctx.fillStyle=`rgba(255,255,255,${Math.min(1,gl)})`;
     ctx.fillRect(x-1,b-h*1.15,2,2);
   }
 }
}

/* --- Табло --- */
function scoreboard(ctx,t){
 ctx.fillStyle='#07101b';ctx.fillRect(270,1,88,13);

/* --- Мяч --- */
function ball(ctx,a){
 const ballK=a.ballK||0;
 const bx=a.bx!==undefined?a.bx:BALL_START.x;
 const by=a.by!==undefined?a.by:BALL_START.y;
 const sy=335+(by-335)*0.25;
 ctx.fillStyle=`rgba(0,0,0,${Math.max(0.08,0.34-ballK*0.16)})`;
 ctx.beginPath();ctx.ellipse(bx,sy,Math.max(4,10-5*ballK),Math.max(1.5,4-1.6*ballK),0,0,7);ctx.fill();
 const r=10-4*ballK;
 const bg=ctx.createRadialGradient(bx-r*0.35,by-r*0.35,r*0.1,bx,by,r*1.05);
 bg.addColorStop(0,'#ffffff');bg.addColorStop(0.65,'#f0f0f0');bg.addColorStop(1,'#b5b5b5');
 ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fill();
 const rot=ballK*10;
 ctx.fillStyle='#1b1b1b';
 for(let i=0;i<5;i++){
   const an=rot+i*1.2566;
   const px=bx+Math.cos(an)*r*0.58, py=by+Math.sin(an)*r*0.58;
   ctx.beginPath();
   for(let k=0;k<5;k++){
     const aa=an+k*1.2566;
     const px2=px+Math.cos(aa)*r*0.17, py2=py+Math.sin(aa)*r*0.17;
     if(k)ctx.lineTo(px2,py2);else ctx.moveTo(px2,py2);
   }
   ctx.closePath();ctx.fill();
 }
 ctx.beginPath();
 for(let k=0;k<5;k++){
   const aa=rot*0.5+k*1.2566;
   const px2=bx+Math.cos(aa)*r*0.22, py2=by+Math.sin(aa)*r*0.22;
   if(k)ctx.lineTo(px2,py2);else ctx.moveTo(px2,py2);
 }
 ctx.closePath();ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.55)';
 ctx.beginPath();ctx.ellipse(bx-r*0.32,by-r*0.36,r*0.28,r*0.18,-0.7,0,7);ctx.fill();
}

/* Сужающаяся объёмная «капсула» для конечностей — вместо палочек */
function limbShape(ctx,p1,p2,w1,w2,color,edge){
 const dx=p2.x-p1.x,dy=p2.y-p1.y;
 const len=Math.hypot(dx,dy);
 if(len<0.01)return;
 const nx=-dy/len,ny=dx/len;
 const wm=(w1+w2)/2*0.62;
 const g=ctx.createLinearGradient(p1.x+nx*w1/2,p1.y+ny*w1/2,p1.x-nx*w1/2,p1.y-ny*w1/2);
 g.addColorStop(0,edge||shade(color,-0.24));
 g.addColorStop(0.42,shade(color,0.10));
 g.addColorStop(1,edge||shade(color,-0.24));
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.moveTo(p1.x+nx*w1/2,p1.y+ny*w1/2);
 ctx.quadraticCurveTo((p1.x+p2.x)/2+nx*wm,(p1.y+p2.y)/2+ny*wm, p2.x+nx*w2/2,p2.y+ny*w2/2);
 ctx.quadraticCurveTo(p2.x,p2.y, p2.x-nx*w2/2,p2.y-ny*w2/2);
 ctx.quadraticCurveTo((p1.x+p2.x)/2-nx*wm,(p1.y+p2.y)/2-ny*wm, p1.x-nx*w1/2,p1.y-ny*w1/2);
 ctx.quadraticCurveTo(p1.x,p1.y, p1.x+nx*w1/2,p1.y+ny*w1/2);
 ctx.fill();
}

function drawHair(ctx,hc,hr,s,h,t){
 if(h===5)return;

 if(h===1){
   ctx.fillStyle=c1;
   ctx.beginPath();
   for(let i=0;i<=10;i++){
     const an=Math.PI*(1.0+0.9*i/10);
     const r1=hr*0.98, r2=hr*(1.26+0.12*Math.sin(i*2.1));
     ctx.lineTo(hc.x+Math.cos(an)*r1, hc.y+Math.sin(an)*r1);
     ctx.lineTo(hc.x+Math.cos(an+0.08)*r2, hc.y+Math.sin(an+0.08)*r2);
   }
   ctx.closePath();ctx.fill();
 }else if(h===3){
   ctx.fillStyle=c1;
   ctx.beginPath();ctx.arc(hc.x,hc.y-1.6*s,hr*1.52,0,7);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.12)';
   ctx.beginPath();ctx.arc(hc.x-hr*0.6,hc.y-hr*0.9,hr*0.5,0,7);ctx.fill();
 }else if(h===4){
   ctx.fillStyle=c1;
   ctx.beginPath();
   ctx.moveTo(hc.x-2.4*s,hc.y-hr*0.15);
   ctx.quadraticCurveTo(hc.x-3.4*s,hc.y-hr*1.55,hc.x,hc.y-hr*1.80);
   ctx.quadraticCurveTo(hc.x+3.4*s,hc.y-hr*1.55,hc.x+2.4*s,hc.y-hr*0.15);
   ctx.closePath();ctx.fill();
   ctx.fillStyle=c2;
   ctx.beginPath();ctx.arc(hc.x,hc.y-0.4*s,hr*1.02,Math.PI*1.05,Math.PI*1.95);ctx.fill();
 }else{
   ctx.fillStyle=c1;
   ctx.beginPath();ctx.arc(hc.x,hc.y-0.7*s,hr*1.04,Math.PI*0.98,Math.PI*2.02);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.10)';
   ctx.beginPath();ctx.arc(hc.x-hr*0.35,hc.y-hr*0.7,hr*0.35,0,7);ctx.fill();
   if(h===2){
     ctx.fillStyle=c1;
     [-1,1].forEach(sd=>{
       ctx.beginPath();
       ctx.moveTo(hc.x+sd*hr*0.85,hc.y-hr*0.35);
       ctx.quadraticCurveTo(hc.x+sd*hr*1.55,hc.y+hr*1.5,hc.x+sd*hr*0.45,hc.y+hr*1.95);
       ctx.quadraticCurveTo(hc.x+sd*hr*0.55,hc.y+hr*0.8,hc.x+sd*hr*0.45,hc.y-hr*0.35);
       ctx.closePath();ctx.fill();
     });
   }
 }
}

/* ======================= ВРАТАРЬ ======================= */
function keeper(ctx,x,fy,o){
 o=o||{};
 const dive=o.dive||0, side=o.side||0, t=o.t||0, look=o.look||0;
 const s=1.05;
 const bob=Math.sin(t*4.2)*0.9*(1-dive);

 ctx.fillStyle='rgba(0,0,0,.32)';
 ctx.beginPath();ctx.ellipse(x,fy+1.5*s,15*s-dive*4*s,4.4*s-dive*1.2*s,0,0,7);ctx.fill();

 const hipY=-28*s+bob;
 const shoY=hipY-19*s;

 ctx.save();
 ctx.translate(x,fy);
 ctx.translate(0,hipY);
 if(dive>0)ctx.rotate(side*1.32*dive);
 ctx.translate(0,-hipY);

 [[-1,0.10],[1,-0.08]].forEach(([sd,sw])=>{
   const a=sd*0.14;
   const lat=sd*6.5*s*(1-dive*0.6); // ноги врозь (в прыжке — вместе)
   const knee={x:Math.sin(a)*17*s+lat*0.4, y:hipY+Math.cos(a)*17*s};
   const a2=a+sw;
   const foot={x:knee.x+Math.sin(a2)*15*s+lat*0.55, y:knee.y+Math.cos(a2)*15*s};
   // бедро в шортах
   limbShape(ctx,{x:0,y:hipY},knee,10*s,7.6*s,'#2a3f4d');
   // белая гетра
   const ankle={x:knee.x+Math.sin(a2)*13*s,y:knee.y+Math.cos(a2)*13*s};
   limbShape(ctx,knee,ankle,7.2*s,5.6*s,'#f2f4f6',shade('#f2f4f6',-0.18));
   kneeJoint(ctx,knee,3.4*s,'#2a3f4d');
   // неоновая бутса
   ctx.save();ctx.translate(foot.x,foot.y);ctx.rotate(a2);
   ctx.fillStyle='#0d1116';
   rrect(ctx,-2.2*s,-2.6*s,10*s,5.2*s,2*s);ctx.fill();
   const bg=ctx.createLinearGradient(0,-3.4*s,0,2.4*s);
   bg.addColorStop(0,'#7dffa9');bg.addColorStop(0.5,'#2fd06b');bg.addColorStop(1,'#157a3c');
   ctx.fillStyle=bg;
   ctx.beginPath();
   ctx.moveTo(-1.8*s,-0.4*s);
   ctx.quadraticCurveTo(-2*s,-3.8*s,1.4*s,-3.6*s);
   ctx.quadraticCurveTo(4*s,-2.8*s,6.4*s,-1.4*s);
   ctx.quadraticCurveTo(8.4*s,-0.2*s,7.6*s,1*s);
   ctx.quadraticCurveTo(4.6*s,2*s,0.6*s,1.8*s);
   ctx.quadraticCurveTo(-1.6*s,1.4*s,-1.8*s,-0.4*s);
   ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.4)';
   ctx.beginPath();ctx.ellipse(4.6*s,-1*s,1.6*s,0.7*s,-0.2,0,7);ctx.fill();
   ctx.restore();
 });

 ctx.fillStyle='#20323f';
 rrect(ctx,-8.4*s,hipY-4.5*s,16.8*s,11.5*s,3*s);ctx.fill();

 const jg=ctx.createLinearGradient(-11*s,0,11*s,0);
 jg.addColorStop(0,'#0a3d47');
 jg.addColorStop(0.38,'#1a95ab');
 jg.addColorStop(1,'#0a4a55');
 ctx.fillStyle=jg;
 ctx.beginPath();
 ctx.moveTo(-8.5*s,hipY);
 ctx.quadraticCurveTo(-9.5*s,(hipY+shoY)/2,-10*s,shoY+2*s);
 ctx.quadraticCurveTo(-10*s,shoY-4.5*s,-6*s,shoY-5*s);
 ctx.quadraticCurveTo(0,shoY-6.5*s,6*s,shoY-5*s);
 ctx.quadraticCurveTo(10*s,shoY-4.5*s,10*s,shoY+2*s);
 ctx.quadraticCurveTo(9.5*s,(hipY+shoY)/2,8.5*s,hipY);
 ctx.closePath();ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.18)';
 ctx.fillRect(-9.4*s,shoY+5*s,18.8*s,2.2*s);
 if(dive<0.55){
   ctx.save();
   ctx.fillStyle='rgba(255,255,255,.92)';
   ctx.font=`bold ${9*s}px Arial`;
   ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText('1',0,shoY+10*s);
   ctx.restore();
 }

 [-1,1].forEach(sd=>{
   const sx=sd*9.2*s, sy=shoY+2.2*s;
   let aA,aB;
   if(dive>0){
     aA=sd*(0.85+0.75*dive)+side*dive*0.55;
     aB=aA+sd*0.12;
   }else{
     aA=sd*1.05; // руки в боки
     aB=-sd*0.45;
   }
   const elbow={x:sx+Math.sin(aA)*12*s, y:sy+Math.cos(aA)*12*s};
   const hand={x:elbow.x+Math.sin(aB)*11*s, y:elbow.y+Math.cos(aB)*11*s};
   limbShape(ctx,{x:sx,y:sy},elbow,6.2*s,4.8*s,'#12707e');
   limbShape(ctx,elbow,hand,4.8*s,3.8*s,'#0f8a9c');
   kneeJoint(ctx,elbow,2.7*s,'#0f8a9c');
   ctx.save();
   ctx.translate(hand.x,hand.y);
   ctx.rotate(aB);
   ctx.fillStyle='#f1c40f';
   rrect(ctx,-3.6*s,-3.4*s,7.2*s,6.8*s,2.6*s);ctx.fill();
   ctx.fillStyle='#d9ab05';
   for(let i=0;i<3;i++){
     rrect(ctx,-3.2*s+i*2.3*s,-5.4*s,1.8*s,3.2*s,0.8*s);ctx.fill();
   }
   ctx.fillStyle='#ffe58a';
   rrect(ctx,-3.0*s,-2.8*s,2.4*s,2.2*s,1*s);ctx.fill();
   ctx.restore();
 });

 ctx.strokeStyle='#d99a68';ctx.lineWidth=4.6*s;
 ctx.beginPath();ctx.moveTo(0,shoY-1*s);ctx.lineTo(0,shoY-5*s);ctx.stroke();

 const hc={x:look*2.4*s,y:shoY-9.6*s}; // голова поворачивается за мячом
 const fg=ctx.createRadialGradient(hc.x-2*s,hc.y-2*s,1*s,hc.x,hc.y,7*s);
 fg.addColorStop(0,'#ffe1bf');fg.addColorStop(1,'#d99a68');
 ctx.fillStyle='#e0a878';
 ctx.beginPath();ctx.arc(hc.x-6.2*s,hc.y+0.4*s,1.8*s,0,7);ctx.fill();
 ctx.beginPath();ctx.arc(hc.x+6.2*s,hc.y+0.4*s,1.8*s,0,7);ctx.fill();
 ctx.fillStyle=fg;
 ctx.beginPath();ctx.arc(hc.x,hc.y,6.4*s,0,7);ctx.fill();
 [-2.4,2.4].forEach(ex=>{
   ctx.fillStyle='#fff';
   ctx.beginPath();ctx.ellipse(hc.x+ex*s,hc.y-0.6*s,1.5*s,1.7*s,0,0,7);ctx.fill();
   ctx.fillStyle='#2a3a48';
   ctx.beginPath();ctx.arc(hc.x+(ex+look*0.55)*s,hc.y-0.5*s,0.85*s,0,7);ctx.fill();
 });
 ctx.strokeStyle='#3b2a1a';ctx.lineWidth=1.1*s;ctx.lineCap='round';
 ctx.beginPath();
 ctx.moveTo(hc.x-3.9*s,hc.y-3*s);ctx.lineTo(hc.x-1.4*s,hc.y-3.4*s);
 ctx.moveTo(hc.x+1.4*s,hc.y-3.4*s);ctx.lineTo(hc.x+3.9*s,hc.y-3*s);
 ctx.stroke();
 ctx.fillStyle='rgba(0,0,0,.10)';
 ctx.beginPath();ctx.ellipse(hc.x,hc.y+1.4*s,1*s,0.7*s,0,0,7);ctx.fill();
 ctx.strokeStyle='#8a5a45';ctx.lineWidth=1*s;
 ctx.beginPath();
 ctx.moveTo(hc.x-1.6*s,hc.y+3.4*s);
 ctx.quadraticCurveTo(hc.x,hc.y+4.4*s,hc.x+1.6*s,hc.y+3.4*s);
 ctx.stroke();
 ctx.fillStyle='#2b1e12';
 ctx.beginPath();ctx.arc(hc.x,hc.y-0.5*s,6.6*s,Math.PI*1.02,Math.PI*1.98);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.10)';
 ctx.beginPath();ctx.arc(hc.x-2.2*s,hc.y-3.4*s,2.2*s,0,7);ctx.fill();

 ctx.restore();
}

nav();
</script>
