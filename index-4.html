<script>
/* ===== Telegram Web App ===== */
const tg = window.Telegram && window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0e1621');tg.setBackgroundColor('#0e1621');}catch(e){}}
function haptic(t){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(t)}catch(e){}}

/* ===== Звук (WebAudio, без файлов) ===== */
const AS={ctx:null,muted:false,
 init(){if(this.ctx)return;try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  this.ctx=new C();
  this.master=this.ctx.createGain();
  this.master.gain.value=this.muted?0:1;
  this.master.connect(this.ctx.destination);
  const b=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate);
  const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  this.nb=b;this.crowd();this.music();
  if(this.ctx.state==='suspended')this.ctx.resume();
 }catch(e){}},
 crowd(){const c=this.ctx;if(!c)return;try{
  const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  const g=c.createGain();g.gain.value=0.03;
  s.connect(f);f.connect(g);g.connect(this.master);s.start();
 }catch(e){}},
 noise(dur,freq,vol,when=0){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime+when;
  const s=c.createBufferSource();s.buffer=this.nb;s.playbackRate.value=0.7+Math.random()*0.6;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(this.master);s.start(t0);s.stop(t0+dur+0.05);
 }catch(e){}},
 tone(fr,dur,vol,type='sine',when=0){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime+when;
  const o=c.createOscillator();o.type=type;o.frequency.value=fr;
  const g=c.createGain();g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+0.02);
 }catch(e){}},

 /* ---- Тихий спокойный эмбиент-саундтрек (генерируется на лету) ---- */
 music(){const c=this.ctx;if(!c)return;try{
  const mb=c.createGain();mb.gain.value=0.5;this.mbus=mb;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;
  const len=c.sampleRate*3,ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
  const cv=c.createConvolver();cv.buffer=ir;
  const wet=c.createGain();wet.gain.value=0.6;const dry=c.createGain();dry.gain.value=0.55;
  mb.connect(lp);lp.connect(dry);lp.connect(cv);cv.connect(wet);dry.connect(this.master);wet.connect(this.master);
  const fq=m=>440*Math.pow(2,(m-69)/12);
  const prog=[[45,52,60,64,71],[41,48,57,64,69],[48,55,59,64,67],[43,50,59,64,69]]; // Am9 · Fmaj7 · Cmaj7 · G6/9
  const pent=[69,72,74,76,79,81];
  const pad=(m,t,dur,vol)=>{[-6,6].forEach(det=>{
    const o=c.createOscillator();o.type=m<55?'sine':'triangle';o.frequency.value=fq(m);o.detune.value=det;
    const g=c.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+2.5);g.gain.setValueAtTime(vol,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+2.5);
    o.connect(g);g.connect(mb);o.start(t);o.stop(t+dur+2.6)})};
  const bell=(m,t)=>{[[1,0.05],[2,0.012]].forEach(([k,v])=>{
    const o=c.createOscillator();o.type='sine';o.frequency.value=fq(m)*k;
    const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+3.5);
    o.connect(g);g.connect(mb);o.start(t);o.stop(t+3.6)})};
  this.mNext=c.currentTime+0.2;this.mI=0;
  const sched=()=>{if(c.state!=='running')return;
   while(this.mNext<c.currentTime+3){
    const t=this.mNext,ch=prog[this.mI%4];
    ch.forEach((m,i)=>pad(m,t+i*0.15,8,m<50?0.05:0.028));
    const n=3+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++)bell(pent[Math.floor(Math.random()*pent.length)],t+1+Math.random()*6);
    this.mNext+=8;this.mI++;
   }};
  sched();this.mT=setInterval(sched,1000);
 }catch(e){}},
 duck(sec){const c=this.ctx;if(!c||!this.mbus)return;try{ // приглушаем музыку на время рёва трибун
  const g=this.mbus.gain,t=c.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
  g.setTargetAtTime(0.15,t,0.1);g.setTargetAtTime(0.5,t+sec,1.2);
 }catch(e){}},
 sweep(f0,f1,dur,vol,type='sine',when=0){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime+when;
  const o=c.createOscillator();o.type=type;
  o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=c.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+0.02);
 }catch(e){}},
 whistleSnd(){if(this.muted)return;this.tone(2850,0.16,0.1,'triangle');this.tone(2650,0.22,0.1,'triangle',0.17)},
 bounceSnd(){if(this.muted)return;
  [[0,0.32],[0.2,0.18],[0.34,0.09]].forEach(([w,v])=>{this.sweep(210,95,0.09,v,'sine',w);this.noise(0.05,700,v*0.5,w)})},
 netSnd(){if(this.muted)return;
  this.noise(0.5,2600,0.22);this.noise(0.35,4800,0.12,0.04);this.sweep(120,60,0.18,0.3)},
 wallSnd(){if(this.muted)return;
  this.sweep(170,60,0.14,0.55);this.noise(0.1,600,0.4)},
 kickSnd(){if(this.muted)return;this.noise(0.07,1800,0.45);this.noise(0.1,600,0.3);this.sweep(160,55,0.14,0.55)},
 roar(dur,vol){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime;
  const bus=c.createGain();bus.gain.setValueAtTime(0.0001,t0);
  bus.gain.exponentialRampToValueAtTime(vol,t0+0.35);
  bus.gain.setValueAtTime(vol,t0+dur*0.5);
  bus.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  bus.connect(this.master);
  [[700,1.4],[1150,1],[2700,0.45]].forEach(([f,gv])=>{
   const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=2.2;
   const g=c.createGain();g.gain.value=gv;bp.connect(g);g.connect(bus);
   const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;s.playbackRate.value=0.9+Math.random()*0.2;
   s.connect(bp);s.start(t0);s.stop(t0+dur+0.1);
   for(let i=0;i<6;i++){ // «голоса» болельщиков: пилы с вибрато и подъёмом тона
    const o=c.createOscillator();o.type='sawtooth';
    const f0=150+Math.random()*260;
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.linearRampToValueAtTime(f0*1.2,t0+0.5);
    o.frequency.linearRampToValueAtTime(f0*1.04,t0+dur);
    const og=c.createGain();og.gain.value=0.05;
    o.connect(og);og.connect(bp);o.start(t0);o.stop(t0+dur+0.1);
   }
  });
 }catch(e){}},
 goalSnd(){if(this.muted)return;this.duck(3.6);
  this.roar(3.4,0.9);this.noise(0.5,5200,0.22,0);
  this.noise(1.2,3200,0.25,0.3);this.noise(1.0,4200,0.15,0.9); // хлопки
  this.tone(48,1.8,0.5,'sine',0.05);
  this.tone(2300,0.3,0.15,'square',0.1);this.tone(2300,0.5,0.15,'square',0.55);
  try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance('Гоооол!');u.lang='ru-RU';u.rate=0.8;u.pitch=0.7;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}},
 oohSnd(){if(this.muted)return;
  this.noise(1.0,420,0.34);this.noise(0.75,900,0.2,0.08);this.tone(215,0.75,0.14,'sine',0.05)},
 saveSnd(){if(this.muted)return;this.sweep(190,70,0.13,0.5);this.noise(0.09,800,0.4);this.noise(0.12,300,0.25)},
 postSnd(){if(this.muted)return;this.sweep(200,70,0.1,0.45);this.tone(820,0.7,0.28,'sine');this.tone(1400,0.5,0.35,'triangle');this.tone(2100,0.4,0.22,'triangle',0.02)},
 missSnd(){if(this.muted)return;this.sweep(140,70,0.12,0.35);this.noise(0.18,450,0.3)}
};
try{AS.muted=localStorage.getItem('goal_mute')==='1'}catch(e){}
document.addEventListener('pointerdown',()=>AS.init(),{once:true});
document.addEventListener('visibilitychange',()=>{const c=AS.ctx;if(!c)return;try{document.hidden?c.suspend():c.resume()}catch(e){}});
function toggleMute(){AS.muted=!AS.muted;try{localStorage.setItem('goal_mute',AS.muted?'1':'0')}catch(e){}if(!AS.muted)AS.init();if(AS.master)AS.master.gain.value=AS.muted?0:1;nav()}

/* ===== ⚔️ БИТВА КЛУБОВ: «Недельная война» (пн 00:00 — вс 24:00 по Москве) ===== */
const CW_DAY=864e5,CW_TZ=3*36e5,CW_KEEP=4,CW_WIN_GOALS=10,CW_WIN_COINS=150,CW_PART_COINS=30,CW_BOT=120,CW_STREAK=3,CW_STREAK_BONUS=0.05;
const CW_RARE=[{k:'dances',i:5},{k:'balls',i:5},{k:'stadiums',i:5},{k:'dances',i:6},{k:'dances',i:7},{k:'balls',i:6},{k:'boots',i:4},{k:'dances',i:8},{k:'dances',i:9}];   // пул эксклюзивов (по порядку)
let CW={rows:[],ok:null},cwTab='war',cwTimer=null,cwTop=null,cwBusy=false;
function cwWeek(t){return Math.floor(((t||Date.now())+CW_TZ-4*CW_DAY)/(7*CW_DAY))}
function cwEnd(w){return (w+1)*7*CW_DAY+4*CW_DAY-CW_TZ}
function cwRng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cwShuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* соперники недели: внутри лиги; одиночки/лишние сводятся в общий пул; без пары — «Легенды» (-1) */
function cwPairs(w){
 const r=cwRng(w*7919+13),by={},opp={};let rest=[];
 CLUBS.forEach((c,i)=>{if(i)(by[c.lg]=by[c.lg]||[]).push(i)});
 Object.keys(by).sort().forEach(lg=>{const a=cwShuffle(by[lg],r);while(a.length>1){const x=a.pop(),y=a.pop();opp[x]=y;opp[y]=x}if(a.length)rest.push(a[0])});
 rest=cwShuffle(rest,r);while(rest.length>1){const x=rest.pop(),y=rest.pop();opp[x]=y;opp[y]=x}
 if(rest.length)opp[rest[0]]=-1;
 return opp}
function cwBotFinal(w){return Math.round(CW_BOT*(0.6+0.8*cwRng(w*31+7)()))}
function cwF(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')}
function cwFrame(n){return n>=CW_STREAK?'border:2px solid #f5b301;box-shadow:0 0 12px rgba(245,179,1,.55);background:rgba(245,179,1,.12);':''}
function clubBonus(){const st=P.cws&&P.cws.w===cwWeek()&&P.cws.s&&P.cws.s[P.club]>=CW_STREAK;return CLUBS[P.club].bonus+(st?CW_STREAK_BONUS:0)}
async function cwSubmit(){
 if(!P.created||!P.cw)return;const rows=[];
 Object.keys(P.cw).forEach(w=>Object.keys(P.cw[w]).forEach(c=>{if(+c&&P.cw[w][c]>0)rows.push({uid:UID,week:+w,club:+c,goals:P.cw[w][c],name:P.name})}));
 if(!rows.length)return;
 try{await sb('club_week?on_conflict=uid,week,club',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}catch(e){}
}
async function cwLoad(){
 try{const arr=await sb('club_week?select=uid,week,club,goals,name&goals=gt.0&week=gte.'+(cwWeek()-12)+'&limit=10000');
  if(!Array.isArray(arr))throw 0;CW.rows=arr.filter(r=>r.uid!==UID);CW.ok=true}catch(e){CW.ok=false}
 return CW.ok}
function cwAgg(w){
 const tot={},ppl={},add=(u,n,c,g)=>{tot[c]=(tot[c]||0)+g;(ppl[c]=ppl[c]||[]).push({uid:u,name:n,g})};
 CW.rows.forEach(r=>{if(r.week===w)add(r.uid,r.name,r.club,r.goals)});
 const m=(P.cw||{})[w]||{};Object.keys(m).forEach(c=>{if(+c&&m[c]>0)add(UID,P.name,+c,m[c])});
 return{tot,ppl}}
function cwResult(w,c,agg){
 const opp=cwPairs(w)[c];if(opp==null)return null;
 const me=agg.tot[c]||0,op=opp===-1?cwBotFinal(w):(agg.tot[opp]||0);
 return{me,op,opp,res:me>op?1:me<op?-1:0}}
function cwStreaks(){
 const cur=cwWeek(),ag={},st={};
 for(let w=cur-1;w>=cur-10;w--)ag[w]=cwAgg(w);
 CLUBS.forEach((c,i)=>{if(!i)return;let n=0;for(let w=cur-1;w>=cur-10;w--){const r=cwResult(w,i,ag[w]);if(r&&r.res===1&&r.me>0)n++;else break}st[i]=n});
 return st}
/* выдать следующий эксклюзив из пула (если всё собрано — 300 монет) */
function cwGrant(why){
 const it=CW_RARE.find(r=>!P.own[r.k].includes(r.i));
 if(!it){P.coins+=300;toast('🎁 '+why+' +300 🪙');return}
 const o=TABS[it.k].list[it.i];P.own[it.k].push(it.i);
 toast('🎁 '+why+' Эксклюзив: <b>'+o.n+'</b> '+(o.icon||'⚽'));
}
/* награды за завершённые недели (один раз) */
function cwClaim(){
 const cur=cwWeek();if(!P.created||CW.ok!==true)return;
 if(typeof P.cwc!=='number'){P.cwc=cur-1;return}
 for(let w=Math.max(P.cwc+1,cur-CW_KEEP);w<cur;w++){
  const agg=cwAgg(w),m=(P.cw||{})[w]||{};
  Object.keys(m).forEach(k=>{const c=+k,g=m[k];if(!c||g<1)return;
   const r=cwResult(w,c,agg);if(!r)return;
   if(r.res===1&&g>=CW_WIN_GOALS){P.coins+=CW_WIN_COINS;P.champ=(P.champ||0)+1;toast('🏅 <b>Чемпион недели!</b> '+CLUBS[c].n+' победил · +'+CW_WIN_COINS+' 🪙');if(P.champ%3===0)cwGrant('Третий титул чемпиона!')}
   else{P.coins+=CW_PART_COINS;toast((r.res===1?'🏆 Победа клуба ':'⚽ Участие в битве: ')+CLUBS[c].n+' · +'+CW_PART_COINS+' 🪙')}
   if(r.res===1){
    const top=(agg.ppl[c]||[]).slice().sort((x,y)=>y.g-x.g||(x.uid<y.uid?-1:1))[0];
    if(top&&top.uid===UID)cwGrant('Лучший бомбардир клуба!');
   }
  });
 }
 P.cwc=cur-1;
}
async function cwRefresh(){
 if(cwBusy||!P.created)return;cwBusy=true;
 try{await cwSubmit();if(await cwLoad()){P.cws={w:cwWeek(),s:cwStreaks()};cwClaim();save()}}catch(e){}finally{cwBusy=false}
}
function cwWar(s){
 if(!P.club)return '<div class="small" style="text-align:center">Дворовая команда не воюет 🙂<br>Вступи в клуб в «Трансферах», чтобы участвовать в битве.</div>';
 const w=cwWeek(),now=Date.now(),end=cwEnd(w),frac=Math.min(1,Math.max(0,1-(end-now)/(7*CW_DAY)));
 const agg=cwAgg(w),pr=cwPairs(w),opp=pr[P.club],bot=cwBotFinal(w),nm=i=>i===-1?'Легенды 🏛️':CLUBS[i].n;
 const gt=i=>i===-1?Math.round(bot*frac):(agg.tot[i]||0);
 const me=gt(P.club),op=gt(opp),mine=((P.cw||{})[w]||{})[P.club]||0;
 const left=Math.max(0,end-now),d=Math.floor(left/CW_DAY),h=Math.floor(left%CW_DAY/36e5),m=Math.floor(left%36e5/6e4);
 const share=me+op?Math.round(me*100/(me+op)):50,st=s[P.club]||0;
 let o=`<div class="card" style="${cwFrame(st)}text-align:center">
  <div class="small">⚔️ Недельная война</div>
  <div style="margin:8px 0">${esc(CLUBS[P.club].n)} <b style="font-size:22px">${cwF(me)}\u00a0:\u00a0${cwF(op)}</b> ${esc(nm(opp))}</div>
  <div style="height:8px;border-radius:4px;background:#c0392b;overflow:hidden"><div style="height:100%;width:${share}%;background:#2ecc71"></div></div>
  <div class="small" style="margin-top:6px">${me>op?'🟢 Твой клуб впереди':me<op?'🔴 Твой клуб отстаёт':'⚪ Пока ничья'}</div>
  <div class="statline"><span>⏳ До конца недели</span><b>${d}д ${h}ч ${m}м</b></div>
  <div class="statline"><span>Твой вклад</span><b>⚽ ${mine}${me?' · '+Math.round(mine*100/me)+'%':''}</b></div>
  <div class="small">${mine>=CW_WIN_GOALS?'✅ Норма для значка «Чемпион недели» выполнена':'До значка «Чемпион недели» ещё '+(CW_WIN_GOALS-mine)+' гол.'}</div></div>`;
 o+=`<div class="card"><div class="statline"><span>🔥 Серия побед клуба</span><b>${st}</b></div><div class="small">${st>=CW_STREAK?'Золотая рамка и +5% монет за гол активны!':'Выиграйте '+(CW_STREAK-st)+' нед. подряд: золотая рамка в топе и +5% монет за гол всем игрокам клуба'}</div></div>`;
 const lw=cwResult(w-1,P.club,cwAgg(w-1));
 if(lw&&(lw.me||lw.op))o+=`<div class="card small" style="text-align:center">Прошлая неделя: ${esc(CLUBS[P.club].n)} ${cwF(lw.me)}\u00a0:\u00a0${cwF(lw.op)} ${esc(nm(lw.opp))} — ${lw.res>0?'🏆 победа':lw.res<0?'поражение':'ничья'}</div>`;
 const seen={},rows=[];
 Object.keys(pr).forEach(k=>{k=+k;const q=pr[k];if(seen[k])return;seen[k]=1;if(q>0)seen[q]=1;rows.push([k,q])});

function shopPv(){

  const c2=$('pv');

  if(tab==='stadiums'){
   const g0=G,old=P.look.stadium;G=null;P.look.stadium=sel;

   ctx.beginPath();ctx.rect(0,0,360,520);ctx.clip();
   try{draw(ctx,{t})}catch(e){}
   ctx.restore();G=g0;P.look.stadium=old;

   drawStriker(ctx,80,190,{scale:1.55,t,dance:{id:sel,u:Math.min(1,(t%3.4)/2.6)},dir:1,dxs:0.5,front:true});
  }else if(tab==='balls'){
   drawStriker(ctx,62,192,{scale:1.8,t,front:true});

  }else{
   const ob=P.look.boots;P.look.boots=sel;
   try{drawStriker(ctx,80,192,{scale:1.85,t,front:true})}finally{P.look.boots=ob}
  }
  pvRaf=requestAnimationFrame(loop);
 };
 pvRaf=requestAnimationFrame(loop);
}

function dqMake(i){const T=QT[i],n=dqRnd(T.lo,T.hi);return{i,n,p:0,c:0,v:dqRnd(0,9),r:dqR5(T.per*n*(0.9+Math.random()*0.3))}}
function dqGen(){
 const all=QT.map((_,i)=>i).sort(()=>Math.random()-.5),ids=[],cnt={};
 for(const i of all){if(ids.length>=DQ_N)break;const g=QT[i].g||('o'+QT[i].ic);if(cnt[g])continue;cnt[g]=1;ids.push(i)}
 for(const i of all){if(ids.length>=DQ_N)break;if(!ids.includes(i))ids.push(i)}
 return{day:dayKey(),q:ids.map(dqMake),rr:0,b:0}}
function dqInit(){
 if(!P.dq||P.dq.day!==dayKey()||!Array.isArray(P.dq.q)||P.dq.q.some(q=>!QT[q.i])){P.dq=dqGen();save()}
 return P.dq;
}
function dqTrack(e){try{
 dqInit();let ch=0;
 P.dq.q.forEach(q=>{
  if(q.p>=q.n)return;
  const T=QT[q.i],a=T.f(e)||0;if(!a)return;
  q.p=T.mx?Math.max(q.p,Math.min(q.n,a)):Math.min(q.n,q.p+a);ch=1;
  if(q.p>=q.n){toast('✅ Задание выполнено: <b>'+dqText(q)+'</b>');haptic('success')}
 });
 if(ch)save();
}catch(x){}}
function dqText(q){const a=QT[q.i].t(q.n);return a[q.v%a.length]}
function dqChime(){if(AS.muted)return;AS.init();AS.tone(660,.25,.18,'triangle');AS.tone(880,.3,.18,'triangle',.1);AS.tone(1320,.5,.18,'triangle',.2)}

/* --- ежедневная награда за вход --- */
function drState(){
 const t=dayKey(),d=P.dr,claimed=d.last===t,cont=d.last===yKey();
 const prev=(claimed||cont)?d.streak:0;
 const streak=claimed?d.streak:prev,idx=claimed?(d.streak-1)%7:prev%7;
 const week=Math.floor((claimed?d.streak-1:prev)/7)+1;   // номер текущей недели (цикл из 7 дней повторяется бесконечно)
 return{claimed,idx,prev,streak,week,mult:drMult(week)};
}
const drMult=w=>1+0.1*Math.min(Math.max(w,1)-1,5); // +10% за каждую пройденную неделю, максимум x1.5
function drClaim(){
 const s=drState();if(s.claimed)return;
 let amt=dqR5(DR_BASE[s.idx]*s.mult*(0.8+Math.random()*0.7)),lucky=Math.random()<0.12;
 if(lucky)amt*=2;
 P.dr.streak=s.prev+1;P.dr.last=dayKey();const ms=drMs(P.dr.streak);P.coins+=amt+ms;save();
 toast((lucky?'🍀 Удача! Награда x2: ':'🎁 Награда дня: ')+'<b>+'+amt+' 🪙</b>');
 if(ms)setTimeout(()=>toast('🏅 Бонус за '+P.dr.streak+' '+dqPl(P.dr.streak,'день','дня','дней')+' подряд: <b>+'+ms+' 🪙</b>'),600);
 haptic('success');dqChime();
 dailyScr(1);
}

/* --- задания --- */
function dqClaim(i){
 const q=dqInit().q[i];if(!q||q.c||q.p<q.n)return;
 q.c=1;P.coins+=q.r;save();toast('🪙 +'+q.r+' за задание');haptic('success');dqChime();dailyScr(1);
}
function dqReroll(i){
 const d=dqInit(),q=d.q[i];if(!q||(d.rr||0)>=DQ_REROLLS||q.c||q.p>=q.n)return;
 const used=d.q.map(x=>x.i),free=QT.map((_,k)=>k).filter(k=>!used.includes(k));
 d.q[i]=dqMake(dqPick(free));d.rr=(d.rr||0)+1;save();dailyScr(1);
}
function dqBonus(){
 const d=dqInit();if(d.b||!d.q.every(q=>q.p>=q.n))return;
 d.b=1;P.coins+=DQ_BONUS;save();toast('🏆 Все задания выполнены: <b>+'+DQ_BONUS+' 🪙</b>');haptic('success');dqChime();dailyScr(1);
}
function dqBadge(){
 try{const d=dqInit(),n=(drState().claimed?0:1)+d.q.filter(q=>q.p>=q.n&&!q.c).length+((!d.b&&d.q.every(q=>q.p>=q.n))?1:0);
  return n?' 🔴 '+n:''}catch(e){return ''}
}

}

 }).join('');

function lvStop(){if(LVT){clearInterval(LVT);LVT=null}}

async function lvPatch(o){try{await sb('live_duels?id=eq.'+LV.id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(o)})}catch(e){}}

 try{

 },1200);

async function liveCancel(silent){

/* --- Игровой процесс --- */
function liveStartTick(){
 lvStop();
 LVT=setInterval(async()=>{
  if(!LV||!G||!G.duel||G.duel.type!=='live')return lvStop();
  try{
   const d=await lvGet();if(!d)return;
   const o=opK();G.oppGoals=d[o+'_goals']||0;G.oppRound=d[o+'_round']||0;
   const b=$('oppbar');if(b)b.innerHTML='Раунд '+Math.min(5,G.oppRound+1)+'/5 · Голы: <b>'+G.oppGoals+'</b>';
   if(d.status==='left'&&d.left_uid!==UID&&!G.oppLeft){G.oppLeft=true;toast('Соперник вышел 🏳️')}
   if(G.waitNext&&(G.oppRound>=G.round||G.oppLeft)){G.waitNext=false;next()}
  }catch(e){}
 },1000);
}
function liveReport(){const k=myK(),o={};o[k+'_goals']=G.goals;o[k+'_round']=G.round;lvPatch(o)}
function liveNext(){
 if(G.round>=5){next();return}
 if(G.oppRound>=G.round||G.oppLeft){next();return}
 G.waitNext=true;
 const ov=$('ovl');if(ov)ov.innerHTML='<div class="result"><div class="rtext" style="color:var(--accent)">⏳ Ждём соперника…</div><div class="small">Следующий раунд начнётся одновременно</div></div>';
}

  const key='L'+LV.id;
  if(!P.dc.includes(key)){P.dc.push(key);P.coins=Math.max(0,P.coins-STAKE);save()}

  const dr=!left&&goals===opp,w=left||goals>opp,r=w?STAKE:(dr?0:-STAKE);
  const key='L'+d.id;
  if(!P.dc.includes(key)){P.dc.push(key);if(w)P.duelWins++;P.coins=Math.max(0,P.coins+r);save();checkAch()}
  set('<div class="rtext" style="text-align:center;font-size:22px;font-weight:800">'+(w?'🏆 Победа!':dr?'🤝 Ничья':'😔 Поражение')+'</div><div class="name" style="text-align:center">Ты '+goals+' : '+opp+' '+esc(d.name)+'</div><div class="coins" style="text-align:center;'+(r<0?'color:var(--bad)':'')+'">'+(r>0?'+':r<0?'−':'±')+Math.abs(r)+' 🪙'+(r===0?' (ничья, монеты на месте)':'')+'</div>'+(left?'<div class="small" style="text-align:center">Соперник вышел из дуэли</div>':''));
  lvStop();LV=null;
 };
 set('<div class="small" style="text-align:center">⏳ Ждём, пока соперник закончит серию…</div>');
 lvStop();
 let tries=0;
 LVT=setInterval(async()=>{
  tries++;
  try{
   const r=await lvGet(),o=opK();
   if(!r){show(0,true);return}
   if(r.status==='left'&&r.left_uid!==UID){show(r[o+'_goals']||0,true);return}
   if((r[o+'_round']||0)>=5){show(r[o+'_goals']||0,false);return}
  }catch(e){}
  if(tries>90){lvStop();set('<div class="small" style="text-align:center">😕 Соперник не закончил. Результат не засчитан.</div>');LV=null}
 },1500);
}

/* ===== Игра: Пенальти ===== */
let G=null,raf=null,idleRaf=null,celRaf=null;
const BALL_START={x:180,y:335};
const GREEN_W=()=>0.06+BOOTS[P.look.boots].acc*0.012;

function startGame(duel){G={round:1,goals:0,earned:0,streak:0,phase:'aim',celT:0,duel:(duel&&duel.type)?duel:null,oppGoals:0,oppRound:0};play();if(G.duel&&G.duel.type==='live')liveStartTick();else{lvStop();LV=null}}

function play(){
 app(`${G.duel&&G.duel.type==='live'?'<div class="card" style="padding:10px;flex-direction:row;justify-content:space-between;align-items:center"><span>⚔️ <b>'+esc(G.duel.name)+'</b></span><span class="small" id="oppbar">Раунд 0/5 · Голы: <b>0</b></span></div>':G.duel?'<div class="small" style="text-align:center">⚔️ Дуэль: '+esc(G.duel.name)+'</div>':''}<div class="hud"><span>Раунд <b id="r">1</b>/5</span><span>Голы: <b id="g">0</b></span><span>🪙 <b id="c">0</b></span></div>
 <div class="stagewrap">
   <canvas id="cv" class="game" width="720" height="1040"></canvas>
   <div id="ovl"></div>
 </div>
 <div class="row">
  <button class="btn btn2 grow" onclick="quit()">🏳️ Завершить серию</button>
  ${sndBtn()}
 </div>
 <div class="small" style="text-align:center">1) Ткни точно <b>в ворота</b> → 2) Останови иглу в зелёной зоне. Углы — прибыльнее, но рискованнее!</div>`);
 const c=$('cv');c.getContext('2d').setTransform(2,0,0,2,0,0);
 draw();
 aimUI();
 startIdle();
}
function quit(){askConfirm(G&&G.duel?'Выйти из дуэли? Это поражение: −50 🪙 отдаются сопернику.':'Завершить серию? Монеты сохранятся.',()=>{if(G&&G.duel&&G.duel.type==='live')liveLeave();cancelAnimationFrame(raf);stopIdle();save();try{submitTop()}catch(e){}G=null;home()})}
function updHud(){const r=$('r'),g=$('g'),c=$('c');if(r)r.textContent=G.round;if(g)g.textContent=G.goals;if(c)c.textContent=G.earned}

function startIdle(){
 stopIdle();
 const loop=(tm)=>{draw(null,{t:tm/1000});idleRaf=requestAnimationFrame(loop)};
 idleRaf=requestAnimationFrame(loop);
}
function stopIdle(){if(idleRaf)cancelAnimationFrame(idleRaf);idleRaf=null;stopCel()}
function stopCel(){if(celRaf)cancelAnimationFrame(celRaf);celRaf=null}
function startCel(){
 stopCel();
 const cv=$('cv');if(!cv||!G||!G.last)return;
 const ctx=cv.getContext('2d'),id=(P.look.dance||0);
 const lp=(tm)=>{
  if(!G||G.phase!=='result'||G.result!=='goal'||!$('cv')){celRaf=null;return}
  const u=(performance.now()-G.celT)/2600;
  draw(ctx,Object.assign({},G.last,{t:tm/1000,impact:0,trail:[],netT:(G.last.netT||0)+(performance.now()-G.celT)/1000,dance:{id,u:Math.min(1,u)}}));
  celRaf=requestAnimationFrame(lp);
 };
 celRaf=requestAnimationFrame(lp);
}

/* --- Фаза 1: точный прицел (без сетки — тап прямо в ворота) --- */
function aimUI(){
 G.phase='aim';
 const CH=(G&&G.fk)?FK_H:520;
 $('ovl').innerHTML=`<div class="goaltarget" style="left:${70/360*100}%;top:${110/CH*100}%;width:${220/360*100}%;height:${110/CH*100}%"
   onclick="aim(event)"></div>`;
}

/* --- Фаза 2: точность удара --- */
function aim(e){
 const rect=e.currentTarget.getBoundingClientRect();
 const p=(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0]:e;
 const cx=(p.clientX!==undefined)?p.clientX:rect.left+rect.width/2;
 const cy=(p.clientY!==undefined)?p.clientY:rect.top+rect.height/2;
 const fx=Math.min(0.99,Math.max(0.01,(cx-rect.left)/rect.width));
 const fy=Math.min(0.98,Math.max(0.02,(cy-rect.top)/rect.height));
 G.aim={px:fx*220,py:fy*110};
 G.phase='power';
 if(G.fk)fkAimed();
 const gw=GREEN_W(),yw=0.155;
 $('ovl').innerHTML=`<div class="powerwrap"${G.fk?` style="top:${236/FK_H*100}%;bottom:auto"`:''}><div class="powerbar">
   <div class="zone z-y" style="left:${(50-yw*100)}%;width:${yw*2*100}%"></div>
   <div class="zone z-g" style="left:${(50-gw*100)}%;width:${gw*2*100}%"></div>
   <div class="needle" id="nd" style="left:-2px"></div></div>
   <button class="btn kickbtn" onclick="kick()">⚽ Бить!</button></div>`;
 const t0=performance.now(),speed=1.5;
 cancelAnimationFrame(raf);
 const loop=(t)=>{
   if(G.phase!=='power')return;
   const dt=(t-t0)/1000;
   G.pv=0.5+0.5*Math.sin(dt*speed*Math.PI*2-Math.PI/2);
   const nd=$('nd');
   if(nd)nd.style.left=`calc(${(G.pv*100).toFixed(2)}% - 2px)`;
   raf=requestAnimationFrame(loop);
 };
 raf=requestAnimationFrame(loop);
}

/* --- Удар --- */
function kick(){
 if(G&&G.fk){fkKick();return}
 cancelAnimationFrame(raf);
 const d=Math.abs(G.pv-0.5);
 G.quality=d<GREEN_W()?'perfect':(d<0.155?'good':'bad');
 AS.whistleSnd();
 resolve();
 G.phase='anim';
 $('ovl').innerHTML='';
 animate();
}

function segDist(px,py,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1;
 const u=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
 return Math.hypot(px-(x1+u*dx),py-(y1+u*dy));
}
function hitPost(cx,cy){
 const frame=[
  segDist(cx,cy,70,110,70,220),
  segDist(cx,cy,290,110,290,220),
  segDist(cx,cy,70,110,290,110)
 ];
 return Math.min(...frame)<7.5;
}

function mkTgt(tx,ty,rw){const dx=tx-180,ad=Math.abs(dx),sd=ad<26?0:Math.sign(dx);
 return{x:tx,y:Math.max(128,ty),sd,th:sd*(0.75+0.6*Math.min(1,(ad-26)/70)),rw}}
function resolve(){
 const q=G.quality;
 const ax=G.aim.px, ay=G.aim.py;
 let ex=0,ey=0;
 if(q==='good'){const an=Math.random()*6.283,r=8+Math.random()*10;ex=Math.cos(an)*r;ey=Math.sin(an)*r*0.6}
 else if(q==='bad'){const an=Math.random()*6.283,r=26+Math.random()*30;ex=Math.cos(an)*r;ey=Math.sin(an)*r*0.7}
 const fx=70+ax+ex, fy=110+ay+ey;
 G.fx=fx;G.fy=fy;
 G.miss=(fx<64||fx>296||fy<102||fy>226);
 if(!G.miss&&hitPost(fx,fy)){G.result='post';G.contact={cx:fx,cy:fy};G.coins=0;G.react=0.3;G.kTgt=mkTgt(fx*0.6+72,Math.min(215,Math.max(120,fy))*0.6+67,0.8);return}
 const fcc=Math.min(2,Math.max(0,Math.floor((fx-70)/(220/3))));
 const corner=Math.abs(fx-180)>74||fy<142;
 G.corner=corner;
 // --- физика сейва: вратарь следит за траекторией мяча ---
 const speedF=q==='perfect'?1:(q==='good'?0.72:0.5);
 const flightT=0.55/speedF;
 const reactT=q==='perfect'?0.3:(q==='good'?0.22:0.16);
 // вратарь иногда ошибается с прочтением
 const misread=Math.random()<(q==='perfect'?0.12:(q==='good'?0.2:0.25));
 const kc=misread?Math.max(0,Math.min(2,fcc+(Math.random()<0.5?-1:1))):fcc;
 G.kc=kc;
 G.react=reactT/flightT;   // доля полёта до начала прыжка
 G.speedF=speedF;
 // дистанция, которую вратарь может покрыть до мяча (бутсы помогают пробить его)
 const kdist=Math.hypot(G.fx-180,(G.fy-168)*0.95);
 const vK=280*(1-BOOTS[P.look.boots].acc*0.06);
 const reach=vK*Math.max(0,flightT-reactT)*(q==='perfect'?0.75:1)*(kc===fcc?1:0.25);
 // даже достающий вратарь иногда ошибается: чем лучше удар — тем чаще
 const saved=!G.miss&&kdist<=reach*(0.75+Math.random()*0.4)&&(Math.random()<(q==='perfect'?0.55:(q==='good'?0.6:0.9)));
 G.result=G.miss?'miss':(saved?'save':'goal');
 // точка касания перчаткой и направление отбивания (для анимации сейва)
 if(saved){
   G.contact={cx:Math.max(80,Math.min(280,G.fx)),cy:Math.max(118,Math.min(212,G.fy))};
   const dir=Math.abs(G.contact.cx-180)>30?Math.sign(G.contact.cx-180):(Math.random()<0.5?-1:1);
   G.defl={cx:G.contact.cx+dir*(70+Math.random()*40),cy:G.contact.cy+95+Math.random()*50};
   G.saveAt=0.55;
 }
 const colX=[106,180,254],sm=(kc===fcc);
 if(G.result==='save')G.kTgt=mkTgt(G.contact.cx,G.contact.cy-26,1);
 else G.kTgt=mkTgt(sm?colX[kc]*0.5+fx*0.5:colX[kc],sm?(168+Math.min(226,Math.max(102,fy)))/2:165,sm?0.9:0.3);
 G.react=Math.min(G.react,G.result==='save'?G.saveAt-0.28:0.5);
 G.coins=G.result==='goal'?Math.round((10+(corner?5:0)+(q==='perfect'?5:0))*(1+clubBonus())):0;
}

/* --- Анимация --- */
function animate(){
 stopIdle();
 const ctx=$('cv').getContext('2d');
 const t0=performance.now();
 const DUR=1300*(1.3-0.3*(G.speedF||1)); // плохой тайминг = медленный мяч
 const trail=[],fired={},once=(n,f)=>{if(!fired[n]){fired[n]=1;f()}};
 const step=(tm)=>{
   if(!G||!$('cv'))return;
   const t=tm/1000;
   const k=Math.min(1,(tm-t0)/DUR);
   const runK=Math.min(1,k/0.24);
   const kickK=Math.max(0,Math.min(1,(k-0.24)/0.26));
   const ky=472-112*runK-6*kickK;
   let bx=BALL_START.x,by=BALL_START.y,ballK=0,tgt=null,e=0;
   if(k>0.37){
     ballK=Math.min(1,(k-0.37)/0.63);
     if(G.result==='post'){
       if(ballK<=0.65){e=1-Math.pow(1-ballK/0.65,3);tgt=G.contact}
       else{
         const u=(ballK-0.65)/0.35;
         const rx=G.contact.cx+(G.contact.cx-180)*0.6,ry=G.contact.cy+160;
         bx=G.contact.cx+(rx-G.contact.cx)*u;
         by=G.contact.cy+(ry-G.contact.cy)*u-Math.sin(u*Math.PI)*26;
       }
     }else if(G.result==='save'){
       // мяч долетает до перчатки и резко отбивается в сторону
       if(ballK<=G.saveAt){e=1-Math.pow(1-ballK/G.saveAt,3);tgt=G.contact}
       else{
         const u=(ballK-G.saveAt)/(1-G.saveAt);
         bx=G.contact.cx+(G.defl.cx-G.contact.cx)*u;
         by=G.contact.cy+(G.defl.cy-G.contact.cy)*u-Math.sin(u*Math.PI)*14;
       }
     }else if(G.result==='goal'){
       e=1-Math.pow(1-ballK,2.4);tgt={cx:G.fx,cy:G.fy+10};
     }else{
       e=1-Math.pow(1-ballK,3);tgt={cx:G.fx,cy:G.fy};
     }
     if(tgt){
       bx=BALL_START.x+(tgt.cx-BALL_START.x)*e;
       by=BALL_START.y+(tgt.cy-BALL_START.y)*e-Math.sin(ballK*Math.PI)*(G.result==='goal'?18:30);
     }
   }
   if(ballK>0)once('k',()=>AS.kickSnd());
   if(G.result==='save'&&ballK>=G.saveAt){once('h',()=>AS.saveSnd());if(ballK>=G.saveAt+(1-G.saveAt)*0.55)once('b',()=>AS.bounceSnd())}
   else if(G.result==='post'&&ballK>=0.65){once('h',()=>AS.postSnd());if(ballK>=0.85)once('b',()=>AS.bounceSnd())}
   else if(G.result==='goal'&&ballK>=0.8)once('h',()=>AS.netSnd());
   else if(G.result==='miss'&&ballK>=0.92)once('h',()=>AS.missSnd());
   let keepK=0,land=0;
   if(G.react!==undefined){
     const end=(G.result==='save')?G.saveAt:0.8;
     keepK=Math.max(0,Math.min(1,(ballK-G.react)/(end-G.react)));
     land=Math.max(0,Math.min(1,(ballK-end)/Math.min(0.35,1-end)));
   }
   if(k>0.37){trail.push([bx,by]);if(trail.length>7)trail.shift()}
   const impact=k>0.37?Math.max(0,1-(k-0.37)/0.08):0;
   const netT=(G.result==='goal'&&ballK>0.8)?(ballK-0.8)*0.63*DUR/1000:0;
   const fr={t,keepK,land,ballK,bx,by,kickK,ky,runK,impact,netT,trail:trail.slice(0,-1)};
   G.last=fr;draw(ctx,fr);
   if(k<1)requestAnimationFrame(step);
   else{G.phase='result';finish()}
 };
 requestAnimationFrame(step);
}

/* --- Итог удара --- */
function finish(){
 P.pens++;
 if(G.result==='goal'){
   P.goals++;cgAdd();G.goals++;G.streak++;if(G.corner)P.corners++;G.earned+=G.coins;P.coins+=G.coins;
   P.best=Math.max(P.best,G.streak);haptic('success');AS.goalSnd();
   G.celT=performance.now();setTimeout(startCel,0);
 }else{
   G.streak=0;haptic('error');
   if(G.result==='save')AS.oohSnd();
   else if(G.result==='post'){P.posts++;AS.oohSnd()}
 }

/* затемнение / осветление hex-цвета: amt от -1 до 1 */
function shade(hex,amt){
  let r,g,b;const m=/^rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(String(hex));
  if(m){r=+m[1];g=+m[2];b=+m[3]}
  else{const n=parseInt(String(hex).replace('#',''),16);r=(n>>16)&255;g=(n>>8)&255;b=n&255}
  if(amt>=0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  else{r*=1+amt;g*=1+amt;b*=1+amt}
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
function lum(hex){
  const n=parseInt(String(hex).replace('#',''),16);
  return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;
}
function rrect(ctx,x,y,w,h,r){
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);return}
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* --- Сетка ворот: волны и выгиб от удара мяча --- */
function netDisp(x,y,tau,cx,cy){
 const dx=x-cx,dy=y-cy,r=Math.hypot(dx,dy)||1,ux=dx/r,uy=dy/r;
 const env=Math.exp(-2.3*tau);
 const A=env*Math.sin(15*tau);                                  // выгиб и отдача
 const bulge=A*0.55*r*Math.exp(-(r/62)*(r/62));
 const front=Math.max(0,Math.min(1,(230*tau-r)/25));            // волна бежит от места удара
 const wave=3.4*env*front*Math.exp(-r/120)*Math.sin(0.2*r-17*tau);
 const sway=1.8*env*Math.sin(9*tau)*((y-110)/110);
 return[ux*(bulge+wave)+sway,uy*(bulge+wave)+0.6*wave];
}
function netBall(a){
 const tau=a.netT,env=Math.exp(-2.3*tau),A=env*Math.sin(15*tau),gy=206;
 const t2=Math.max(0,tau-0.22),prog=1-Math.exp(-2.6*t2);          // мяч после отдачи сползает вниз
 const fall=Math.max(0,gy-a.by)*prog;
 const bounce=prog>0.85?Math.abs(Math.sin(9*t2))*Math.exp(-3*t2)*6:0;
 return Object.assign({},a,{by:a.by+fall-bounce,sc:1-0.22*Math.max(0,A),noShadow:true,gs:prog});
}

 ctx.strokeStyle='rgba(255,255,255,.32)';ctx.lineWidth=0.8;

function limbShape(ctx,p1,p2,w1,w2,color,edge){

 const g=ctx.createLinearGradient(p1.x+nx*w1/2,p1.y+ny*w1/2,p1.x-nx*w1/2,p1.y-ny*w1/2);
 g.addColorStop(0,edge||shade(color,-0.24));
 g.addColorStop(0.42,shade(color,0.10));
 g.addColorStop(1,edge||shade(color,-0.24));
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.moveTo(p1.x+nx*w1/2,p1.y+ny*w1/2);
 ctx.quadraticCurveTo((p1.x+p2.x)/2+nx*wm,(p1.y+p2.y)/2+ny*wm, p2.x+nx*w2/2,p2.y+ny*w2/2);
 ctx.quadraticCurveTo(p2.x,p2.y, p2.x-nx*w2/2,p2.y-ny*w2/2);
 ctx.quadraticCurveTo((p1.x+p2.x)/2-nx*wm,(p1.y+p2.y)/2-ny*wm, p1.x-nx*w1/2,p1.y-ny*w1/2);
 ctx.quadraticCurveTo(p1.x,p1.y, p1.x+nx*w1/2,p1.y+ny*w1/2);
 ctx.fill();ctx.strokeStyle='rgba(6,10,16,.75)';ctx.lineWidth=0.9;ctx.lineJoin='round';ctx.stroke();
}

 const t=a.t||0;

 const kk=a.keepK||0,e=kk*kk*(3-2*kk),land=a.land||0;
 const look=dive?Math.max(-1,Math.min(1,((a.bx!==undefined?a.bx:180)-180)/70)):0;
 let kx=180,kfy=206,kth=0,side=0,rw=0;
 if(dive){
   const T=G.kTgt,th1=T.th;side=T.sd;
   const ant=Math.max(0,1-(a.ballK||0)/(G.react||0.4));
   let px,pyF;
   if(side){px=T.x-Math.sin(th1)*44;pyF=Math.min(T.y+Math.cos(th1)*44,190)+33.6}
   else{px=180+(T.x-180)*0.4;pyF=206-Math.max(0,Math.min(38,(168-T.y)*0.8))}
   const jump=Math.sin(Math.PI*Math.min(1,kk))*(side?8:12);
   kth=th1*e;kx=180+(px-180)*e+side*7*ant*(1-e);kfy=206+(pyF-206)*e-jump;
   if(land>0){const l=land*land*(3-2*land);   // падение на землю после прыжка
     kth=side?th1+(side*1.5-th1)*l:th1*(1-l);
     kfy=side?kfy+(231-kfy)*l:kfy+(206-kfy)*l;kx+=side*10*l}
   rw=T.rw*Math.min(1,kk*1.6)*(G.result==='save'?Math.max(0,1-land*2.5):Math.max(0,1-land*1.5));
 }
 keeper(ctx,kx,kfy,{dive:kk,side,t,look,th:kth,rw,land,gy:206,rt:{x:a.bx!==undefined?a.bx:180,y:a.by!==undefined?a.by:335}});
}

function fkPP(fx,fy,ph){const T=FKT[G.ti];return{sx:G.sx,sy:G.sy,fx,fy,bow:T.bow*G.dir,A:T.A*Math.pow(Math.max(1,G.dk||1),.75),dip:T.dip,wa:0,ph:ph||0}}
function fkPos(p,u){

 return{x:p.sx+(p.fx-p.sx)*u+p.bow*s+w,y:gy-h,h,gy};
}

function fkResolve(){
 const q=G.quality,T=FKT[G.ti],pp=fkPP(0,0,Math.random()),colX=[106,180,254];
 let r=q==='good'?8+Math.random()*10:(q==='bad'?26+Math.random()*30:0);
 r=r*T.err+(q==='perfect'&&T.err>1?(T.err-1)*18*Math.random():0);
 const an=Math.random()*6.283;
 let fx=70+G.aim.px+Math.cos(an)*r,fy=110+G.aim.py+Math.sin(an)*r*.65;
 const sf=q==='perfect'?1:(q==='good'?.72:.5);
 G.fl=T.ms*(1.3-.3*sf)*Math.pow(Math.max(1,G.dk||1),.6);
 Object.assign(pp,{fx,fy,wa:T.wa});
 // --- стенка ---
 G.wj=Math.random()<.3;
 const pw=fkPos(pp,G.uw);
 if(Math.abs(pw.x-G.wcx)<G.hs&&pw.h<74+(G.wj?16:0)+4){
  G.result='wall';G.pp=pp;G.corner=false;G.coins=0;

 }

 if(!G.miss&&hitPost(fx,fy)){G.result='post';G.coins=0;G.react=.3;G.kTgt=mkTgt(fx*.6+72,Math.min(215,Math.max(120,fy))*.6+67,.8);return}
 // --- вратарь ---
 const fcc=Math.min(2,Math.max(0,Math.floor((fx-70)/(220/3))));
 G.corner=Math.abs(fx-180)>74||fy<142;
 const kt=T.kt/sf,rt=q==='perfect'?.3:(q==='good'?.22:.16);
 const kc=Math.random()<T.mr?Math.max(0,Math.min(2,fcc+(Math.random()<.5?-1:1))):fcc;
 const kdist=Math.hypot(fx-180,(fy-168)*.95),vK=280*(1-BOOTS[P.look.boots].acc*.06);

 G.react=Math.min(rt/kt,.5);
 if(saved){
  const cx=Math.max(80,Math.min(280,fx)),cy=Math.max(118,Math.min(212,fy)),dir=Math.abs(cx-180)>30?Math.sign(cx-180):(Math.random()<.5?-1:1);

 }else{const sm=kc===fcc;G.kTgt=mkTgt(sm?colX[kc]*.5+fx*.5:colX[kc],sm?(168+Math.min(226,Math.max(102,fy)))/2:165,sm?.9:.3)}

/* --- Позиция мяча по прогрессу полёта bk (0..1 — полёт, >1 — после ворот) --- */
function fkBall(bk){
 const p=G.pp,u=Math.min(1,bk);
 if(bk<=0)return{bx:G.sx,by:G.sy,u:0,gy:G.sy+2};
 if(G.result==='wall'){
  const w=fkPos(p,Math.min(bk,G.uw));
  if(bk<=G.uw)return{bx:w.x,by:w.y,u:bk,gy:w.gy};
  const v=Math.min(1,(bk-G.uw)/.45),e=1-Math.pow(1-v,2);
  return{bx:w.x+G.rb[0]*e,by:w.y+G.rb[1]*e-Math.sin(v*Math.PI)*22,u:G.uw,gy:w.y+G.rb[1]*e+10};
 }
 const w=fkPos(p,u);let bx=w.x,by=w.y;
 if(bk>1){
  const v=Math.min(1,(bk-1)/.35);
  if(G.result==='goal')by+=10*Math.min(1,v*3);
  else if(G.result==='save'){bx=G.fx+(G.defl.cx-G.fx)*v;by=G.fy+(G.defl.cy-G.fy)*v-Math.sin(v*Math.PI)*14}
  else if(G.result==='post'){bx=G.fx+(G.fx-180)*.6*v;by=G.fy+160*v-Math.sin(v*Math.PI)*26}
 }
 return{bx,by,u,gy:w.gy};
}

function fkAnimate(){

  if(!G||!G.fk||!$('cv'))return;
  const el=Math.max(0,tm-t0),runK=Math.min(1,el/TR),kickK=Math.max(0,Math.min(1,(el-TR)/TK)),bk=Math.max(0,(el-L)/F);
  const b=fkBall(bk);
  if(bk>0)once('k',()=>AS.kickSnd());
  const R=G.result;
  if(R==='wall'){if(bk>=G.uw)once('h',()=>AS.wallSnd());if(bk>=G.uw+.3)once('b',()=>AS.bounceSnd())}
  else if(R==='save'){if(bk>=.95)once('h',()=>AS.saveSnd());if(bk>=1.2)once('b',()=>AS.bounceSnd())}
  else if(R==='post'){if(bk>=1)once('h',()=>AS.postSnd());if(bk>=1.22)once('b',()=>AS.bounceSnd())}
  else if(R==='goal'){if(bk>=1)once('h',()=>AS.netSnd())}
  else if(bk>=1)once('h',()=>AS.missSnd());
  if(bk>0){trail.push([b.bx,b.by]);if(trail.length>7)trail.shift()}
  const keepK=Math.max(0,Math.min(1,(bk-G.react)/(.95-G.react))),land=Math.max(0,Math.min(1,(bk-.95)/.35));
  const fr={t:tm/1000,bk,bx:b.bx,by:b.by,gy:b.gy,ballK:Math.min(1,b.u),keepK,land,runK,kickK,
   kx:G.sx-28*(1-runK),ky:G.sy+25+45*(1-runK)-6*kickK,impact:el>L?Math.max(0,1-(el-L)/110):0,
   netT:(G.result==='goal'&&bk>1)?(bk-1)*F/1000:0,trail:trail.slice(0,-1)};
  G.last=fr;drawFK(ctx,fr);
  if(bk<endBk)requestAnimationFrame(step);else{G.phase='result';fkFinish()}
 };
 requestAnimationFrame(step);
}

 const msgs={goal:`ГОЛ! ⚽ +${G.coins} 🪙`,save:'СЕЙВ! 🧤',miss:G.fy<102?'НАД ПЕРЕКЛАДИНОЙ! ❌':'МИМО! ❌',post:'ШТАНГА! 😱',wall:'В СТЕНКУ! 🧱'};
 const col={goal:'var(--good)',save:'var(--accent)',miss:'var(--bad)',post:'var(--gold)',wall:'var(--bad)'};
 $('ovl').innerHTML=`<div class="result" style="justify-content:flex-start;padding-top:${250/FK_H*100}%"><div class="rtext" style="color:${col[G.result]}">${msgs[G.result]}</div>
  <button class="btn" style="width:auto;padding:12px 28px" onclick="fkNext()">Дальше →</button></div>`;
}
function fkNext(){
 if(G.round>=5){fkEnd();return}
 G.round++;fkSetup();updHud();aimUI();fkPanel();startIdleFK();
}
function fkEnd(){
 stopIdle();
 let bonus=0;if(G.goals===5){bonus=40;P.coins+=bonus}
 dqTrack({k:'s',m:'fk',goals:G.goals});
 save();checkAch();
 app(`<h1>🏁 Серия штрафных</h1>
 <div class="card" style="text-align:center">
  <div class="prevwrap"><canvas id="pv" width="260" height="300"></canvas></div>
  <div class="name">Голов: ${G.goals} / 5</div>
  <div class="coins" style="font-size:20px">+${G.earned+bonus} 🪙</div>
  ${bonus?'<div class="small">Бонус за идеальную серию: +40 🪙</div>':''}
 </div>
 <button class="btn" onclick="startFK()">🔁 Играть снова</button>
 <button class="btn btn2" onclick="G=null;home()">🏠 В меню</button>`);
 const c=$('pv');if(c){c.getContext('2d').setTransform(2,0,0,2,0,0);updPv()}
}

/* --- Игрок из стенки --- */
function wallMan(ctx,x,fy,s,j,seed,t){
 fy-=j;
 const sk=['#f2d3b3','#d9a06b','#b97a4e','#8a5a33'][seed%4],SH='#1d4ed8',hip={x,y:fy-44*s},sho={x,y:hip.y-25*s};
 ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,fy+j+1.5*s,12*s,4*s,0,0,7);ctx.fill();
 [-1,1].forEach(sd=>{
  const kn={x:x+sd*5*s,y:hip.y+22*s},fo={x:x+sd*6*s,y:fy-3*s};
  limbShape(ctx,{x:x+sd*4*s,y:hip.y},kn,10*s,7*s,sk);limbShape(ctx,kn,fo,7*s,5*s,SH,shade(SH,-.25));
  ctx.fillStyle='#0d0f12';ctx.beginPath();ctx.ellipse(fo.x+sd*1.5*s,fo.y+2*s,5*s,2.6*s,0,0,7);ctx.fill();
 });
 ctx.fillStyle='#f3f4f6';rrect(ctx,x-9.5*s,hip.y-5*s,19*s,14*s,3*s);ctx.fill();
 const g=ctx.createLinearGradient(x-12*s,0,x+12*s,0);g.addColorStop(0,shade(SH,-.28));g.addColorStop(.4,shade(SH,.2));g.addColorStop(1,shade(SH,-.3));
 jerseyPath(ctx,hip,sho,8.4*s,12.5*s,s);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(6,10,16,.6)';ctx.lineWidth=1;ctx.stroke();
 [-1,1].forEach(sd=>{ // руки прикрывают пах
  const sp={x:x+sd*11*s,y:sho.y+2*s},el={x:x+sd*9*s,y:sho.y+14*s},ha={x:x+sd*2*s,y:hip.y+4*s};
  limbShape(ctx,sp,el,7*s,5*s,SH);limbShape(ctx,el,ha,5*s,4*s,sk);
 });
 const hc={x,y:sho.y-12*s};
 ctx.fillStyle=sk;ctx.beginPath();ctx.arc(hc.x,hc.y,7.2*s,0,7);ctx.fill();ctx.strokeStyle='rgba(6,10,16,.6)';ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle='#241a10';ctx.beginPath();ctx.arc(hc.x,hc.y-.6*s,7.4*s,Math.PI*1.02,Math.PI*1.98);ctx.fill();
 ctx.fillStyle='#1b1b1b';[-2.6,2.6].forEach(e=>{ctx.beginPath();ctx.arc(hc.x+e*s,hc.y+.4*s,.9*s,0,7);ctx.fill()});
}

/* --- Кадр сцены штрафного --- */
function drawFK(ctx,a){
 ctx=ctx||$('cv').getContext('2d');a=a||{};
 const t=a.t||0,cel=G.celT?Math.max(0,1-(performance.now()-G.celT)/1800):0;
 if(cel>0){const sh=cel*2.6;ctx.save();ctx.translate(Math.sin(t*55)*sh,Math.cos(t*42)*sh*.6)}
 stadium(ctx,t,360,520);stands(ctx,t,cel);scoreboard(ctx,t);boards(ctx,t);pitch(ctx,360,FK_H);stadiumFx(ctx,t,FK_H);
 goal(ctx,a);drawKeeper(ctx,a);
 ctx.strokeStyle='#f8f8f8';ctx.lineWidth=6;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(70,220);ctx.lineTo(70,110);ctx.lineTo(290,110);ctx.lineTo(290,220);ctx.stroke();
 const jp=G.wj&&a.bk!==undefined?Math.max(0,Math.min(1,(a.bk-(G.uw-.15))/.3)):0,jh=Math.sin(Math.PI*jp)*16;
 for(let i=0;i<G.n;i++)wallMan(ctx,G.wcx+(i-(G.n-1)/2)*18,G.wy,.82,jh,i+G.round,t);
 drawStriker(ctx,a.kx!==undefined?a.kx:G.sx-28,a.ky!==undefined?a.ky:G.sy+70,{run:a.runK||0,kick:a.kickK||0,scale:1.25,t,dance:a.dance,dir:1});
 if(G.phase==='power'&&G.aim)fkPreview(ctx);
 const bx=a.bx!==undefined?a.bx:G.sx,by=a.by!==undefined?a.by:G.sy,bk=a.ballK||0,goalNet=G.result==='goal'&&a.netT>0;
 if(!goalNet){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bx,a.gy!==undefined?a.gy:G.sy+2,Math.max(4,11-5*bk),Math.max(1.5,4.4-1.8*bk),0,0,7);ctx.fill()}
 const bo={bx,by,ballK:bk,trail:a.trail,t,noShadow:true,sc:1.1,netT:a.netT};
 ball(ctx,goalNet?netBall(bo):bo);
 if(a.impact>0){const im=a.impact;ctx.save();ctx.translate(G.sx,G.sy);ctx.strokeStyle='rgba(255,255,255,'+(im*.9)+')';ctx.lineWidth=2;ctx.lineCap='round';
  for(let i=0;i<10;i++){const an=i*.628+.3,r1=9+(1-im)*12,r2=r1+8*im+3;ctx.beginPath();ctx.moveTo(Math.cos(an)*r1,Math.sin(an)*r1*.7);ctx.lineTo(Math.cos(an)*r2,Math.sin(an)*r2*.7);ctx.stroke()}
  ctx.restore()}
 snowfall(ctx,t,FK_H);
 if(cel>0){confetti(ctx,t,cel);ctx.restore()}
}

nav();
