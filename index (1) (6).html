<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GOAL🥅</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<script>try{document.fonts.load("700 1em Oswald","Ж").then(function(r){if(r&&r.length)document.documentElement.classList.add("fdok")})}catch(e){}</script>
<style>
:root{--bg:#0e1621;--card:#17212b;--card2:#1e2a38;--accent:#2aabee;--text:#fff;--muted:#8fa3b8;--good:#2ecc71;--bad:#e74c3c;--gold:#f1c40f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
#app{max-width:420px;margin:0 auto;padding:14px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;text-align:center;margin:6px 0}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn2{background:var(--card2);color:var(--text)}
.pencil{background:var(--card2);border:none;border-radius:8px;width:26px;height:26px;font-size:13px;line-height:1;cursor:pointer;vertical-align:middle;margin-left:4px;padding:0}
.pencil:active{transform:scale(.9)}
.botbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,var(--bg) 65%,rgba(0,0,0,0));z-index:50;pointer-events:none}
.btab{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:12px 26px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(42,171,238,.45)}
.btab:active{transform:scale(.96)}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menugrid .btn{padding:12px 6px;font-size:14px;line-height:1.25;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;gap:0 4px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.avwrap{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.25);flex:none;background:#0d3a1e}
.name{font-size:18px;font-weight:700}
.coins{color:var(--gold);font-weight:700}
.statline{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.statline b{color:var(--text)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #2b3a4d;background:var(--card2);color:#fff;font-size:16px;user-select:text}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:42px;height:42px;border-radius:12px;cursor:pointer;border:3px solid transparent}
.swatch.sel{border-color:#fff}
.stagewrap{position:relative}
canvas.game{width:100%;display:block;border-radius:16px}
#ovl{position:absolute;inset:0;pointer-events:none}
.goaltarget{position:absolute;pointer-events:auto;cursor:pointer;touch-action:none}
.powerwrap{position:absolute;left:8px;right:8px;bottom:10px;background:rgba(0,0,0,.55);border-radius:14px;padding:10px;pointer-events:auto}
.powerbar{position:relative;height:26px;border-radius:13px;background:#202d3d;overflow:hidden}
.zone{position:absolute;top:0;bottom:0}
.z-y{background:rgba(241,196,15,.35)}
.z-g{background:rgba(46,204,113,.5)}
.needle{position:absolute;top:-2px;bottom:-2px;width:4px;background:#fff;border-radius:2px;box-shadow:0 0 6px #000}
.kickbtn{margin-top:8px}
.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:26px;gap:12px;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0) 52%);border-radius:16px;pointer-events:none}.result .btn{pointer-events:auto}
.rtext{font-size:32px;font-weight:800;text-shadow:0 2px 8px #000;text-align:center}
.shopitem{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:10px}
.shopitem .btn{width:auto;padding:10px 14px;font-size:13px;white-space:nowrap}
.kitdot{width:34px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,.3);flex:none}
.small{font-size:12px;color:var(--muted)}
.hud{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.hud b{color:var(--gold)}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:10px;border-radius:12px;background:var(--card2);color:var(--muted);font-weight:700;border:none;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.prevwrap{background:linear-gradient(180deg,#12202e,#0d3a1e);border-radius:14px;display:flex;justify-content:center;padding:6px 0}
.sndbtn{width:auto!important;padding:8px 12px!important;font-size:13px!important}
#cfm{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.cfmbox{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:14px}
.cfmt{font-size:16px;text-align:center;line-height:1.35}
.stagewrap.fk{width:100%}

/* стили: достижения */
.achhero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#223246,#17212b);border:1px solid #2b3a4d;border-radius:20px;padding:14px}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 0 18px rgba(241,196,15,.25)}
.ring b{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:19px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 13px;border-radius:999px;border:none;background:var(--card2);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(42,171,238,.4)}
.ach{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:var(--card2);border-left:4px solid var(--tc)}
.ach.done{background:linear-gradient(90deg,rgba(255,255,255,.08),var(--card2))}
.achi{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:var(--card);border:2px solid var(--tc);flex:none}
.ach:not(.done) .achi{filter:grayscale(1);opacity:.65}
.achn{font-weight:700;font-size:15px}
.achb{height:6px;border-radius:3px;background:#0e1621;margin:6px 0 3px;overflow:hidden}
.achb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7fe0ff);border-radius:3px}
.achr{font-weight:800;color:var(--gold);font-size:13px;white-space:nowrap;text-align:right}
.achr small{display:block;font-size:10px;font-weight:700;color:var(--tc);letter-spacing:.4px;margin-top:2px}
/* стили: регистрация */
.crh{text-align:center;margin-top:2px}.crh h1{font-size:30px;letter-spacing:1px;margin:0}.crh p{color:var(--muted);font-size:14px;margin-top:2px}
.crstage{position:relative;border-radius:22px;overflow:hidden;border:1px solid #2b3a4d;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.crstage canvas{display:block;width:100%;height:auto}
.crrand{position:absolute;top:10px;right:10px;width:auto;padding:8px 13px;font-size:13px;border-radius:999px;background:rgba(14,22,33,.72);border:1px solid rgba(255,255,255,.18)}
.crsec{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:11px}
.crlbl{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--muted)}
.crin{position:relative}.crin span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px}
.crin input{padding:14px 12px 14px 44px;font-weight:700;font-size:18px;border:2px solid #2b3a4d;transition:border-color .2s}.crin input:focus{outline:none;border-color:var(--accent)}
.crsw{display:flex;gap:8px;justify-content:space-between}
.crsk{flex:1;aspect-ratio:1;max-width:52px;border-radius:50%;border:3px solid rgba(255,255,255,.12);box-shadow:inset 0 -6px 10px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.4);cursor:pointer;transition:transform .15s}
.crsk.sel{border-color:#fff;transform:scale(1.14);box-shadow:0 0 0 3px rgba(42,171,238,.7),0 4px 10px rgba(0,0,0,.5)}
.crhr{display:flex;gap:8px}.crhr button,.crq button{flex:1;padding:11px 4px;border-radius:13px;border:2px solid transparent;background:var(--card2);color:var(--muted);font-weight:800;font-size:14px;cursor:pointer}
.crhr button.on,.crq button.on{background:rgba(42,171,238,.18);border-color:var(--accent);color:#fff}
.crnum{display:flex;align-items:center;gap:10px}
.crstep{width:56px;height:56px;border-radius:18px;border:none;background:var(--card2);color:#fff;font-size:28px;font-weight:700;cursor:pointer}.crstep:active{transform:scale(.92)}
.crbig{flex:1;text-align:center;font-size:48px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#7fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.crq{display:flex;gap:8px}
.crgo{padding:18px;font-size:18px;border-radius:18px;background:linear-gradient(135deg,#1e6fff,#2aabee);box-shadow:0 6px 22px rgba(30,111,255,.55)}
/* главный экран: компактно */
.hm{display:flex;flex-direction:column;gap:7px;margin-top:-6px}
.hmtop{min-height:28px}
.hmlogo{font-size:15px;font-weight:800;letter-spacing:.8px;opacity:.85}
.hm .sndbtn{padding:5px 10px!important;font-size:12px!important;border-radius:10px!important}
.hm .card{padding:11px 12px;gap:7px;border-radius:14px}
.hm .avwrap{width:62px;height:62px;border-width:2px}
.hm .name{font-size:16px}
.hm .statline{font-size:12.5px}
.hm .btn{padding:11px;font-size:15px;border-radius:12px}
.hm .menugrid{gap:6px}
.hm .menugrid .btn{padding:8px 6px;font-size:13px;min-height:42px}
/* трансферы */
.tr{display:flex;flex-direction:column;gap:10px}
.trhero{position:relative;overflow:hidden;border-radius:22px;padding:16px;color:#fff;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 28px rgba(0,0,0,.5)}
.trhero:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 24px,transparent 24px 48px),radial-gradient(120% 90% at 90% 0%,rgba(255,255,255,.22),transparent 60%)}
.trhero>*{position:relative}
.trtag{font-size:11px;font-weight:800;letter-spacing:1.4px;opacity:.85}
.trname{font-size:25px;font-weight:900;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.trlgn{font-size:12.5px;opacity:.8;color:inherit}
.trkit{position:absolute!important;right:-18px;bottom:-26px;opacity:.14;transform:rotate(-10deg);pointer-events:none}
.trkit.sm{right:-10px;bottom:-14px;top:auto;opacity:.16}
.trtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trtile{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}.trtile b{display:block;font-size:19px}.trtile span{font-size:11px;color:var(--muted)}
.trbar{height:8px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:5px}.trbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2ecc71,#b6ff7a)}.trbar.sm{height:6px;margin:7px 0 3px}
.trsec{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted);margin-top:4px}
.trc{position:relative;overflow:hidden;display:flex;align-items:center;gap:11px;padding:12px 12px 12px 17px;border-radius:18px;border:1px solid rgba(255,255,255,.07)}
.trc>*{position:relative}
.trstrip{position:absolute!important;left:0;top:0;bottom:0;width:6px}
.trc.here{border-color:#f1c40f;box-shadow:0 0 0 1px rgba(241,196,15,.5),0 0 22px rgba(241,196,15,.25)}
.trc.open{border-color:rgba(46,204,113,.55)}
.trc.lock .trcr{filter:grayscale(1) brightness(.7)}.trc.lock .trn{opacity:.7}.trc.lock .trkit{filter:grayscale(1)}
.trn{font-size:16px;font-weight:800;line-height:1.15}
.trchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.trchips span{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.09);color:var(--muted)}
.trbtn{width:auto;padding:10px 12px;border:none;border-radius:12px;background:var(--card2);color:var(--text);font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer;border:1px solid rgba(255,255,255,.12)}
.trbtn.go{background:linear-gradient(135deg,#1fb85a,#2ecc71);color:#06210f;border:none;box-shadow:0 4px 14px rgba(46,204,113,.45);animation:trpulse 1.8s infinite}
@keyframes trpulse{50%{box-shadow:0 4px 22px rgba(46,204,113,.8)}}
.trbadge{font-size:12px;font-weight:800;color:#f1c40f;text-align:center;white-space:nowrap}.trbadge.lock{color:var(--muted)}
.trsign{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;overflow:hidden;animation:trin .35s ease-out}
.trsign .tsin{position:relative;width:100%;max-width:340px;animation:trpop .6s cubic-bezier(.2,1.4,.4,1)}
.trsign .cf{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:trfall 2.6s linear infinite}
@keyframes trin{from{opacity:0}}@keyframes trpop{from{transform:scale(.6);opacity:0}}
@keyframes trfall{to{transform:translateY(110vh) rotate(540deg)}}
/* магазин */
.sh{display:flex;flex-direction:column;gap:10px}
.shwal{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:linear-gradient(135deg,#3d2f06,#1e1703);border:1px solid #b8860b;color:#ffd84d;font-weight:800;font-size:15px;box-shadow:0 0 14px rgba(255,200,40,.2)}
.shtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}.shtabs::-webkit-scrollbar{display:none}
.shtab{flex:none;padding:9px 14px;border:none;border-radius:14px;background:var(--card2);color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.shtab small{font-size:10px;font-weight:700;opacity:.75}
.shtab.on{background:linear-gradient(135deg,#1e6fff,#2aabee);color:#fff;box-shadow:0 4px 14px rgba(42,171,238,.4)}
.shstage{position:relative;border-radius:22px;overflow:hidden;border:1px solid #2b3a4d;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.shstage canvas{display:block;width:100%;height:auto;aspect-ratio:240/232}
.shplate{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:26px 14px 10px;background:linear-gradient(0deg,rgba(4,8,14,.94) 35%,rgba(4,8,14,0))}
.shtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.2px;border:1px solid;border-radius:999px;padding:2px 8px}
.shpn{font-size:17px;font-weight:900;text-shadow:0 2px 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shpp{font-weight:800;font-size:14px;color:#ffd84d;white-space:nowrap}
.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shc{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 10px 10px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015)),var(--card);border:1.5px solid rgba(255,255,255,.07);cursor:pointer}
.shc:before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--r)}
.shc.sel{box-shadow:0 0 0 2px var(--accent)}.shc.eq{border-color:rgba(46,204,113,.7)}
.shc.leg{animation:shglow 2.4s infinite}
@keyframes shglow{50%{box-shadow:0 0 18px rgba(255,94,87,.35)}}
.shrar{position:absolute;top:9px;left:11px;font-size:9px;font-weight:800;letter-spacing:1px;color:var(--r)}
.shthumb{height:90px;display:flex;align-items:center;justify-content:center;width:100%}
.shico{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:42px}
.shn{font-size:15px;font-weight:800;text-align:center;line-height:1.15}
.shs{font-size:11px;color:var(--muted);text-align:center;line-height:1.25;min-height:28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shbtn{width:100%;padding:10px 6px;border-radius:12px;background:var(--card2);color:var(--text);font-weight:800;font-size:14px;cursor:pointer;border:1px solid rgba(255,255,255,.12)}
.shbtn.buy{background:linear-gradient(135deg,#ffd84d,#f5a300);color:#2a1c00;border:none;box-shadow:0 4px 12px rgba(245,163,0,.35)}
.shbtn.buy.poor{background:#3a3320;color:#9c8f66;box-shadow:none}
.shst{width:100%;padding:10px 4px;border-radius:12px;text-align:center;font-weight:800;font-size:13px;background:rgba(46,204,113,.15);color:#4be38a}
.shst.lock{background:rgba(255,94,87,.12);color:#ff8a84}
/* стили: награды и задания */
.cn{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;vertical-align:-.2em;background:radial-gradient(circle at 34% 28%,#fff7c8 0,#ffd649 32%,#d99a14 66%,#8a5a08);box-shadow:inset 0 0 0 .09em #b9811a,inset 0 0 0 .15em rgba(255,232,140,.9),0 1px 2px rgba(0,0,0,.55)}
.rwn{font-style:italic;font-weight:900;font-variant-numeric:tabular-nums}
.rwtop{display:flex;align-items:center;gap:10px;margin-top:4px}
.rwt{font-size:22px;font-weight:900}
.rws{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.rws b{color:#fff}
.rwbal{display:flex;align-items:center;gap:7px;padding:7px 13px 7px 9px;border-radius:999px;background:linear-gradient(180deg,#1d2b3a,#121c27);border:1px solid rgba(241,196,15,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.4);font-size:17px;color:#ffe08a;flex:none}
.gold{display:block;width:100%;padding:14px;border:0;border-radius:14px;font-size:16px;font-weight:900;color:#3a2406;cursor:pointer;background:linear-gradient(180deg,#fff0a6 0,#ffcf3f 38%,#e4a11a 70%,#c88410 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(120,70,6,.45),0 6px 18px rgba(241,170,15,.35),0 3px 0 #8a5a08;text-shadow:0 1px 0 rgba(255,255,255,.45)}
.gold:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 2px 8px rgba(241,170,15,.3),0 0 0 #8a5a08}
.gold.sm{padding:10px;font-size:14px}
.rwhero{position:relative;overflow:hidden;border-radius:22px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:14px;border:1px solid rgba(255,255,255,.08);background:radial-gradient(90% 60% at 50% -8%,rgba(255,238,176,.26),transparent 62%),repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 30px,transparent 30px 60px),linear-gradient(180deg,#123125 0,#0e2230 70%,#0c1a26 100%);box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
.rwhero::after{content:'';position:absolute;left:50%;bottom:-130px;width:250px;height:250px;margin-left:-125px;border-radius:50%;border:2px solid rgba(255,255,255,.06);pointer-events:none}
.rays{position:absolute;left:-40px;top:-80px;width:240px;height:240px;background:repeating-conic-gradient(rgba(255,224,130,.17) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);opacity:0;pointer-events:none}
.rdy .rays{opacity:1;animation:rwspin 40s linear infinite}
.rwhd{position:relative;display:flex;align-items:center;gap:15px}
.rwk{font-size:14px;color:#cfe3d8;font-weight:700}
.rwbig{font-size:30px;line-height:1.15;margin:2px 0 3px;color:#ffe08a;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.bc{position:relative;width:96px;height:96px;flex:none;border-radius:50%;background:repeating-conic-gradient(#f7c93c 0 3deg,#a9730f 3deg 6deg);box-shadow:0 12px 24px rgba(0,0,0,.55),0 0 0 2px #7a4f0b,inset 0 0 6px rgba(0,0,0,.4);display:grid;place-items:center;overflow:hidden}

<div id="app"></div>
<script>
/* ===== Telegram Web App ===== */
const tg = window.Telegram && window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0e1621');tg.setBackgroundColor('#0e1621');}catch(e){}}
function haptic(t){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(t)}catch(e){}}

/* ===== Звук (WebAudio, без файлов) ===== */
const AS={ctx:null,muted:false,
 init(){if(this.ctx)return;try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  this.ctx=new C();
  this.master=this.ctx.createGain();
  this.master.gain.value=this.muted?0:1;
  this.master.connect(this.ctx.destination);
  const b=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate);
  const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  this.nb=b;this.crowd();this.music();
  if(this.ctx.state==='suspended')this.ctx.resume();
 }catch(e){}},
 crowd(){const c=this.ctx;if(!c)return;try{
  const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  const g=c.createGain();g.gain.value=0.03;
  s.connect(f);f.connect(g);g.connect(this.master);s.start();
 }catch(e){}},
 noise(dur,freq,vol,when=0){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime+when;
  const s=c.createBufferSource();s.buffer=this.nb;s.playbackRate.value=0.7+Math.random()*0.6;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(this.master);s.start(t0);s.stop(t0+dur+0.05);
 }catch(e){}},
 tone(fr,dur,vol,type='sine',when=0){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime+when;
  const o=c.createOscillator();o.type=type;o.frequency.value=fr;
  const g=c.createGain();g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+0.02);
 }catch(e){}},

 /* ---- Тихий спокойный эмбиент-саундтрек (генерируется на лету) ---- */
 music(){const c=this.ctx;if(!c)return;try{
  const mb=c.createGain();mb.gain.value=0.5;this.mbus=mb;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;
  const len=c.sampleRate*3,ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
  const cv=c.createConvolver();cv.buffer=ir;
  const wet=c.createGain();wet.gain.value=0.6;const dry=c.createGain();dry.gain.value=0.55;
  mb.connect(lp);lp.connect(dry);lp.connect(cv);cv.connect(wet);dry.connect(this.master);wet.connect(this.master);
  const fq=m=>440*Math.pow(2,(m-69)/12);
  const prog=[[45,52,60,64,71],[41,48,57,64,69],[48,55,59,64,67],[43,50,59,64,69]]; // Am9 · Fmaj7 · Cmaj7 · G6/9
  const pent=[69,72,74,76,79,81];
  const pad=(m,t,dur,vol)=>{[-6,6].forEach(det=>{
    const o=c.createOscillator();o.type=m<55?'sine':'triangle';o.frequency.value=fq(m);o.detune.value=det;
    const g=c.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+2.5);g.gain.setValueAtTime(vol,t+dur);g.gain.linearRampToValueAtTime(0.0001,t+dur+2.5);
    o.connect(g);g.connect(mb);o.start(t);o.stop(t+dur+2.6)})};
  const bell=(m,t)=>{[[1,0.05],[2,0.012]].forEach(([k,v])=>{
    const o=c.createOscillator();o.type='sine';o.frequency.value=fq(m)*k;
    const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+3.5);
    o.connect(g);g.connect(mb);o.start(t);o.stop(t+3.6)})};
  this.mNext=c.currentTime+0.2;this.mI=0;
  const sched=()=>{if(c.state!=='running')return;
   while(this.mNext<c.currentTime+3){
    const t=this.mNext,ch=prog[this.mI%4];
    ch.forEach((m,i)=>pad(m,t+i*0.15,8,m<50?0.05:0.028));
    const n=3+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++)bell(pent[Math.floor(Math.random()*pent.length)],t+1+Math.random()*6);
    this.mNext+=8;this.mI++;
   }};
  sched();this.mT=setInterval(sched,1000);
 }catch(e){}},
 duck(sec){const c=this.ctx;if(!c||!this.mbus)return;try{ // приглушаем музыку на время рёва трибун
  const g=this.mbus.gain,t=c.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
  g.setTargetAtTime(0.15,t,0.1);g.setTargetAtTime(0.5,t+sec,1.2);
 }catch(e){}},
 sweep(f0,f1,dur,vol,type='sine',when=0){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime+when;
  const o=c.createOscillator();o.type=type;
  o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=c.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+0.02);
 }catch(e){}},
 whistleSnd(){if(this.muted)return;this.tone(2850,0.16,0.1,'triangle');this.tone(2650,0.22,0.1,'triangle',0.17)},
 bounceSnd(){if(this.muted)return;
  [[0,0.32],[0.2,0.18],[0.34,0.09]].forEach(([w,v])=>{this.sweep(210,95,0.09,v,'sine',w);this.noise(0.05,700,v*0.5,w)})},
 netSnd(){if(this.muted)return;
  this.noise(0.5,2600,0.22);this.noise(0.35,4800,0.12,0.04);this.sweep(120,60,0.18,0.3)},
 wallSnd(){if(this.muted)return;
  this.sweep(170,60,0.14,0.55);this.noise(0.1,600,0.4)},
 kickSnd(){if(this.muted)return;this.noise(0.07,1800,0.45);this.noise(0.1,600,0.3);this.sweep(160,55,0.14,0.55)},
 roar(dur,vol){const c=this.ctx;if(!c)return;try{
  const t0=c.currentTime;
  const bus=c.createGain();bus.gain.setValueAtTime(0.0001,t0);
  bus.gain.exponentialRampToValueAtTime(vol,t0+0.35);
  bus.gain.setValueAtTime(vol,t0+dur*0.5);
  bus.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  bus.connect(this.master);
  [[700,1.4],[1150,1],[2700,0.45]].forEach(([f,gv])=>{
   const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=2.2;
   const g=c.createGain();g.gain.value=gv;bp.connect(g);g.connect(bus);
   const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;s.playbackRate.value=0.9+Math.random()*0.2;
   s.connect(bp);s.start(t0);s.stop(t0+dur+0.1);
   for(let i=0;i<6;i++){ // «голоса» болельщиков: пилы с вибрато и подъёмом тона
    const o=c.createOscillator();o.type='sawtooth';
    const f0=150+Math.random()*260;
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.linearRampToValueAtTime(f0*1.2,t0+0.5);
    o.frequency.linearRampToValueAtTime(f0*1.04,t0+dur);

/* ===== ⚔️ БИТВА КЛУБОВ: «Недельная война» (пн 00:00 — вс 24:00 по Москве) ===== */
const CW_DAY=864e5,CW_TZ=3*36e5,CW_KEEP=4,CW_WIN_GOALS=10,CW_WIN_COINS=150,CW_PART_COINS=30,CW_BOT=120,CW_STREAK=3,CW_STREAK_BONUS=0.05;
const CW_RARE=[{k:'dances',i:5},{k:'balls',i:5},{k:'stadiums',i:5},{k:'dances',i:6},{k:'dances',i:7},{k:'balls',i:6},{k:'boots',i:4},{k:'dances',i:8},{k:'dances',i:9}];   // пул эксклюзивов (по порядку)
let CW={rows:[],ok:null},cwTab='war',cwTimer=null,cwTop=null,cwBusy=false;
function cwWeek(t){return Math.floor(((t||Date.now())+CW_TZ-4*CW_DAY)/(7*CW_DAY))}
function cwEnd(w){return (w+1)*7*CW_DAY+4*CW_DAY-CW_TZ}
function cwRng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cwShuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* соперники недели: внутри лиги; одиночки/лишние сводятся в общий пул; без пары — «Легенды» (-1) */
function cwPairs(w){
 const r=cwRng(w*7919+13),by={},opp={};let rest=[];
 CLUBS.forEach((c,i)=>{if(i)(by[c.lg]=by[c.lg]||[]).push(i)});
 Object.keys(by).sort().forEach(lg=>{const a=cwShuffle(by[lg],r);while(a.length>1){const x=a.pop(),y=a.pop();opp[x]=y;opp[y]=x}if(a.length)rest.push(a[0])});
 rest=cwShuffle(rest,r);while(rest.length>1){const x=rest.pop(),y=rest.pop();opp[x]=y;opp[y]=x}
 if(rest.length)opp[rest[0]]=-1;
 return opp}
function cwBotFinal(w){return Math.round(CW_BOT*(0.6+0.8*cwRng(w*31+7)()))}
function cwF(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')}
function cwFrame(n){return n>=CW_STREAK?'border:2px solid #f5b301;box-shadow:0 0 12px rgba(245,179,1,.55);background:rgba(245,179,1,.12);':''}
function clubBonus(){const st=P.cws&&P.cws.w===cwWeek()&&P.cws.s&&P.cws.s[P.club]>=CW_STREAK;return CLUBS[P.club].bonus+(st?CW_STREAK_BONUS:0)}
async function cwSubmit(){
 if(!P.created||!P.cw)return;const rows=[];
 Object.keys(P.cw).forEach(w=>Object.keys(P.cw[w]).forEach(c=>{if(+c&&P.cw[w][c]>0)rows.push({uid:UID,week:+w,club:+c,goals:P.cw[w][c],name:P.name})}));
 if(!rows.length)return;
 try{await sb('club_week?on_conflict=uid,week,club',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}catch(e){}
}
async function cwLoad(){
 try{const arr=await sb('club_week?select=uid,week,club,goals,name&goals=gt.0&week=gte.'+(cwWeek()-12)+'&limit=10000');
  if(!Array.isArray(arr))throw 0;CW.rows=arr.filter(r=>r.uid!==UID);CW.ok=true}catch(e){CW.ok=false}
 return CW.ok}
function cwAgg(w){
 const tot={},ppl={},add=(u,n,c,g)=>{tot[c]=(tot[c]||0)+g;(ppl[c]=ppl[c]||[]).push({uid:u,name:n,g})};
 CW.rows.forEach(r=>{if(r.week===w)add(r.uid,r.name,r.club,r.goals)});
 const m=(P.cw||{})[w]||{};Object.keys(m).forEach(c=>{if(+c&&m[c]>0)add(UID,P.name,+c,m[c])});
 return{tot,ppl}}
function cwResult(w,c,agg){
 const opp=cwPairs(w)[c];if(opp==null)return null;
 const me=agg.tot[c]||0,op=opp===-1?cwBotFinal(w):(agg.tot[opp]||0);
 return{me,op,opp,res:me>op?1:me<op?-1:0}}
function cwStreaks(){
 const cur=cwWeek(),ag={},st={};
 for(let w=cur-1;w>=cur-10;w--)ag[w]=cwAgg(w);
 CLUBS.forEach((c,i)=>{if(!i)return;let n=0;for(let w=cur-1;w>=cur-10;w--){const r=cwResult(w,i,ag[w]);if(r&&r.res===1&&r.me>0)n++;else break}st[i]=n});
 return st}
/* выдать следующий эксклюзив из пула (если всё собрано — 300 монет) */
function cwGrant(why){

 if(!it){P.coins+=300;toast('🎁 '+why+' +300 🪙');return}
 const o=TABS[it.k].list[it.i];P.own[it.k].push(it.i);
 toast('🎁 '+why+' Эксклюзив: <b>'+o.n+'</b> '+(o.icon||'⚽'));
}
/* награды за завершённые недели (один раз) */
function cwClaim(){
 const cur=cwWeek();if(!P.created||CW.ok!==true)return;
 if(typeof P.cwc!=='number'){P.cwc=cur-1;return}
 for(let w=Math.max(P.cwc+1,cur-CW_KEEP);w<cur;w++){
  const agg=cwAgg(w),m=(P.cw||{})[w]||{};
  Object.keys(m).forEach(k=>{const c=+k,g=m[k];if(!c||g<1)return;
   const r=cwResult(w,c,agg);if(!r)return;
   if(r.res===1&&g>=CW_WIN_GOALS){P.coins+=CW_WIN_COINS;P.champ=(P.champ||0)+1;toast('🏅 <b>Чемпион недели!</b> '+CLUBS[c].n+' победил · +'+CW_WIN_COINS+' 🪙');if(P.champ%3===0)cwGrant('Третий титул чемпиона!')}
   else{P.coins+=CW_PART_COINS;toast((r.res===1?'🏆 Победа клуба ':'⚽ Участие в битве: ')+CLUBS[c].n+' · +'+CW_PART_COINS+' 🪙')}
   if(r.res===1){
    const top=(agg.ppl[c]||[]).slice().sort((x,y)=>y.g-x.g||(x.uid<y.uid?-1:1))[0];
    if(top&&top.uid===UID)cwGrant('Лучший бомбардир клуба!');
   }
  });
 }
 P.cwc=cur-1;
}

function cwWar(s){
 if(!P.club)return '<div class="fxe">Дворовая команда не воюет 🙂<br>Вступи в клуб в «Трансферах», чтобы участвовать в битве.</div>';
 const w=cwWeek(),now=Date.now(),end=cwEnd(w),frac=Math.min(1,Math.max(0,1-(end-now)/(7*CW_DAY)));
 const agg=cwAgg(w),pr=cwPairs(w),opp=pr[P.club],bot=cwBotFinal(w),nm=i=>i===-1?'Легенды 🏛️':CLUBS[i].n;
 const gt=i=>i===-1?Math.round(bot*frac):(agg.tot[i]||0);
 const me=gt(P.club),op=gt(opp),mine=((P.cw||{})[w]||{})[P.club]||0;
 const left=Math.max(0,end-now),d=Math.floor(left/CW_DAY),h=Math.floor(left%CW_DAY/36e5),m=Math.floor(left%36e5/6e4);
 const share=me+op?Math.round(me*100/(me+op)):50,st=s[P.club]||0;
 let o=`<div class="btcard" style="${cwFrame(st)}">
  <div class="btt"><span>⚔️ Недельная война</span><span>⏳ ${d}д ${h}ч ${m}м</span></div>

  <div class="bttug" style="--p:${share}"><i></i><b class="ball"></b></div>

  <div class="ml" style="border:0;padding:0">Твой вклад<b>⚽ ${mine}${me?' · '+Math.round(mine*100/me)+'%':''}</b></div>
  <div class="rws">${mine>=CW_WIN_GOALS?'✅ Норма для значка «Чемпион недели» выполнена':'До значка «Чемпион недели» ещё '+(CW_WIN_GOALS-mine)+' гол.'}</div></div>`;
 o+=`<div class="btrw" style="display:flex;flex-direction:column;gap:8px"><div class="ml" style="border:0;padding:0">🔥 Серия побед клуба<b>${st}</b></div><div class="pips">${Array.from({length:CW_STREAK},(_,k)=>`<i class="${k<st?'on':''}"></i>`).join('')}</div><div class="rws">${st>=CW_STREAK?'Золотая рамка и +5% монет за гол активны!':'Выиграйте '+(CW_STREAK-st)+' нед. подряд: золотая рамка в топе и +5% монет за гол всем игрокам клуба'}</div></div>`;
 const lw=cwResult(w-1,P.club,cwAgg(w-1));
 if(lw&&(lw.me||lw.op))o+=`<div class="btlw">Прошлая неделя: ${esc(CLUBS[P.club].n)} ${cwF(lw.me)}\u00a0:\u00a0${cwF(lw.op)} ${esc(nm(lw.opp))} — ${lw.res>0?'🏆 победа':lw.res<0?'поражение':'ничья'}</div>`;
 const seen={},rows=[];
 Object.keys(pr).forEach(k=>{k=+k;const q=pr[k];if(seen[k])return;seen[k]=1;if(q>0)seen[q]=1;rows.push([k,q])});
 o+=`<div class="fxsec"><h2>Все матчи недели</h2><span class="fxcnt">${rows.length}</span></div>`+rows.map(([a,b])=>{
  const mr=a===P.club||b===P.club;
  return `<div class="btr${mr?' me':''}">${fxCrest(a,30)}<span class="fxn" style="text-align:left">${s[a]>=CW_STREAK?'🔥':''}${esc(CLUBS[a].n)}</span><span class="sb" style="--c:#ffd54a;font-size:15px;padding:5px 8px">${cwF(gt(a))}\u00a0:\u00a0${cwF(gt(b))}</span><span class="fxn" style="text-align:right">${esc(nm(b))}${b>0&&s[b]>=CW_STREAK?'🔥':''}</span>${fxCrest(b,30)}</div>`}).join('');
 o+=`<details class="rwd btrw"><summary>🎁 Награды</summary><p>🏅 Победил клуб и ты забил ≥${CW_WIN_GOALS} гол. — ${CW_WIN_COINS} 🪙 и значок «Чемпион недели»<br>🎁 Лучший бомбардир победившего клуба и каждый 3-й титул чемпиона — эксклюзив: танцы, мячи, стадион, бутсы<br>⚽ Остальным, кто забил за клуб, — ${CW_PART_COINS} 🪙 за участие<br>Неделя: пн 00:00 — вс 24:00 (МСК), голы — пенальти и штрафные</p></details>`;
 return o}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

/* ===== Фильтр ников (мат, оскорбления, обходы) ===== */
const NICK_MAX=12,NICK_MIN=2;
const NK_CYR={a:'а',b:'в',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у','0':'о','3':'з','@':'а','$':'с','і':'и','ї':'и','є':'е','ґ':'г'};
const NK_LAT={'а':'a','в':'b','с':'c','е':'e','н':'h','к':'k','м':'m','о':'o','р':'p','т':'t','х':'x','у':'y','0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s','!':'i','і':'i'};
/* нижний регистр, ё→е, й→и, без акцентов и невидимых символов */
function nkBase(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/й/g,'и').normalize('NFKD').replace(/[\u0300-\u036f\u00ad\u200b-\u200f\u2060\ufeff]/g,'')}
/* русский вариант: латинские двойники → кириллица, всё лишнее выкидываем («х у й», «x_у_й», «хуу1й») */
function nkRu(s){return nkBase(s).replace(/[a-z03@$іїєґ]/g,c=>NK_CYR[c]||c).replace(/[^а-я]/g,'')}
/* латинский вариант: кириллические двойники и leet → латиница */
function nkLat(s){return nkBase(s).replace(/[а-яіё0-9@$!]/g,c=>NK_LAT[c]||c).replace(/[^a-z]/g,'')}
/* «хуй» → х+у+и+ (растяжки «хууууй»); двойные буквы в корне обязательны: «ссать» → с{2,}а+т+ь+ */
function nkRx(w){return w.replace(/(.)\1*/g,(m,c)=>c+(m.length>1?'{'+m.length+',}':'+'))}
const nkSub=l=>new RegExp(l.map(w=>nkRx(nkBase(w))).join('|'));
const nkExa=l=>new RegExp('^(?:'+l.map(w=>nkRx(nkBase(w))).join('|')+')$');
/* корни, которые ловим внутри ника */
const NK_RU_SUB=nkSub(['хуй','хуе','хуя','хую','хуи','пизд','ебан','ебат','ебал','ебну','ебуч','ебло','ебыр','ебаш','еблан','заеб','наеб','поеб','выеб','уеб','доеб','проеб','объеб','разъеб','отъеб','долбоеб','долбаеб','далбаеб','блят','бляд','блеат','мудак','мудил','мудозвон','залуп','пидор','пидар','пидр','педик','педераст','гандон','гондон','шлюх','шлюш','дроч','ублюд','говн','гавн','жопа','жопу','жопы','срать','ссать','сцать','засранец','хуесос','членосос','отсос','минет','трахат','трахн','проститутк','порно','секс','сиськ','оргазм','дебил','идиот','кретин','тварь','мразь','ничтожеств','паскуд','подонок','выродок','говноед','гитлер','нацист','нацизм','фашист','свастик','зигхайл','хайльгитлер','ниггер','нигга','сдохн','суицид','чмошник','лошара']);
const NK_LA_SUB=nkSub(['fuck','fck','phuck','fvck','shit','bitch','biatch','bytch','nigger','nigga','faggot','asshole','whore','retard','bastard','dickhead','hitler','neonazi','cumshot','blowjob','handjob','masturbat','porn','pedofil','pedophil','paedo','xuy','xui','xuj','huesos','nahuy','nahui','pohuy','pohui','pizd','pidor','pidar','pidr','blyat','blyad','mudak','mudil','gandon','gondon','zalup','dolboeb','zaeb','naeb','poeb','vyeb','ebanat','ebanut','eblan','ebuch','shlyux','shlyuh']);
/* слова, которые ловим только целиком (чтобы не резать «Команда», «Сукачёв», «Херсон»…) */
const NK_RU_EX=nkExa(['сука','суки','суке','сучка','сучара','бля','хер','хрен','хрень','херня','манда','манду','манды','лох','лохи','чмо','даун','дауны','дауни','хач','хачи','чурка','чурки','чурок','жид','жиды','негр','негры','член','члены','анал','пенис','вагина','вагину','шалава','гнида','гниды','скотина','урод','уроды','уродина','козел','козлина','цыган','еблан','хуила']);
const NK_LA_EX=nkExa(['cunt','dick','cock','pussy','slut','ass','anus','tits','boobs','dildo','penis','vagina','sex','xxx','nazi','rape','rapist','porno','cum','kike','spic','chink','fag','hoe','pedo','kkk','suka','cyka','blya','xyu']);
/* true = ник содержит мат/оскорбление/обход */
function nickBad(s){
 s=String(s||'');
 const ru=nkRu(s);
 if(NK_RU_SUB.test(ru))return true;
 const hasLat=/[a-z@$!]/i.test(s),la=hasLat?nkLat(s):'';
 if(hasLat&&NK_LA_SUB.test(la))return true;
 const toks=s.split(/[\s_\-]+/).filter(Boolean);toks.push(s);
 for(const t of toks){if(NK_RU_EX.test(nkRu(t)))return true;if(hasLat&&NK_LA_EX.test(nkLat(t)))return true}
 return false;
}
/* '' = ник подходит, иначе текст ошибки */
function nickError(s){
 const n=String(s||'').trim().replace(/\s+/g,' ');
 if(n.length<NICK_MIN)return 'Слишком короткий ник — минимум '+NICK_MIN+' символа';
 if(n.length>NICK_MAX)return 'Максимум '+NICK_MAX+' символов';
 if(!/^[\p{L}\p{N} _-]+$/u.test(n))return 'Только буквы, цифры, пробел, «_» и «-» — без смайликов и символов';
 if(!/\p{L}/u.test(n))return 'В нике должна быть хотя бы одна буква';
 if(nickBad(n))return 'Такой ник нельзя — без мата и оскорблений 🙅';
 return '';
}
function nickClean(s){return String(s||'').replace(/[^\p{L}\p{N} _-]/gu,'').replace(/\s+/g,' ').trim().slice(0,NICK_MAX)}

function dqMake(i){const T=QT[i],n=dqRnd(T.lo,T.hi);return{i,n,p:0,c:0,v:dqRnd(0,9),r:dqR5(T.per*n*(0.9+Math.random()*0.3))}}
function dqGen(){
 const all=QT.map((_,i)=>i).sort(()=>Math.random()-.5),ids=[],cnt={};
 for(const i of all){if(ids.length>=DQ_N)break;const g=QT[i].g||('o'+QT[i].ic);if(cnt[g])continue;cnt[g]=1;ids.push(i)}
 for(const i of all){if(ids.length>=DQ_N)break;if(!ids.includes(i))ids.push(i)}
 return{day:dayKey(),q:ids.map(dqMake),rr:0,b:0}}
function dqInit(){
 if(!P.dq||P.dq.day!==dayKey()||!Array.isArray(P.dq.q)||P.dq.q.some(q=>!QT[q.i])){P.dq=dqGen();save()}
 return P.dq;
}
function dqTrack(e){try{
 dqInit();let ch=0;
 P.dq.q.forEach(q=>{
  if(q.p>=q.n)return;
  const T=QT[q.i],a=T.f(e)||0;if(!a)return;
  q.p=T.mx?Math.max(q.p,Math.min(q.n,a)):Math.min(q.n,q.p+a);ch=1;
  if(q.p>=q.n){toast('✅ Задание выполнено: <b>'+dqText(q)+'</b>');haptic('success')}
 });
 if(ch)save();
}catch(x){}}
function dqText(q){const a=QT[q.i].t(q.n);return a[q.v%a.length]}

/* --- ежедневная награда за вход --- */
function drState(){
 const t=dayKey(),d=P.dr,claimed=d.last===t,cont=d.last===yKey();
 const prev=(claimed||cont)?d.streak:0;
 const streak=claimed?d.streak:prev,idx=claimed?(d.streak-1)%7:prev%7;
 const week=Math.floor((claimed?d.streak-1:prev)/7)+1;   // номер текущей недели (цикл из 7 дней повторяется бесконечно)
 return{claimed,idx,prev,streak,week,mult:drMult(week)};
}
const drMult=w=>1+0.1*Math.min(Math.max(w,1)-1,5); // +10% за каждую пройденную неделю, максимум x1.5
function drClaim(){
 const s=drState();if(s.claimed)return;
 let amt=dqR5(DR_BASE[s.idx]*s.mult*(0.8+Math.random()*0.7)),lucky=Math.random()<0.12;
 if(lucky)amt*=2;
 P.dr.streak=s.prev+1;P.dr.last=dayKey();setTimeout(checkAch,500);const ms=drMs(P.dr.streak);P.coins+=amt+ms;save();
 toast((lucky?'🍀 Удача! Награда x2: ':'🎁 Награда дня: ')+'<b>+'+amt+' 🪙</b>');
 if(ms)setTimeout(()=>toast('🏅 Бонус за '+P.dr.streak+' '+dqPl(P.dr.streak,'день','дня','дней')+' подряд: <b>+'+ms+' 🪙</b>'),600);
 haptic('success');dqChime();
 dailyScr(1);
}

function dqReroll(i){

 const used=d.q.map(x=>x.i),free=QT.map((_,k)=>k).filter(k=>!used.includes(k));

const BALL_START={x:180,y:335};
const GREEN_W=()=>0.06+BOOTS[P.look.boots].acc*0.012;

function play(){

function updHud(){const r=$('r'),g=$('g'),c=$('c');if(r)r.textContent=G.round;if(g)g.textContent=G.goals;if(c)c.textContent=G.earned}

}

/* --- Фаза 1: точный прицел (без сетки — тап прямо в ворота) --- */
function aimUI(){
 G.phase='aim';
 const CH=(G&&G.fk)?FK_H:520;
 $('ovl').innerHTML=`<div class="goaltarget" style="left:${70/360*100}%;top:${110/CH*100}%;width:${220/360*100}%;height:${110/CH*100}%"
   onclick="aim(event)"></div>`;
}

/* --- Фаза 2: точность удара --- */
function aim(e){
 const rect=e.currentTarget.getBoundingClientRect();
 const p=(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0]:e;
 const cx=(p.clientX!==undefined)?p.clientX:rect.left+rect.width/2;
 const cy=(p.clientY!==undefined)?p.clientY:rect.top+rect.height/2;
 const fx=Math.min(0.99,Math.max(0.01,(cx-rect.left)/rect.width));
 const fy=Math.min(0.98,Math.max(0.02,(cy-rect.top)/rect.height));
 G.aim={px:fx*220,py:fy*110};
 G.phase='power';
 if(G.fk)fkAimed();
 const gw=GREEN_W(),yw=0.155;
 $('ovl').innerHTML=`<div class="powerwrap"${G.fk?` style="top:${236/FK_H*100}%;bottom:auto"`:''}><div class="powerbar">
   <div class="zone z-y" style="left:${(50-yw*100)}%;width:${yw*2*100}%"></div>
   <div class="zone z-g" style="left:${(50-gw*100)}%;width:${gw*2*100}%"></div>
   <div class="needle" id="nd" style="left:-2px"></div></div>
   <button class="btn kickbtn" onclick="kick()">⚽ Бить!</button></div>`;
 const t0=performance.now(),speed=1.5;
 cancelAnimationFrame(raf);
 const loop=(t)=>{
   if(G.phase!=='power')return;
   const dt=(t-t0)/1000;
   G.pv=0.5+0.5*Math.sin(dt*speed*Math.PI*2-Math.PI/2);
   const nd=$('nd');
   if(nd)nd.style.left=`calc(${(G.pv*100).toFixed(2)}% - 2px)`;
   raf=requestAnimationFrame(loop);
 };
 raf=requestAnimationFrame(loop);
}

/* --- Удар --- */
function kick(){
 if(G&&G.fk){fkKick();return}
 cancelAnimationFrame(raf);
 const d=Math.abs(G.pv-0.5);
 G.quality=d<GREEN_W()?'perfect':(d<0.155?'good':'bad');
 AS.whistleSnd();
 resolve();
 G.phase='anim';
 $('ovl').innerHTML='';
 animate();
}

function segDist(px,py,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1;
 const u=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
 return Math.hypot(px-(x1+u*dx),py-(y1+u*dy));
}
function hitPost(cx,cy){
 const frame=[
  segDist(cx,cy,70,110,70,220),
  segDist(cx,cy,290,110,290,220),
  segDist(cx,cy,70,110,290,110)
 ];
 return Math.min(...frame)<7.5;
}

function mkTgt(tx,ty,rw){const dx=tx-180,ad=Math.abs(dx),sd=ad<26?0:Math.sign(dx);
 return{x:tx,y:Math.max(128,ty),sd,th:sd*(0.75+0.6*Math.min(1,(ad-26)/70)),rw}}
function resolve(){
 const q=G.quality;
 const ax=G.aim.px, ay=G.aim.py;
 let ex=0,ey=0;
 if(q==='good'){const an=Math.random()*6.283,r=8+Math.random()*10;ex=Math.cos(an)*r;ey=Math.sin(an)*r*0.6}
 else if(q==='bad'){const an=Math.random()*6.283,r=26+Math.random()*30;ex=Math.cos(an)*r;ey=Math.sin(an)*r*0.7}
 const fx=70+ax+ex, fy=110+ay+ey;
 G.fx=fx;G.fy=fy;
 G.miss=(fx<64||fx>296||fy<102||fy>226);
 if(!G.miss&&hitPost(fx,fy)){G.result='post';G.contact={cx:fx,cy:fy};G.coins=0;G.react=0.3;G.kTgt=mkTgt(fx*0.6+72,Math.min(215,Math.max(120,fy))*0.6+67,0.8);return}
 const fcc=Math.min(2,Math.max(0,Math.floor((fx-70)/(220/3))));
 const corner=Math.abs(fx-180)>74||fy<142;
 G.corner=corner;
 const speedF=q==='perfect'?1:(q==='good'?0.72:0.5);
 G.speedF=speedF;G.saveAt=0.55;
 // --- вратарь выбирает сторону ДО удара (как в жизни) и «изучает» тебя: повторяешь угол — он это запоминает ---
 G.sh=G.sh||[];
 const w=[.45,.1,.45],h=G.sh.slice(-2);
 if(h.length===2&&h[0]===h[1])w[h[0]]+=.3;
 const gi=(()=>{let r=Math.random()*(w[0]+w[1]+w[2]);return r<w[0]?0:(r<w[0]+w[1]?1:2)})();
 G.sh.push(fcc);
 const tf=q==='perfect'?.38:(q==='good'?.5:.68);          // время полёта мяча, с (≈ 110 / 85 / 60 км/ч)
 const kb=BOOTS[P.look.boots].acc*.06;                      // бутсы чуть ускоряют вратаря-соперника → ему мешают
 const s=kpSolve(fx,fy,{tf:tf,rt:.06,g:gi-1,k0:0,pw:q==='perfect'?1.12:(q==='good'?1:.85),kp:1-kb,fl:SV.pen[q]});
 G.result=G.miss?'miss':(s.saved?'save':'goal');
 G.kc=gi;
 G.react=s.saved?.2:(s.dir?.1:.3);                          // вратарь стартует на удар мяча
 if(s.saved){
   G.contact={cx:Math.max(80,Math.min(280,fx)),cy:Math.max(118,Math.min(212,fy))};
   const dir=Math.abs(G.contact.cx-180)>30?Math.sign(G.contact.cx-180):(Math.random()<0.5?-1:1);
   G.defl={cx:G.contact.cx+dir*(70+Math.random()*40),cy:G.contact.cy+95+Math.random()*50};
   G.kTgt=mkTgt(G.contact.cx,G.contact.cy-26,1);
 }else{
   G.kTgt=mkTgt(Math.max(85,Math.min(275,s.kx)),s.dir?168:176,s.dxm<1.6?.9:.3);
 }
 // «Паненка»: вратарь бросился в угол, а мяч спокойно полетел по центру
 G.panenka=G.result==='goal'&&s.dir!==0&&Math.abs(fx-180)<20&&q!=='bad';
 G.coins=G.result==='goal'?Math.round((10+(corner?5:0)+(q==='perfect'?5:0)+(G.panenka?5:0))*(1+clubBonus())):0;
}

/* ===== Реалистичная модель вратаря (пенальти + штрафные) =====
   Масштаб ворот: 30 px = 1 м по ширине (7.32 м), 45 px = 1 м по высоте (2.44 м).
   Вратарь выбирает сторону, успевает преодолеть только ограниченное расстояние за время полёта мяча,
   а чем дальше в бок он летит, тем ниже достаёт руками. Верхние «девятки» не берутся. */
const KP={arm:1.55,dive:3.5,vel:6.6,hcap:2.4,hdrop:.2};
/* Базовый шанс сейва по качеству удара (чтобы в серии из 5 ударов в среднем 2–3 были отбиты, но не всегда).
   Хочешь легче — уменьши числа, сложнее — увеличь. Верхние углы берутся вдвое реже. */
const SV={pen:{perfect:.28,good:.34,bad:.40},fk:{perfect:.25,good:.30,bad:.35}};
function kpSolve(fx,fy,o){
 const dir=o.g,t=Math.max(0,o.tf-o.rt);
 const D=dir?Math.min(KP.dive,KP.vel*t):Math.min(.7,1.4*t);          // сколько метров вратарь успел пролететь
 const kx=180+(o.k0||0)+dir*D*30;
 const dxm=Math.abs(fx-kx)/30,hg=Math.max(0,(220-fy)/45),hcap=KP.hcap-KP.hdrop*D;
 let p=0;
 if(dxm<=KP.arm&&hg<=hcap)p=(.99-.28*dxm/KP.arm)*(o.kp||1)/(o.pw||1);       // достал руками
 else if(dxm<2.2&&hg<.8)p=.26*(o.kp||1);                               // дотянулся ногой
 else if(dxm<KP.arm*1.6)p=.14*(o.kp||1);                                    // кончиками пальцев (редко, но бывает)                                   // дотянулся ногой
 if(o.fl){const top=Math.max(0,Math.min(1,(hg-1.7)/.7));p=Math.max(p,o.fl*(1-.5*top))}   // базовый шанс (хуже для верхних углов)
 p=Math.max(0,Math.min(.96,p));
 return{saved:Math.random()<p,p,kx,D,dir,dxm,hg};
}

/* --- Анимация --- */
function animate(){
 stopIdle();
 const ctx=$('cv').getContext('2d');
 const t0=performance.now();
 const DUR=1300*(1.3-0.3*(G.speedF||1)); // плохой тайминг = медленный мяч
 const trail=[],fired={},once=(n,f)=>{if(!fired[n]){fired[n]=1;f()}};
 const step=(tm)=>{
   if(!G||!$('cv'))return;
   const t=tm/1000;
   const k=Math.min(1,(tm-t0)/DUR);
   const runK=Math.min(1,k/0.24);
   const kickK=Math.max(0,Math.min(1,(k-0.24)/0.26));
   const ky=472-112*runK-6*kickK;
   let bx=BALL_START.x,by=BALL_START.y,ballK=0,tgt=null,e=0;
   if(k>0.37){
     ballK=Math.min(1,(k-0.37)/0.63);
     if(G.result==='post'){
       if(ballK<=0.65){e=1-Math.pow(1-ballK/0.65,3);tgt=G.contact}
       else{
         const u=(ballK-0.65)/0.35;
         const rx=G.contact.cx+(G.contact.cx-180)*0.6,ry=G.contact.cy+160;
         bx=G.contact.cx+(rx-G.contact.cx)*u;
         by=G.contact.cy+(ry-G.contact.cy)*u-Math.sin(u*Math.PI)*26;
       }
     }else if(G.result==='save'){
       // мяч долетает до перчатки и резко отбивается в сторону
       if(ballK<=G.saveAt){e=1-Math.pow(1-ballK/G.saveAt,3);tgt=G.contact}
       else{
         const u=(ballK-G.saveAt)/(1-G.saveAt);
         bx=G.contact.cx+(G.defl.cx-G.contact.cx)*u;
         by=G.contact.cy+(G.defl.cy-G.contact.cy)*u-Math.sin(u*Math.PI)*14;
       }
     }else if(G.result==='goal'){
       e=1-Math.pow(1-ballK,2.4);tgt={cx:G.fx,cy:G.fy+10};
     }else{
       e=1-Math.pow(1-ballK,3);tgt={cx:G.fx,cy:G.fy};
     }
     if(tgt){
       bx=BALL_START.x+(tgt.cx-BALL_START.x)*e;
       by=BALL_START.y+(tgt.cy-BALL_START.y)*e-Math.sin(ballK*Math.PI)*(G.result==='goal'?18:30);
     }
   }
   if(ballK>0)once('k',()=>AS.kickSnd());
   if(G.result==='save'&&ballK>=G.saveAt){once('h',()=>AS.saveSnd());if(ballK>=G.saveAt+(1-G.saveAt)*0.55)once('b',()=>AS.bounceSnd())}
   else if(G.result==='post'&&ballK>=0.65){once('h',()=>AS.postSnd());if(ballK>=0.85)once('b',()=>AS.bounceSnd())}
   else if(G.result==='goal'&&ballK>=0.8)once('h',()=>AS.netSnd());
   else if(G.result==='miss'&&ballK>=0.92)once('h',()=>AS.missSnd());
   let keepK=0,land=0;
   if(G.react!==undefined){
     const end=(G.result==='save')?G.saveAt:0.8;
     keepK=Math.max(0,Math.min(1,(ballK-G.react)/(end-G.react)));
     land=Math.max(0,Math.min(1,(ballK-end)/Math.min(0.35,1-end)));
   }
   if(k>0.37){trail.push([bx,by]);if(trail.length>7)trail.shift()}
   const impact=k>0.37?Math.max(0,1-(k-0.37)/0.08):0;
   const netT=(G.result==='goal'&&ballK>0.8)?(ballK-0.8)*0.63*DUR/1000:0;
   const fr={t,keepK,land,ballK,bx,by,kickK,ky,runK,impact,netT,trail:trail.slice(0,-1)};
   G.last=fr;draw(ctx,fr);
   if(k<1)requestAnimationFrame(step);
   else{G.phase='result';finish()}
 };
 requestAnimationFrame(step);
}

/* --- Итог удара --- */
function finish(){
 P.pens++;
 if(G.result==='goal'){
   P.goals++;cgAdd();G.goals++;G.streak++;if(G.corner)P.corners++;G.earned+=G.coins;P.coins+=G.coins;
   P.best=Math.max(P.best,G.streak);haptic('success');AS.goalSnd();
   G.celT=performance.now();setTimeout(startCel,0);
 }else{
   G.streak=0;haptic('error');
   if(G.result==='save')AS.oohSnd();
   else if(G.result==='post'){P.posts++;AS.oohSnd()}
 }
 dqTrack({k:'k',m:'pen',goal:G.result==='goal',r:G.result,corner:!!G.corner,q:G.quality,st:G.streak,coins:G.coins||0});
 save();updHud();checkAch();if(G.result==='goal')submitTopSoon();if(G.duel&&G.duel.type==='live')liveReport();
 const msgs={goal:`${G.panenka?'ПАНЕНКА! 😎 ':'ГОЛ! ⚽ '}+${G.coins} 🪙`,save:'СЕЙВ! 🧤',miss:G.fy<102?'НАД ПЕРЕКЛАДИНОЙ! ❌':'МИМО! ❌',post:'ШТАНГА! 😱'};
 const col={goal:'var(--good)',save:'var(--accent)',miss:'var(--bad)',post:'var(--gold)'};
 $('ovl').innerHTML=`<div class="result"><div class="rtext" style="color:${col[G.result]}">${msgs[G.result]}</div>
  <button class="btn" style="width:auto;padding:12px 28px" onclick="${G.duel&&G.duel.type==='live'?'liveNext()':'next()'}">Дальше →</button></div>`;
}
function next(){
 if(G.round>=5){endGame();return}
 G.round++;G.phase='aim';
 updHud();aimUI();draw();startIdle();
}
function endGame(){
 stopIdle();
 let bonus=0;
 if(G.goals===5){bonus=25;P.coins+=bonus;P.perfect++}
 dqTrack({k:'s',m:'pen',goals:G.goals});
 save();checkAch();
 app(`<h1>🏁 Серия окончена</h1>
 <div class="card" style="text-align:center">
  <div class="prevwrap"><canvas id="pv" width="260" height="300"></canvas></div>
  <div class="name">Голов: ${G.goals} / 5</div>
  <div class="coins" style="font-size:20px">+${G.earned+bonus} 🪙</div>
  ${bonus?'<div class="small">Бонус за идеальную серию: +25 🪙</div>':''}
 </div>
 ${G.duel?'<div class="card" id="duelbox"><div class="small" style="text-align:center">Отправляем результат дуэли…</div></div>':''}
 <button class="btn" onclick="startGame()">🔁 Играть снова</button>
 <button class="btn btn2" onclick="home()">🏠 В меню</button>`);

/* затемнение / осветление hex-цвета: amt от -1 до 1 */
function shade(hex,amt){
  let r,g,b;const m=/^rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(String(hex));
  if(m){r=+m[1];g=+m[2];b=+m[3]}
  else{const n=parseInt(String(hex).replace('#',''),16);r=(n>>16)&255;g=(n>>8)&255;b=n&255}
  if(amt>=0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  else{r*=1+amt;g*=1+amt;b*=1+amt}
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
function lum(hex){
  const n=parseInt(String(hex).replace('#',''),16);
  return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;
}
function rrect(ctx,x,y,w,h,r){
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);return}
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* --- Сетка ворот: волны и выгиб от удара мяча --- */
function netDisp(x,y,tau,cx,cy){
 const dx=x-cx,dy=y-cy,r=Math.hypot(dx,dy)||1,ux=dx/r,uy=dy/r;
 const env=Math.exp(-2.3*tau);
 const A=env*Math.sin(15*tau);                                  // выгиб и отдача
 const bulge=A*0.55*r*Math.exp(-(r/62)*(r/62));
 const front=Math.max(0,Math.min(1,(230*tau-r)/25));            // волна бежит от места удара
 const wave=3.4*env*front*Math.exp(-r/120)*Math.sin(0.2*r-17*tau);
 const sway=1.8*env*Math.sin(9*tau)*((y-110)/110);
 return[ux*(bulge+wave)+sway,uy*(bulge+wave)+0.6*wave];
}
function netBall(a){
 const tau=a.netT,env=Math.exp(-2.3*tau),A=env*Math.sin(15*tau),gy=206;
 const t2=Math.max(0,tau-0.22),prog=1-Math.exp(-2.6*t2);          // мяч после отдачи сползает вниз
 const fall=Math.max(0,gy-a.by)*prog;
 const bounce=prog>0.85?Math.abs(Math.sin(9*t2))*Math.exp(-3*t2)*6:0;
 return Object.assign({},a,{by:a.by+fall-bounce,sc:1-0.22*Math.max(0,A),noShadow:true,gs:prog});
}

   else{ctx.fillStyle='rgba('+B.trail+','+((B.glow?0.3:0.16)*f)+')';ctx.beginPath();ctx.arc(p[0],p[1],(10-4*ballK)*0.8*f+2,0,7);ctx.fill()}
   if(B.spark&&i%2===0){ctx.strokeStyle='rgba(255,255,255,'+(0.8*f)+')';ctx.lineWidth=1;const q=3.5*f+1;

/* --- Конфетти --- */
function confetti(ctx,t,cel){
 const cols=['#e74c3c','#f1c40f','#3ec6ff','#2ecc71','#ffffff','#ff7eb9'];
 for(let i=0;i<44;i++){
   const sx=(i*53)%360,sy=(i*31)%140;
   const y=(sy+t*72*(1+(i%3)*0.4))%220;
   const x=sx+Math.sin(t*3+i)*10;
   ctx.save();ctx.translate(x,y);ctx.rotate(t*4+i);
   ctx.globalAlpha=cel;
   ctx.fillStyle=cols[i%6];
   ctx.fillRect(-2,-1,4,2);
   ctx.restore();
 }
 ctx.globalAlpha=1;
}

/* Сужающаяся объёмная «капсула» для конечностей — вместо палочек */
function limbShape(ctx,p1,p2,w1,w2,color,edge){
 const dx=p2.x-p1.x,dy=p2.y-p1.y;
 const len=Math.hypot(dx,dy);
 if(len<0.01)return;
 const nx=-dy/len,ny=dx/len;
 const wm=(w1+w2)/2*0.62;
 const g=ctx.createLinearGradient(p1.x+nx*w1/2,p1.y+ny*w1/2,p1.x-nx*w1/2,p1.y-ny*w1/2);
 g.addColorStop(0,edge||shade(color,-0.24));
 g.addColorStop(0.42,shade(color,0.10));
 g.addColorStop(1,edge||shade(color,-0.24));
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.moveTo(p1.x+nx*w1/2,p1.y+ny*w1/2);
 ctx.quadraticCurveTo((p1.x+p2.x)/2+nx*wm,(p1.y+p2.y)/2+ny*wm, p2.x+nx*w2/2,p2.y+ny*w2/2);
 ctx.quadraticCurveTo(p2.x,p2.y, p2.x-nx*w2/2,p2.y-ny*w2/2);
 ctx.quadraticCurveTo((p1.x+p2.x)/2-nx*wm,(p1.y+p2.y)/2-ny*wm, p1.x-nx*w1/2,p1.y-ny*w1/2);
 ctx.quadraticCurveTo(p1.x,p1.y, p1.x+nx*w1/2,p1.y+ny*w1/2);
 ctx.fill();ctx.strokeStyle='rgba(6,10,16,.75)';ctx.lineWidth=0.9;ctx.lineJoin='round';ctx.stroke();
}

 ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.10)';
 ctx.beginPath();ctx.arc(p.x-r*0.3,p.y-r*0.35,r*0.55,0,7);ctx.fill();
}

function drawLeg(ctx,hip,ang,bend,s,skin,sockC,sockC2,bootC,lat,pts){
 lat=lat||0;
 let l1=24*s,l2=22*s;
 let knee={x:hip.x+Math.sin(ang)*l1+lat*0.35, y:hip.y+Math.cos(ang)*l1};
 let a2=ang-bend;
 let foot={x:knee.x+Math.sin(a2)*l2+lat*0.6, y:knee.y+Math.cos(a2)*l2};
 if(pts){knee=pts.k;foot=pts.f;a2=Math.atan2(foot.x-knee.x,foot.y-knee.y);l2=Math.hypot(foot.x-knee.x,foot.y-knee.y)}
 // бедро (мощное, сужается к колену)
 limbShape(ctx,hip,knee,10.5*s,7.6*s,skin);
 // гетра от колена к лодыжке
 const ankle={x:knee.x+Math.sin(a2)*l2*0.88,y:knee.y+Math.cos(a2)*l2*0.88};
 limbShape(ctx,knee,ankle,7*s,5.4*s,sockC,shade(sockC2||sockC,-0.25));
 // оборка гетры
 limbShape(ctx,{x:knee.x+Math.sin(a2)*l2*0.05,y:knee.y+Math.cos(a2)*l2*0.05},{x:knee.x+Math.sin(a2)*l2*0.17,y:knee.y+Math.cos(a2)*l2*0.17},7.6*s,7.1*s,sockC2||shade(sockC,-0.2));
 kneeJoint(ctx,knee,3.6*s,skin);
 // объёмная бутса
 ctx.save();
 ctx.translate(foot.x,foot.y);
 ctx.rotate(a2*0.92+0.12);
 ctx.fillStyle='#0a0c0e';
 rrect(ctx,-2.4*s,-2.7*s,11*s,5.6*s,2.2*s);ctx.fill();
 const bg=ctx.createLinearGradient(0,-4*s,0,2.6*s);
 bg.addColorStop(0,shade(bootC,0.55));bg.addColorStop(0.45,bootC);bg.addColorStop(1,shade(bootC,-0.32));
 ctx.fillStyle=bg;
 ctx.beginPath();
 ctx.moveTo(-2.2*s,-0.6*s);
 ctx.quadraticCurveTo(-2.6*s,-4.6*s,1.2*s,-4.4*s);
 ctx.quadraticCurveTo(3.6*s,-3.6*s,6.2*s,-2.2*s);
 ctx.quadraticCurveTo(9*s,-0.8*s,8.6*s,0.6*s);
 ctx.quadraticCurveTo(6*s,2.2*s,1*s,2.2*s);
 ctx.quadraticCurveTo(-1.8*s,1.8*s,-2.2*s,-0.6*s);
 ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=0.55*s;
 for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0.6*s+i*1.15*s,-2.4*s+i*0.28*s);ctx.lineTo(1.7*s+i*1.15*s,-1.1*s+i*0.28*s);ctx.stroke()}
 ctx.fillStyle='rgba(255,255,255,.32)';
 ctx.beginPath();ctx.ellipse(5.6*s,-1.3*s,1.9*s,0.75*s,-0.25,0,7);ctx.fill();
 ctx.fillStyle='#07080a';
 for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-1*s+i*2.5*s,2.9*s,0.55*s,0,7);ctx.fill()}
 ctx.restore();
}
function jerseyPath(ctx,hip,sho,hw,tw,s){
 ctx.beginPath();
 ctx.moveTo(hip.x-hw,hip.y-2*s);
 ctx.quadraticCurveTo(hip.x-hw-1*s,(hip.y+sho.y)/2, sho.x-tw,sho.y+3*s);
 ctx.quadraticCurveTo(sho.x-tw-1*s,sho.y-3*s, sho.x-tw*0.55,sho.y-5*s);
 ctx.quadraticCurveTo(sho.x,sho.y-7*s, sho.x+tw*0.55,sho.y-5*s);
 ctx.quadraticCurveTo(sho.x+tw+1*s,sho.y-3*s, sho.x+tw,sho.y+3*s);
 ctx.quadraticCurveTo(hip.x+hw+1*s,(hip.y+sho.y)/2, hip.x+hw,hip.y-2*s);
 ctx.closePath();
}

function sleeveFront(ctx,p1,p2,w1,w2,color){ // рукав: круглое плечо, ровный край у локтя
 const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy);if(len<0.01)return;
 const nx=-dy/len,ny=dx/len,an=Math.atan2(dy,dx);
 const g=ctx.createLinearGradient(p1.x+nx*w1/2,p1.y+ny*w1/2,p1.x-nx*w1/2,p1.y-ny*w1/2);
 g.addColorStop(0,shade(color,-0.24));g.addColorStop(0.42,shade(color,0.10));g.addColorStop(1,shade(color,-0.24));
 ctx.beginPath();ctx.moveTo(p2.x+nx*w2/2,p2.y+ny*w2/2);ctx.lineTo(p1.x+nx*w1/2,p1.y+ny*w1/2);
 ctx.arc(p1.x,p1.y,w1/2,an+Math.PI/2,an+Math.PI*1.5);
 ctx.lineTo(p2.x-nx*w2/2,p2.y-ny*w2/2);ctx.closePath();
 ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(6,10,16,.75)';ctx.lineWidth=0.9;ctx.lineJoin='round';ctx.stroke();
}
function handFront(ctx,s,skin,side){ // ctx в системе кисти: +y вдоль предплечья

  ctx.strokeStyle=skin;ctx.lineWidth=w*s;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
 xs.forEach((x,i)=>{const L=fl[side<0?i:3-i];fin(x*s,3.4*s,x*s*1.06,(3.4+L)*s,1.45)});
 fin(-side*2.6*s,1.2*s,-side*3.9*s,4.2*s,1.5); // большой палец — к телу
 ctx.fillStyle=skin;rrect(ctx,-3*s,-0.8*s,6*s,5.2*s,2.2*s);ctx.fill();ctx.strokeStyle=ln;ctx.lineWidth=.8;ctx.stroke();
 ctx.strokeStyle=dk;ctx.lineWidth=.6*s;ctx.lineCap='round';
 ctx.beginPath();[-1.4,0,1.4].forEach(x=>{ctx.moveTo(x*s,3.5*s);ctx.lineTo(x*s,4.3*s)});ctx.stroke(); // костяшки
}
function drawStrikerBody(ctx,x,fy,o){
 o=o||{};

 const lean=0.02-0.12*fwd+((dp&&dp.lean)||0);
 const sho={x:hip.x+Math.sin(lean)*26*s, y:hip.y-Math.cos(lean)*26*s*(1-0.1*fwd)+fwd*4*s};
 const sp=(o.front&&idle?1.15:1)*(1-0.3*wR), hs=4*sp*s;

 if(!o.noShadow)softShadow(ctx,x,fy+2*s,(15+fwd*5)*s,4.8*s,.4);

 const legPts=(sd,lf)=>{const hx=hip.x+sd*hs;return{h:{x:hx,y:hip.y},k:{x:hx+sd*(8*sp-lf*2)*s,y:hip.y+(22.6-lf*9)*s},f:{x:hx+sd*(14.3*sp-lf*4)*s,y:hip.y+(43.7-lf*20)*s}}};
 // ключевые кадры правой (бьющей) ноги: стойка → замах (стопа вверх назад) → удар по мячу → проводка вверх → шаг
 const KF=[[0,5.6,22.6,10,43.7],[0.28,6.5,22,12,13],[0.5,3,19,0.5,32],[0.7,2,12,-3,10],[1,5.6,22.6,10,43.7]];
 const kickLeg=()=>{

   const A=KF[i],B=KF[i+1],u=Math.max(0,Math.min(1,(ku-A[0])/(B[0]-A[0]))),e=u*u*(3-2*u);
   const L=(a,b)=>(a+(b-a)*e)*s,hx=hip.x+hs;
   return{h:{x:hx,y:hip.y},k:{x:hx+L(A[1],B[1]),y:hip.y+L(A[2],B[2])},f:{x:hx+L(A[3],B[3]),y:hip.y+L(A[4],B[4])}};
 };
 let PL=legPts(-1,lift(-1)), PR=kick>0?kickLeg():legPts(1,lift(1));
 if(dp){
   if(dp.lg){const mk=sd=>{const hx=hip.x+sd*hs,q=dp.lg(sd);return{h:{x:hx,y:hip.y},k:{x:hx+q.k[0]*s,y:hip.y+q.k[1]*s},f:{x:hx+q.f[0]*s,y:hip.y+q.f[1]*s}}};PL=mk(-1);PR=mk(1)}
 }
 drawLeg(ctx,PL.h,0,0,s,shade(skin,-0.10),shade(kit.shirt,-0.12),shade(kit.shirt2||kit.shirt,0.25),shade(boot.c,-0.12),0,{k:PL.k,f:PL.f});
 drawLeg(ctx,PR.h,0,0,s,skin,kit.shirt,kit.shirt2||kit.shirt,boot.c,0,{k:PR.k,f:PR.f});

 const sg=ctx.createLinearGradient(hip.x,hip.y-7*s,hip.x,hip.y+11*s);

 const hw=8.4*s, tw=12.5*s;

 sh.addColorStop(1,'rgba(0,0,0,.24)');
 ctx.fillStyle=sh;ctx.fillRect(sho.x-13*s,sho.y-10*s,26*s,36*s);

 ctx.strokeStyle=shade(kit.shirt,0.35);ctx.lineWidth=2*s;
 ctx.beginPath();

/* ===== ТАНЦЫ ПОСЛЕ ГОЛА v2: ИК-ноги, приседы, прыжки, повороты, кубок ===== */
const dzC=(x,a,b)=>Math.max(a===undefined?0:a,Math.min(b===undefined?1:b,x));
const dzS=x=>{x=dzC(x);return x*x*(3-2*x)};
const dzL=(a,b,x)=>a+(b-a)*x;
const dzFS=14.3,DZ_PI=Math.PI,DZ_TAU=Math.PI*2;
/* Нога через ИК: ступня на (fo вбок; lift над землёй) при опущенном тазе hd. Возвращает смещения колена/ступни от сустава бедра (уже со знаком стороны) */
function dzLeg(sd,fo,lift,hd){
 const HH=46+(hd||0),q=ik2(0,0,sd*fo,HH-2.3-(lift||0),24,22.5,-sd);
 return{k:[q.ex,q.ey],f:[q.hx,q.hy]};
}
const dzMix=(A,B,w)=>({k:[dzL(A.k[0],B.k[0],w),dzL(A.k[1],B.k[1],w)],f:[dzL(A.f[0],B.f[0],w),dzL(A.f[1],B.f[1],w)]});
/* «Радость»: 3 прыжка. air — высота (0..1), cr — глубина приседа */
function dzJ0(e){
 const f=e>=1?0:(e*3)%1;let air=0,cr=0;
 if(f>=0.2&&f<0.8)air=Math.sin(DZ_PI*(f-0.2)/0.6);
 if(f<0.2)cr=2+5*dzS(f/0.2);
 else if(f<0.28)cr=7*(1-dzS((f-0.2)/0.08));
 else if(f>=0.72&&f<0.8)cr=7*dzS((f-0.72)/0.08);
 else if(f>=0.8)cr=7-5*dzS((f-0.8)/0.2);
 return{f,air,cr};
}
/* «Кубок»: двойной прыжок */
function dzJ5(e){
 const jw=(a,b)=>{const w=(e-a)/(b-a);return w>0&&w<1?Math.sin(DZ_PI*w):0};
 const lo=(c,w)=>Math.max(0,1-Math.abs(e-c)/w);
 return{air:Math.max(jw(0.1,0.44),jw(0.5,0.84)),cr:6*Math.max(lo(0.07,0.06),lo(0.47,0.05),lo(0.88,0.06))};
}
const DZ_ROBO=[
 {l:[.15,.15],r:[.15,.15]},
 {l:[1.57,3.14],r:[1.57,3.14]},
 {l:[1.57,3.14],r:[1.57,0]},
 {l:[1.57,0],r:[1.57,3.14]},
 {l:[.8,-1.2],r:[.8,-1.2]},
 {l:[3,3.14],r:[3,3.14]},
 {l:[3,3],r:[1.57,1.57]},
 {l:[2.4,2.4],r:[2.4,2.4]}];
const DZ_ROBO_LEAN=[0,.07,-.07,.07,-.07,0,.07,0];

/* Поза танца: u 0..1 (2.6 сек). Возвращает: hd (опускание таза), hx (сдвиг таза), lean, lg(sd) (ноги), arm(sd) (руки), cup */
function dancePose(id,u,dir,t){
 const e=dzC(u),T=e*2.6,PI=DZ_PI,TAU=DZ_TAU;
 dir=dir||1;
 if(id===0){ // Радость: прыжки с поднятыми кулаками
  const J=dzJ0(e),hd=-J.cr;
  const A=Math.max(dzS((J.f-0.15)/0.2)*(1-dzS((J.f-0.78)/0.2)),dzS((e-0.9)/0.1));
  return{hd,lg:sd=>dzLeg(sd,10+J.cr*0.8-J.air*4,J.air*10,hd),
   arm:sd=>[sd*(1.1+1.5*A),sd*(1.9+1.0*A)]};
 }
 if(id===1){ // Зажигалка: покачивание с поднятыми руками, шаг-приставка
  const am=dzS(e/0.08)*(1-dzS((e-0.92)/0.08)),ph=e*3*TAU,sw=Math.sin(ph)*am,hxs=sw*4,rise=dzS(e/0.1);
  const hd=-1.5*am*Math.abs(Math.cos(ph));
  return{hx:hxs,lean:-sw*0.07,hd,
   lg:sd=>{const act=sd*sw<0,a=Math.abs(sw);
    return dzLeg(sd,dzFS-sd*hxs-(act?sd*a*3:0),act?a*5:0,hd)},
   arm:sd=>[sd*dzL(0.3,2.45,rise)-sw*0.5,
            sd*dzL(0.3,2.85,rise)-sw*0.7+0.22*Math.sin(ph*2+(sd<0?0:1.5))*am]};
 }
 if(id===2){ // Слайд на коленях
  const p=dzS(e/0.1),rise=dzS(e/0.14),pulse=Math.sin(e*TAU*3)*0.12*rise;
  return{hd:-22*p,lean:-dir*0.1*p,
   lg:sd=>({k:[sd*dzL(8,6.5,p),dzL(22.6,22,p)],f:[sd*dzL(14.3,11.5,p),dzL(43.7,24,p)]}),
   arm:sd=>[sd*(dzL(0.3,2.3,rise)+pulse),sd*(dzL(0.3,2.7,rise)+pulse)]};
 }
 if(id===3){ // Колесо: поза «звезда»
  const w=dzS((e-0.06)/0.06)*(1-dzS((e-0.72)/0.1)),ar=dzS(e/0.1);
  const hd=-4*Math.max(0,1-Math.abs(e-0.8)/0.06);
  return{hd,
   lg:sd=>dzMix(dzLeg(sd,dzFS,0,hd),{k:[sd*14,21],f:[sd*26,39]},w),
   arm:sd=>[sd*dzL(0.3,2.65,ar),sd*dzL(0.3,2.9,ar)]};
 }
 if(id===4){ // Сиуу: присед, прыжок с разворотом, широкая стойка, руки вниз
  const pre=dzS(e/0.16)*(1-dzS((e-0.16)/0.06)),w=(e-0.2)/0.3,air=w>0&&w<1?Math.sin(PI*w):0;
  const land=Math.max(0,1-Math.abs(e-0.54)/0.07),wide=dzS((e-0.5)/0.1);
  const hd=-(8*pre+6*land);
  return{hd,lg:sd=>dzLeg(sd,dzFS+4.5*wide-air*5+pre,air*10,hd),
   arm:sd=>{const up=dzS((e-0.17)/0.14),dn=dzS((e-0.5)/0.1);
    return[sd*dzL(dzL(0.25,2.6,up),0.5,dn),sd*dzL(dzL(0.25,2.9,up),0.45,dn)]}};
 }
 if(id===5){ // Кубок чемпиона
  const J=dzJ5(e),hd=-J.cr,rise=dzS(e/0.08),r=1-J.cr/6*0.45;
  return{cup:true,hd,lg:sd=>dzLeg(sd,10+J.cr*0.8-J.air*4,J.air*10,hd),
   arm:sd=>[sd*dzL(0.3,dzL(2.55,3.0,r),rise),sd*dzL(0.3,dzL(2.95,3.35,r),rise)]};
 }
 if(id===6){ // Волна: бегущая волна по рукам, плавное покачивание корпуса
  const am=dzS(e/0.1)*(1-dzS((e-0.82)/0.18)),ph=e*3*TAU,hxs=Math.sin(ph)*5*am,base=dzS(e/0.1);
  const hd=-2.2*(0.5+0.5*Math.sin(ph*2))*am;
  return{hx:hxs,lean:-Math.sin(ph-0.6)*0.1*am,hd,
   lg:sd=>dzLeg(sd,dzFS-sd*hxs,0,hd),
   arm:sd=>{const dl=sd>0?1.3:0,w=Math.sin(ph-dl),w2=Math.sin(ph-dl-0.7);
    return[sd*dzL(dzL(0.3,2.5,base),1.6+0.75*w,am),sd*dzL(dzL(0.3,2.8,base),1.6+0.95*w2,am)]}};
 }
 if(id===7){ // Сальто: присед, взмах, группировка, приземление
  const p=dzC((e-0.2)/0.6),pre=dzS(e/0.16)*(1-dzS((e-0.16)/0.06));
  const tuck=dzS((p-0.12)/0.2)*(1-dzS((p-0.68)/0.2)),landc=Math.max(0,1-Math.abs(e-0.86)/0.06);
  const hd=-(7*pre+6*landc)*(1-tuck);
  const armUp=dzS((e-0.16)/0.07)*(1-dzS((e-0.26)/0.05)),rise=dzS((e-0.84)/0.12);
  return{hd,
   lg:sd=>dzMix(dzLeg(sd,dzFS+3*pre,0,hd),{k:[sd*6,-8],f:[sd*6.5,14]},tuck),
   arm:sd=>{let a=0.25,b=0.2;
    a=dzL(a,2.9,armUp);b=dzL(b,3.0,armUp);
    a=dzL(a,0.3,tuck);b=dzL(b,0.05,tuck);
    a=dzL(a,2.5,rise);b=dzL(b,2.8,rise);
    return[sd*a,sd*b]}};
 }
 if(id===8){ // Робот: рваные шаги-позы, углы 90°
  const i=Math.min(7,Math.floor(e*8)),pi=Math.max(0,i-1),sn=dzC((e*8-i)/0.2);
  const cur=DZ_ROBO[i],prv=DZ_ROBO[pi],hd=-(i%2?1.2:0);
  const lf=(ii,sd)=>(ii%2===(sd<0?0:1))?4:0;
  return{hd,lean:dzL(DZ_ROBO_LEAN[pi],DZ_ROBO_LEAN[i],sn),
   lg:sd=>dzLeg(sd,dzFS-1,dzL(lf(pi,sd),lf(i,sd),sn),hd),
   arm:sd=>{const k=sd<0?'l':'r';return[sd*dzL(prv[k][0],cur[k][0],sn),sd*dzL(prv[k][1],cur[k][1],sn)]}};
 }
 if(id===9){ // Самолёт: разбег с раскинутыми руками и креном
  const vel=e<0.85?Math.pow(Math.sin(PI*e/0.85),0.7):0,ph=T*TAU*2.3,wing=dzS(e/0.1);
  return{lean:dir*0.12*vel,
   lg:sd=>dzLeg(sd,dzFS-3,Math.max(0,Math.sin(ph+(sd<0?0:PI)))*9*vel,0),
   arm:sd=>[sd*dzL(0.3,1.5+0.07*Math.sin(ph*0.5),wing),sd*dzL(0.3,1.55+0.07*Math.sin(ph*0.5+0.5),wing)]};
 }
 return{arm:sd=>[sd*2.55,sd*2.6]};
}

/* Смещение/поворот всего тела: dx,dy (px), rot (плоское вращение), flip (сальто), psi (разворот вокруг вертикальной оси) */
function danceMove(id,e,dir,s,k,front){

 else if(id===2){const v=dzC((e-0.08)/0.55);dx=dir*75*k*(1-Math.pow(1-v,2.3))}
 else if(id===3){const p=dzS((e-0.1)/0.62);rot=dir*2*PI*p;dx=dir*55*k*p;
  if(e>0.78&&e<0.9)dy=-Math.sin(PI*(e-0.78)/0.12)*8*s}
 else if(id===4){const w=dzC((e-0.2)/0.3);dy=-Math.sin(PI*w)*30*s;psi=(front?2:1)*PI*dzS(w)}
 else if(id===5)dy=-dzJ5(e).air*26*s;
 else if(id===7){const p=dzC((e-0.2)/0.6);dy=-Math.sin(PI*p)*36*s;flip=2*PI*(p*p*(3-2*p))}
 else if(id===9){const vel=e<0.85?Math.pow(Math.sin(PI*e/0.85),0.7):0,ph=e*2.6*2.3*PI*2;
  dx=dir*70*k*dzS(e/0.85);rot=dir*0.16*vel;dy=-Math.abs(Math.sin(ph))*2.5*s*vel}

}

function drawStriker(ctx,x,fy,o){

 {ico:'🌀',n:'Закрутка',sub:'Мяч огибает стенку и закручивается в ворота. Выбери, с какой стороны облетать стенку.',ms:1250,A:34,bow:58,wa:0,dip:0,err:1,kp:1,mr:.4,kt:.8,coin:3},
 {ico:'🌪️',n:'Наклбол',sub:'Без вращения: мяч «пляшет» в воздухе. Вратарю трудно, но и точность ниже.',ms:1150,A:24,bow:0,wa:15,dip:0,err:1.3,kp:.55,mr:.25,kt:.78,coin:5},
 {ico:'🍂',n:'Сухой лист',sub:'Мяч взлетает над стенкой и резко падает под перекладину.',ms:1500,A:118,bow:0,wa:0,dip:1,err:1.2,kp:.8,mr:.35,kt:.9,coin:5}];
const FK_H=640; // высота поля штрафных (у пенальти 520) — удар теперь с дальней дистанции
const FK_SPOTS=[[180,500],[118,468],[246,468],[88,540],[272,540],[160,432],[208,424]]; // 19–32 м от ворот, разные углы

function startFK(){
 const sp=FK_SPOTS.slice().sort(()=>Math.random()-.5);
 G={fk:1,round:1,goals:0,earned:0,streak:0,phase:'aim',celT:0,spots:sp,ti:0,dir:1,duel:null};
 fkSetup();playFK();
}
function fkSetup(){
 const s=G.spots[G.round-1];
 G.sx=s[0];G.sy=s[1];
 const off=Math.abs(G.sx-180);
 G.n=Math.max(3,Math.min(5,(off<40?5:4)-(G.sy>535?1:0)));         // чем ближе и центральнее — тем больше игроков в стенке
 G.hs=G.n*9+7;
 G.dk=(G.sy-220)/205;
 G.wy=G.sy-96;                                                     // стенка ровно в 9.15 м от мяча (30 px = 1 м → ~96 px)
 G.uw=96/(G.sy-220);
 // стенка закрывает БЛИЖНЮЮ штангу, вратарь смещается на открытую сторону
 const tx=off<35?180+(G.sx-180)*.5:(G.sx<180?84:276);
 G.wcx=G.sx+(tx-G.sx)*G.uw+(Math.random()-.5)*8;
 G.kOff=Math.max(-16,Math.min(16,(180-G.sx)*.22));
 G.aim=null;G.result=null;G.kTgt=null;G.react=undefined;G.celT=0;G.last=null;G.wj=false;G.phase='aim';
}
function playFK(){
 app(`<div class="hud"><span>Удар <b id="r">1</b>/5</span><span>Голы: <b id="g">0</b></span><span>🪙 <b id="c">0</b></span></div>
 <div class="stagewrap fk"><canvas id="cv" class="game" width="720" height="${FK_H*2}"></canvas><div id="ovl"></div></div>
 <div class="card" id="fkp"></div>
 <div class="row"><button class="btn btn2 grow" onclick="fkQuit()">🏳️ Завершить серию</button><button id="fkm" class="btn btn2 sndbtn" onclick="fkMute()">${AS.muted?'🔇':'🔊'}</button></div>
 <div class="small" style="text-align:center">1) Выбери удар → 2) Ткни в ворота (пунктир — путь мяча) → 3) Останови иглу в зелёной зоне. Стенка может подпрыгнуть!</div>`);
 $('app').style.maxWidth='560px';
 $('cv').getContext('2d').setTransform(2,0,0,2,0,0);
 updHud();aimUI();fkPanel();startIdleFK();
}

function fkMute(){AS.muted=!AS.muted;try{localStorage.setItem('goal_mute',AS.muted?'1':'0')}catch(e){}if(!AS.muted)AS.init();if(AS.master)AS.master.gain.value=AS.muted?0:1;const b=$('fkm');if(b)b.textContent=AS.muted?'🔇':'🔊'}

/* --- Панель выбора удара --- */
function fkPanel(){
 const b=$('fkp');if(!b)return;
 const on=G.phase==='aim'||G.phase==='power',T=FKT[G.ti];
 b.style.opacity=on?1:.5;
 b.innerHTML='<div class="tabs" style="flex-wrap:wrap">'+FKT.map((x,i)=>`<button class="tab ${G.ti===i?'on':''}" style="flex:1 1 45%" onclick="fkSel(${i})">${x.ico} ${x.n}</button>`).join('')+'</div>'
 +(T.bow?`<div class="tabs"><button class="tab ${G.dir<0?'on':''}" onclick="fkDir(-1)">↰ Облёт слева</button><button class="tab ${G.dir>0?'on':''}" onclick="fkDir(1)">Облёт справа ↱</button></div>`:'')
 +`<div class="small" style="text-align:center">${T.sub}</div>`;

function fkSel(i){if(G.phase!=='aim'&&G.phase!=='power')return;G.ti=i;fkAimed();}
function fkDir(d){if(G.phase!=='aim'&&G.phase!=='power')return;G.dir=d;fkPanel()}
function fkAimed(){if(FKT[G.ti].bow&&G.aim)G.dir=(70+G.aim.px>=180)?1:-1;fkPanel()} // вызывается из aim() после тапа по воротам

/* --- Траектория: ground-путь + дуга + боковой изгиб + «пляска» --- */
function fkPP(fx,fy,ph){const T=FKT[G.ti];return{sx:G.sx,sy:G.sy,fx,fy,bow:T.bow*G.dir,A:T.A*Math.pow(Math.max(1,G.dk||1),.75),dip:T.dip,wa:0,ph:ph||0}}
function fkPos(p,u){
 const s=Math.sin(Math.PI*u),b=p.dip?Math.sin(Math.PI*Math.pow(u,.8)):s;
 const w=p.wa?p.wa*Math.sin(6.283*(2.5*u+p.ph))*s:0;
 const gy=p.sy+(220-p.sy)*u,h=(220-p.fy)*u+p.A*b+w*.5;
 return{x:p.sx+(p.fx-p.sx)*u+p.bow*s+w,y:gy-h,h,gy};
}
function fkPreview(ctx){
 const pp=fkPP(70+G.aim.px,110+G.aim.py);
 ctx.fillStyle='rgba(255,255,255,.8)';
 for(let i=1;i<=14;i++){const p=fkPos(pp,i/15);ctx.beginPath();ctx.arc(p.x,p.y,1.7,0,7);ctx.fill()}
 ctx.strokeStyle='rgba(255,226,80,.95)';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(pp.fx,pp.fy,6,0,7);ctx.stroke();
}

/* --- Удар --- */
function fkKick(){
 cancelAnimationFrame(raf);
 const d=Math.abs(G.pv-.5);
 G.quality=d<GREEN_W()?'perfect':(d<.155?'good':'bad');
 AS.whistleSnd();fkResolve();
 G.phase='anim';$('ovl').innerHTML='';fkPanel();fkAnimate();
}
function fkResolve(){
 const q=G.quality,T=FKT[G.ti],pp=fkPP(0,0,Math.random()),colX=[106,180,254];
 let r=q==='good'?8+Math.random()*10:(q==='bad'?26+Math.random()*30:0);
 r=r*T.err+(q==='perfect'&&T.err>1?(T.err-1)*18*Math.random():0);
 const an=Math.random()*6.283;
 let fx=70+G.aim.px+Math.cos(an)*r,fy=110+G.aim.py+Math.sin(an)*r*.65;
 const sf=q==='perfect'?1:(q==='good'?.72:.5);
 G.fl=T.ms*(1.3-.3*sf)*Math.pow(Math.max(1,G.dk||1),.6);
 Object.assign(pp,{fx,fy,wa:T.wa});
 // --- стенка: прыгает на навесные удары; под прыгающую стенку можно пробить низом ---
 G.wj=Math.random()<(G.ti===3?.55:(G.ti===1?.4:.25));
 const lift=G.wj?16:0,pw=fkPos(pp,G.uw);
 if(Math.abs(pw.x-G.wcx)<G.hs&&pw.h<78+lift&&!(G.wj&&pw.h<lift-4)){
  G.result='wall';G.pp=pp;G.corner=false;G.coins=0;
  G.rb=[(Math.random()<.5?-1:1)*(25+Math.random()*45),90+Math.random()*50];
  G.react=.3;G.kTgt=mkTgt(colX[Math.floor(Math.random()*3)],165,.3);return;
 }
 G.miss=(fx<64||fx>296||fy<102||fy>226);G.fx=fx;G.fy=fy;G.pp=pp;
 if(!G.miss&&hitPost(fx,fy)){G.result='post';G.coins=0;G.react=.3;G.kTgt=mkTgt(fx*.6+72,Math.min(215,Math.max(120,fy))*.6+67,.8);return}
 // --- вратарь: стенка закрывает обзор, поэтому он стартует позже, чем на пенальти; закрутка/наклбол читаются хуже ---
 const fth=fx<143?-1:(fx>217?1:0);
 G.corner=Math.abs(fx-180)>74||fy<142;
 const misread=Math.random()<T.mr*(q==='perfect'?1.15:1);
 const g=misread?(fth===0?(Math.random()<.5?-1:1):(Math.random()<.6?0:-fth)):fth;
 const rt=.24+Math.random()*.1+(pw.h<78+lift?.06:0);
 const kb=BOOTS[P.look.boots].acc*.06;
 const sv=kpSolve(fx,fy,{tf:G.fl/1000,rt:rt,g:g,k0:G.kOff,pw:q==='perfect'?1.12:(q==='good'?1:.85),kp:T.kp*(1-kb),fl:SV.fk[q]});
 G.result=G.miss?'miss':(sv.saved?'save':'goal');
 G.react=Math.min(rt/(G.fl/1000),.5);
 if(sv.saved){
  const cx=Math.max(80,Math.min(280,fx)),cy=Math.max(118,Math.min(212,fy)),dir=Math.abs(cx-180)>30?Math.sign(cx-180):(Math.random()<.5?-1:1);
  G.fx=pp.fx=cx;G.fy=pp.fy=cy;
  G.defl={cx:cx+dir*(70+Math.random()*40),cy:cy+95+Math.random()*50};
  G.kTgt=mkTgt(cx,cy-26,1);G.react=Math.min(G.react,.45);
 }else G.kTgt=mkTgt(Math.max(85,Math.min(275,sv.kx)),sv.dir?168:176,sv.dxm<1.6?.9:.3);
 G.coins=G.result==='goal'?Math.round((15+(G.corner?5:0)+(q==='perfect'?5:0)+T.coin)*(1+clubBonus())):0;
}

/* --- Позиция мяча по прогрессу полёта bk (0..1 — полёт, >1 — после ворот) --- */
function fkBall(bk){
 const p=G.pp,u=Math.min(1,bk);
 if(bk<=0)return{bx:G.sx,by:G.sy,u:0,gy:G.sy+2};
 if(G.result==='wall'){
  const w=fkPos(p,Math.min(bk,G.uw));
  if(bk<=G.uw)return{bx:w.x,by:w.y,u:bk,gy:w.gy};
  const v=Math.min(1,(bk-G.uw)/.45),e=1-Math.pow(1-v,2);
  return{bx:w.x+G.rb[0]*e,by:w.y+G.rb[1]*e-Math.sin(v*Math.PI)*22,u:G.uw,gy:w.y+G.rb[1]*e+10};
 }
 const w=fkPos(p,u);let bx=w.x,by=w.y;
 if(bk>1){
  const v=Math.min(1,(bk-1)/.35);
  if(G.result==='goal')by+=10*Math.min(1,v*3);
  else if(G.result==='save'){bx=G.fx+(G.defl.cx-G.fx)*v;by=G.fy+(G.defl.cy-G.fy)*v-Math.sin(v*Math.PI)*14}
  else if(G.result==='post'){bx=G.fx+(G.fx-180)*.6*v;by=G.fy+160*v-Math.sin(v*Math.PI)*26}
 }
 return{bx,by,u,gy:w.gy};
}

function fkAnimate(){
 stopIdle();
 const ctx=$('cv').getContext('2d'),t0=performance.now(),F=G.fl,TR=550,TK=380,L=TR+TK*.5,trail=[],fired={},once=(n,f)=>{if(!fired[n]){fired[n]=1;f()}};
 const endBk=G.result==='wall'?G.uw+.5:1.35;
 const step=(tm)=>{
  if(!G||!G.fk||!$('cv'))return;
  const el=Math.max(0,tm-t0),runK=Math.min(1,el/TR),kickK=Math.max(0,Math.min(1,(el-TR)/TK)),bk=Math.max(0,(el-L)/F);
  const b=fkBall(bk);
  if(bk>0)once('k',()=>AS.kickSnd());
  const R=G.result;
  if(R==='wall'){if(bk>=G.uw)once('h',()=>AS.wallSnd());if(bk>=G.uw+.3)once('b',()=>AS.bounceSnd())}
  else if(R==='save'){if(bk>=.95)once('h',()=>AS.saveSnd());if(bk>=1.2)once('b',()=>AS.bounceSnd())}
  else if(R==='post'){if(bk>=1)once('h',()=>AS.postSnd());if(bk>=1.22)once('b',()=>AS.bounceSnd())}
  else if(R==='goal'){if(bk>=1)once('h',()=>AS.netSnd())}
  else if(bk>=1)once('h',()=>AS.missSnd());
  if(bk>0){trail.push([b.bx,b.by]);if(trail.length>7)trail.shift()}
  const keepK=Math.max(0,Math.min(1,(bk-G.react)/(.95-G.react))),land=Math.max(0,Math.min(1,(bk-.95)/.35));
  const fr={t:tm/1000,bk,bx:b.bx,by:b.by,gy:b.gy,ballK:Math.min(1,b.u),keepK,land,runK,kickK,
   kx:G.sx-28*(1-runK),ky:G.sy+25+45*(1-runK)-6*kickK,impact:el>L?Math.max(0,1-(el-L)/110):0,
   netT:(G.result==='goal'&&bk>1)?(bk-1)*F/1000:0,trail:trail.slice(0,-1)};
  G.last=fr;drawFK(ctx,fr);
  if(bk<endBk)requestAnimationFrame(step);else{G.phase='result';fkFinish()}
 };
 requestAnimationFrame(step);
}
function fkCel(){
 stopCel();const cv=$('cv');if(!cv||!G||!G.last)return;
 const ctx=cv.getContext('2d'),id=P.look.dance||0;
 const lp=(tm)=>{
  if(!G||!G.fk||G.phase!=='result'||G.result!=='goal'||!$('cv')){celRaf=null;return}
  const u=(performance.now()-G.celT)/2600;
  drawFK(ctx,Object.assign({},G.last,{t:tm/1000,impact:0,trail:[],netT:(G.last.netT||0)+(performance.now()-G.celT)/1000,dance:{id,u:Math.min(1,u)}}));
  celRaf=requestAnimationFrame(lp);
 };
 celRaf=requestAnimationFrame(lp);
}

 save();updHud();checkAch();fkPanel();
 const msgs={goal:`ГОЛ! ⚽ +${G.coins} 🪙`,save:'СЕЙВ! 🧤',miss:G.fy<102?'НАД ПЕРЕКЛАДИНОЙ! ❌':'МИМО! ❌',post:'ШТАНГА! 😱',wall:'В СТЕНКУ! 🧱'};
 const col={goal:'var(--good)',save:'var(--accent)',miss:'var(--bad)',post:'var(--gold)',wall:'var(--bad)'};
 $('ovl').innerHTML=`<div class="result" style="justify-content:flex-start;padding-top:${250/FK_H*100}%"><div class="rtext" style="color:${col[G.result]}">${msgs[G.result]}</div>
  <button class="btn" style="width:auto;padding:12px 28px" onclick="fkNext()">Дальше →</button></div>`;
}

 if(G.round>=5){fkEnd();return}
 G.round++;fkSetup();updHud();aimUI();fkPanel();startIdleFK();
}
function fkEnd(){
 stopIdle();
 let bonus=0;if(G.goals===5){bonus=40;P.coins+=bonus}
 dqTrack({k:'s',m:'fk',goals:G.goals});
 save();checkAch();
 app(`<h1>🏁 Серия штрафных</h1>
