/* --- Игрок из стенки --- */
function wallMan(ctx,x,fy,s,j,seed,t){
 fy-=j;
 const sk=['#f2d3b3','#d9a06b','#b97a4e','#8a5a33'][seed%4],SH='#1d4ed8',hip={x,y:fy-44*s},sho={x,y:hip.y-25*s};
 softShadow(ctx,x,fy+j+1.5*s,14*s,4.2*s,.36);
 [-1,1].forEach(sd=>{
  const kn={x:x+sd*5*s,y:hip.y+22*s},fo={x:x+sd*6*s,y:fy-3*s};
  limbShape(ctx,{x:x+sd*4*s,y:hip.y},kn,10*s,7*s,sk);limbShape(ctx,kn,fo,7*s,5*s,SH,shade(SH,-.25));
  ctx.fillStyle='#0d0f12';ctx.beginPath();ctx.ellipse(fo.x+sd*1.5*s,fo.y+2*s,5*s,2.6*s,0,0,7);ctx.fill();
 });
 ctx.fillStyle='#f3f4f6';rrect(ctx,x-9.5*s,hip.y-5*s,19*s,14*s,3*s);ctx.fill();
 const g=ctx.createLinearGradient(x-12*s,0,x+12*s,0);g.addColorStop(0,shade(SH,-.28));g.addColorStop(.4,shade(SH,.2));g.addColorStop(1,shade(SH,-.3));
 jerseyPath(ctx,hip,sho,8.4*s,12.5*s,s);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(6,10,16,.6)';ctx.lineWidth=1;ctx.stroke();
 ctx.save();ctx.clip();clothFolds(ctx,sho,hip,s*.9,10*s);ctx.restore();
 [-1,1].forEach(sd=>{ // руки прикрывают пах
  const sp={x:x+sd*11*s,y:sho.y+2*s},el={x:x+sd*9*s,y:sho.y+14*s},ha={x:x+sd*2*s,y:hip.y+4*s};
  limbShape(ctx,sp,el,7*s,5*s,SH);limbShape(ctx,el,ha,5*s,4*s,sk);
 });
 const hc={x,y:sho.y-12*s};
 ctx.fillStyle=sk;ctx.beginPath();ctx.arc(hc.x,hc.y,7.2*s,0,7);ctx.fill();ctx.strokeStyle='rgba(6,10,16,.6)';ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle='#241a10';ctx.beginPath();ctx.arc(hc.x,hc.y-.6*s,7.4*s,Math.PI*1.02,Math.PI*1.98);ctx.fill();
 ctx.fillStyle='#1b1b1b';[-2.6,2.6].forEach(e=>{ctx.beginPath();ctx.arc(hc.x+e*s,hc.y+.4*s,.9*s,0,7);ctx.fill()});
}

/* --- Кадр сцены штрафного --- */
function drawFK(ctx,a){
 ctx=ctx||$('cv').getContext('2d');a=a||{};
 const t=a.t||0,cel=G.celT?Math.max(0,1-(performance.now()-G.celT)/1800):0;
 if(cel>0){const sh=cel*2.6;ctx.save();ctx.translate(Math.sin(t*55)*sh,Math.cos(t*42)*sh*.6)}
 stadium(ctx,t,360,520);stands(ctx,t,cel);scoreboard(ctx,t);boards(ctx,t);pitch(ctx,360,FK_H);stadiumFx(ctx,t,FK_H);
 goal(ctx,a);drawKeeper(ctx,a);
 ctx.strokeStyle='#f8f8f8';ctx.lineWidth=6;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(70,220);ctx.lineTo(70,110);ctx.lineTo(290,110);ctx.lineTo(290,220);ctx.stroke();
 const jp=G.wj&&a.bk!==undefined?Math.max(0,Math.min(1,(a.bk-(G.uw-.15))/.3)):0,jh=Math.sin(Math.PI*jp)*16;
 ctx.save();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(G.wcx-G.hs-8,G.wy+3);ctx.lineTo(G.wcx+G.hs+8,G.wy+3);ctx.stroke();ctx.restore();
 for(let i=0;i<G.n;i++)wallMan(ctx,G.wcx+(i-(G.n-1)/2)*18,G.wy,.82,jh,i+G.round,t);
 drawStriker(ctx,a.kx!==undefined?a.kx:G.sx-28,a.ky!==undefined?a.ky:G.sy+70,{run:a.runK||0,kick:a.kickK||0,scale:1.25,t,dance:a.dance,dir:1});
 if(G.phase==='power'&&G.aim)fkPreview(ctx);
 const bx=a.bx!==undefined?a.bx:G.sx,by=a.by!==undefined?a.by:G.sy,bk=a.ballK||0,goalNet=G.result==='goal'&&a.netT>0;
 if(!goalNet){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bx,a.gy!==undefined?a.gy:G.sy+2,Math.max(4,11-5*bk),Math.max(1.5,4.4-1.8*bk),0,0,7);ctx.fill()}
 const bo={bx,by,ballK:bk,trail:a.trail,t,noShadow:true,sc:1.1,netT:a.netT};
 ball(ctx,goalNet?netBall(bo):bo);
 if(a.impact>0){const im=a.impact;ctx.save();ctx.translate(G.sx,G.sy);ctx.strokeStyle='rgba(255,255,255,'+(im*.9)+')';ctx.lineWidth=2;ctx.lineCap='round';
  for(let i=0;i<10;i++){const an=i*.628+.3,r1=9+(1-im)*12,r2=r1+8*im+3;ctx.beginPath();ctx.moveTo(Math.cos(an)*r1,Math.sin(an)*r1*.7);ctx.lineTo(Math.cos(an)*r2,Math.sin(an)*r2*.7);ctx.stroke()}
  ctx.restore()}
 snowfall(ctx,t,FK_H);
 if(cel>0){confetti(ctx,t,cel);ctx.restore()}
}

/* ===== ПРИГЛАШЕНИЕ ДРУЗЕЙ: карточка + ссылка ===== */
// ⚠️ ВПИШИ СВОЮ ССЫЛКУ на Mini App: https://t.me/ИМЯ_БОТА/КОРОТКОЕ_ИМЯ_ПРИЛОЖЕНИЯ
// (если у приложения нет короткого имени — просто https://t.me/ИМЯ_БОТА)
const BOT_LINK='https://t.me/goalbossikbot';
const toHex=s=>Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,'0')).join('');
const fromHex=h=>{try{return new TextDecoder().decode(new Uint8Array(h.match(/../g).map(x=>parseInt(x,16))))}catch(e){return''}};
function inviteLink(){const tme=BOT_LINK.indexOf('t.me/')>=0,v=UID+'_'+toHex(P.name);return BOT_LINK+(BOT_LINK.indexOf('?')>=0?'&':'?')+(tme?'startapp=ref_'+v:'ref='+v)}
function inviteText(){return '⚽ Я '+P.name+' в GOAL! Забил '+P.goals+' голов. Сможешь лучше? Го играть 👇'}

/* Друг пришёл по ссылке → автоматически отправляем запрос в друзья */
function refInit(){
 try{
  let sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;
  if(!sp){const q=new URLSearchParams(location.search).get('ref');if(q)sp='ref_'+q}
  if(!sp||sp.indexOf('ref_')!==0||window._refOnce)return;
  window._refOnce=1;
  const m=sp.slice(4).split('_'),uid=m[0],name=(fromHex(m[1]||'')||'Друг').slice(0,12);
  if(!uid||uid===UID||P.refd===uid)return;
  P.refd=uid;save();
  addFriend(uid,name);
 }catch(e){}
}

/* Рисуем карточку игрока (PNG 720×1040) */
function inviteCard(){
 const W=720,H=1040,c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d'),F='-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
 const lg=(x0,y0,x1,y1,st)=>{const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};
 const GOLD=(y0,y1)=>lg(0,y0,0,y1,[[0,'#fff6bd'],[.5,'#ffd54a'],[1,'#d99a14']]);
 x.fillStyle=lg(0,0,0,H,[[0,'#070d14'],[.5,'#0f2b44'],[1,'#0b3a22']]);x.fillRect(0,0,W,H);
 // лучи прожекторов
 x.fillStyle=lg(0,0,0,720,[[0,'rgba(255,244,200,.22)'],[1,'rgba(255,244,200,0)']]);
 x.beginPath();x.moveTo(40,0);x.lineTo(160,0);x.lineTo(520,720);x.lineTo(120,720);x.fill();
 x.beginPath();x.moveTo(560,0);x.lineTo(680,0);x.lineTo(600,720);x.lineTo(200,720);x.fill();
 // газон
 for(let i=0;i<8;i++){x.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.08)';x.fillRect(0,H*.62+i*(H*.38/8),W,H*.38/8)}
 x.strokeStyle='rgba(255,255,255,.09)';x.lineWidth=4;x.beginPath();x.ellipse(W/2,H*.93,280,70,0,0,7);x.stroke();
 const rg=x.createRadialGradient(W/2,310,20,W/2,310,360);rg.addColorStop(0,'rgba(42,171,238,.42)');rg.addColorStop(1,'rgba(42,171,238,0)');
 x.fillStyle=rg;x.fillRect(0,0,W,680);
 // золотая рамка
 x.lineWidth=10;x.strokeStyle=lg(0,0,W,H,[[0,'#fff0a6'],[.5,'#b9811a'],[1,'#ffd54a']]);rrect(x,14,14,W-28,H-28,36);x.stroke();
 x.lineWidth=2;x.strokeStyle='rgba(0,0,0,.55)';rrect(x,26,26,W-52,H-52,26);x.stroke();
 x.textAlign='center';x.textBaseline='alphabetic';
 // заголовок
 x.save();x.shadowColor='rgba(0,0,0,.65)';x.shadowBlur=14;x.shadowOffsetY=6;x.fillStyle=lg(0,50,0,112,[[0,'#ffffff'],[1,'#9fd4ff']]);x.font='italic 900 72px '+F;x.fillText('GOAL 🥅',W/2,114);x.restore();
 // аватар в металлическом кольце
 x.save();x.shadowColor='rgba(0,0,0,.65)';x.shadowBlur=30;x.shadowOffsetY=12;x.fillStyle='#000';x.beginPath();x.arc(W/2,310,158,0,7);x.fill();x.restore();
 x.fillStyle=lg(W/2-160,150,W/2+160,470,[[0,'#fff6bd'],[.5,'#b9811a'],[1,'#ffe48a']]);x.beginPath();x.arc(W/2,310,160,0,7);x.fill();
 x.fillStyle='#0b1420';x.beginPath();x.arc(W/2,310,150,0,7);x.fill();
 const av=document.createElement('canvas');av.width=av.height=336;
 try{drawFace(av.getContext('2d'),336)}catch(e){}
 x.save();x.beginPath();x.arc(W/2,310,144,0,7);x.clip();x.drawImage(av,W/2-144,166,288,288);x.restore();
 // имя, клуб
 let nm=P.name,fs=60;x.font='800 '+fs+'px '+F;while(x.measureText(nm).width>600&&fs>30){fs-=4;x.font='800 '+fs+'px '+F}
 x.save();x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=10;x.shadowOffsetY=4;x.fillStyle='#fff';x.fillText(nm,W/2,548);x.restore();
 x.fillStyle='#a9bacb';x.font='600 30px '+F;x.fillText('№'+P.number+' · '+CLUBS[P.club].n,W/2,594);
 // плашки статистики
 const st=[['Голов',P.goals||0],['Рекорд серии',P.best||0],['Штрафных',P.fk||0]];
 st.forEach((s,i)=>{
  const bx=40+i*220;
  x.save();x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=18;x.shadowOffsetY=8;x.fillStyle=lg(0,634,0,754,[[0,'#2f3f52'],[1,'#121b26']]);rrect(x,bx,634,200,120,22);x.fill();x.restore();
  x.lineWidth=2;x.strokeStyle='rgba(255,255,255,.18)';rrect(x,bx,634,200,120,22);x.stroke();
  x.fillStyle='rgba(255,255,255,.07)';rrect(x,bx+5,638,190,42,18);x.fill();
  x.fillStyle=GOLD(668,712);x.font='italic 900 54px '+F;x.fillText(String(s[1]),bx+100,704);
  x.fillStyle='#a9bacb';x.font='600 22px '+F;x.fillText(s[0],bx+100,738);
 });
 // вызов
 x.save();x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=10;x.shadowOffsetY=4;x.fillStyle='#fff';x.font='800 40px '+F;x.fillText('Бросаю тебе вызов!',W/2,826);x.restore();
 x.fillStyle='#c9d6e3';x.font='600 30px '+F;x.fillText('Сможешь забить больше? ⚽',W/2,872);
 // золотая кнопка и ссылка
 x.save();x.shadowColor='rgba(241,170,15,.45)';x.shadowBlur=26;x.shadowOffsetY=8;x.fillStyle=lg(0,904,0,980,[[0,'#fff0a6'],[.4,'#ffcf3f'],[.75,'#e4a11a'],[1,'#c88410']]);rrect(x,110,904,500,76,38);x.fill();x.restore();
 x.lineWidth=2;x.strokeStyle='rgba(255,255,255,.55)';rrect(x,112,906,496,72,36);x.stroke();
 x.fillStyle='#3a2406';x.font='900 36px '+F;x.fillText('▶  Играть',W/2,954);
 x.fillStyle='#8fa3b8';x.font='600 24px '+F;x.fillText(BOT_LINK.replace('https://',''),W/2,1012);
 return c;
}

function shareScr(){
 const ok=BOT_LINK.indexOf('YOUR_BOT')<0,lnk=ok?inviteLink().replace('https://',''):'';
 app(`<div class="rwt" style="margin-top:4px">Пригласить друзей</div>
 <div class="rws" style="margin-top:-6px">Отправь свою карточку игрока — друг откроет игру и сразу окажется у тебя в друзьях.</div>
 <div class="shstage"><div class="shcard"><img id="shimg" alt="Карточка"></div></div>
 ${ok?`<div class="shlink"><span class="shl">${esc(lnk)}</span><button class="fxb" onclick="copyInvite()">Копировать</button></div>`:'<div class="fxe" style="color:var(--bad)">⚠️ Впиши свою ссылку в BOT_LINK в коде игры</div>'}
 <button class="fxb big" onclick="shareTg()">📨 Отправить в Telegram</button>
 <button class="fxb no big" onclick="shareImg()">🖼️ Поделиться картинкой</button>
 <div class="shsteps"><div><i>1</i>Отправь ссылку</div><div><i>2</i>Друг заходит в игру</div><div><i>3</i>Вы в друзьях 🤝</div></div>
 <button class="btn btn2" onclick="home()">← Назад</button>`);
 try{const c=inviteCard();window._shCanvas=c;$('shimg').src=c.toDataURL('image/png')}catch(e){const i=$('shimg');if(i)i.alt='Не удалось нарисовать карточку'}
}
function shareTg(){
 const u='https://t.me/share/url?url='+encodeURIComponent(inviteLink())+'&text='+encodeURIComponent(inviteText());
 try{if(tg&&tg.openTelegramLink){tg.openTelegramLink(u);return}}catch(e){}
 window.open(u,'_blank');
}
function shareImg(){
 const c=window._shCanvas;if(!c)return;
 c.toBlob(async b=>{
  if(!b)return;
  try{
   const f=new File([b],'goal-card.png',{type:'image/png'});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:inviteText()+'\n'+inviteLink()});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  shareImgFull();
 },'image/png');
}
function shareImgFull(){
 const c=window._shCanvas;if(!c||$('shfull'))return;
 const d=document.createElement('div');d.id='shfull';
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px';
 d.innerHTML='<img src="'+c.toDataURL('image/png')+'" style="max-width:100%;max-height:72vh;border-radius:14px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default"><div class="small" style="text-align:center;color:#fff">Зажми картинку и сохрани, потом отправь другу.<br>Ссылку можно скопировать кнопкой ниже.</div><div class="row" style="width:100%;max-width:340px"><button class="btn" onclick="copyInvite()">📋 Ссылка</button><button class="btn btn2" onclick="$(\'shfull\').remove()">Закрыть</button></div>';
 document.body.appendChild(d);
}
async function copyInvite(){
 const u=inviteLink();
 try{await navigator.clipboard.writeText(u);toast('📋 Ссылка скопирована');return}catch(e){}
 try{const t=document.createElement('textarea');t.value=u;t.style.cssText='position:fixed;opacity:0;user-select:text';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('📋 Ссылка скопирована')}
 catch(e){prompt('Скопируй ссылку:',u)}
}

nav();
</script>
